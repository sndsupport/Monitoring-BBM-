<script>
// ==========================================
// FLAZZ SCRIPTS
// ==========================================

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escUrl(v) {
  var s = esc(v);
  if (/^(https:\/\/drive\.google\.com|https:\/\/lh3\.googleusercontent\.com|data:image\/)/.test(s)) return s;
  if (/^https:\/\//.test(s)) return s;
  return '';
}
function openPrintWindowFor(html) {
  var f = document.createElement('iframe');
  f.style.position = 'fixed';
  f.style.right = '0';
  f.style.bottom = '0';
  f.style.width = '0';
  f.style.height = '0';
  f.style.border = '0';
  f.srcdoc = html;
  document.body.appendChild(f);
  f.onload = function() {
    setTimeout(function() {
      try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { console.error('print gagal', e); }
    }, 350);
  };
}

let flazzDataCache = null;
let __flazzFilterCabang = '';
let __flazzHistStart = '';
let __flazzHistEnd = '';

function bbmToken() {
  return localStorage.getItem('bbm_token') || '';
}
function flazzUserInfo() {
  var u = (typeof userInfo !== 'undefined' && userInfo) ? userInfo : {};
  var loginName = document.getElementById('login_username') ? document.getElementById('login_username').value : '';
  return { username: u.username || loginName || '', nama: u.nama || '', role: u.role || '', cabang: u.cabang || '' };
}

function flazzFailHandler(label, resetBtnIds) {
  return function(err) {
    var msg = (err && err.message) ? err.message : (err ? String(err) : 'Terjadi kesalahan server');
    showToast(label + ': ' + msg, 'error');
    (resetBtnIds || []).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.disabled = false; el.innerHTML = el.dataset.origHtml || el.innerHTML; }
    });
  };
}

function loadFlazzDashboard() {
  document.getElementById('flazz-dashboard-loading').style.display = 'block';
  document.getElementById('flazz-dashboard-content').style.display = 'none';

  google.script.run
    .withSuccessHandler(function(res) {
       flazzDataCache = res;
       document.getElementById('flazz-dashboard-loading').style.display = 'none';
       document.getElementById('flazz-dashboard-content').style.display = 'block';
       
       renderFlazzDashboardCards(res);
       renderFlazzMasterTable(res.cards);
       populateFlazzDropdowns(res);
       renderFlazzHistory(res);
    })
    .withFailureHandler(function(err) {
       showToast("Gagal memuat data Flazz: " + err, 'error');
       document.getElementById('flazz-dashboard-loading').style.display = 'none';
    })
    .apiGetFlazzDashboardData(bbmToken());
}

// Override loadFlazzDashboard call in switchTab if needed. We can just patch switchTab to call this.
function loadFlazzDataWrapper(force) {
   populateFlazzWidgets();
   if (!force && flazzDataCache) {
      document.getElementById('flazz-dashboard-loading').style.display = 'none';
      document.getElementById('flazz-dashboard-content').style.display = 'block';
      renderFlazzDashboardCards(flazzDataCache);
      renderFlazzMasterTable(flazzDataCache.cards);
      populateFlazzDropdowns(flazzDataCache);
      renderFlazzHistory(flazzDataCache);
      __flazzListingData = flazzDataCache;
      if (typeof renderFlazzListingTable === 'function') renderFlazzListingTable();
      return;
   }
   var rid = ++__flazzRequestId;
   document.getElementById('flazz-dashboard-loading').style.display = 'block';
   document.getElementById('flazz-dashboard-content').style.display = 'none';

   google.script.run
    .withSuccessHandler(function(res) {
       if (rid !== __flazzRequestId) return; // respons lama diabaikan
       flazzDataCache = res;
       document.getElementById('flazz-dashboard-loading').style.display = 'none';
       document.getElementById('flazz-dashboard-content').style.display = 'block';
       
       renderFlazzDashboardCards(res);
       renderFlazzMasterTable(res.cards);
       populateFlazzDropdowns(res);
       renderFlazzHistory(res);
       __flazzListingData = res;
       if (typeof renderFlazzListingTable === 'function') renderFlazzListingTable();
    })
    .withFailureHandler(function(err) {
      if (rid !== __flazzRequestId) return;
      document.getElementById('flazz-dashboard-loading').style.display = 'none';
      document.getElementById('flazz-dashboard-content').style.display = 'block';
      showToast('Gagal memuat data Flazz: ' + (err && err.message || err), 'error');
    })
    .apiGetFlazzDashboardData(bbmToken());
}

function populateFlazzWidgets() {
  var isSuper = typeof userRole !== 'undefined' && userRole === 'SUPERADMIN';
  var listingWrap = document.getElementById('flazz-listing-cabang-wrap');
  var histWrap = document.getElementById('flazz-history-filter-wrap');
  if (isSuper) {
    if (listingWrap && listingWrap.style.display === 'none') listingWrap.style.display = '';
    if (histWrap && histWrap.style.display === 'none') histWrap.style.display = '';
    if (typeof fillCabangSelect === 'function') {
      fillCabangSelect(document.getElementById('flazz-listing-filter-cabang'));
      fillCabangSelect(document.getElementById('flazz-history-filter-cabang'));
    }
    var lSel = document.getElementById('flazz-listing-filter-cabang');
    if (lSel) lSel.value = __flazzFilterCabang;
    var hSel = document.getElementById('flazz-history-filter-cabang');
    if (hSel) hSel.value = __flazzFilterCabang;
  } else {
    if (listingWrap) listingWrap.style.display = 'none';
    if (histWrap) histWrap.style.display = 'none';
  }
}

function onFlazzListingCabangChange() {
  var sel = document.getElementById('flazz-listing-filter-cabang');
  __flazzFilterCabang = sel ? sel.value : '';
  var hSel = document.getElementById('flazz-history-filter-cabang');
  if (hSel) hSel.value = __flazzFilterCabang;
  flazzDataCache = null;
  loadFlazzDataWrapper(true);
}

function onFlazzHistoryFilterChange() {
  var sel = document.getElementById('flazz-history-filter-cabang');
  if (sel) {
    __flazzFilterCabang = sel.value;
    var lSel = document.getElementById('flazz-listing-filter-cabang');
    if (lSel) lSel.value = __flazzFilterCabang;
  }
  var s = document.getElementById('flazz-history-filter-start');
  __flazzHistStart = s ? s.value : '';
  var e = document.getElementById('flazz-history-filter-end');
  __flazzHistEnd = e ? e.value : '';
  flazzDataCache = null;
  loadFlazzDataWrapper(true);
}

function renderFlazzDashboardCards(data) {
  let cards = data.cards || [];
  let totalCards = cards.length;
  let activeCards = cards.filter(c => c.status === 'SEDANG_DIGUNAKAN').length;
  let totalBalance = cards.reduce((sum, c) => sum + (parseFloat(c.last_balance) || 0), 0);

  let html = `
    <div class="col-md-4">
       <div class="card bg-primary text-white border-0 shadow-sm rounded-4 h-100">
         <div class="card-body">
           <h6 class="text-white-50 mb-1">Total Kartu Aktif</h6>
           <h3 class="fw-bold mb-0 text-white">${activeCards} <small class="fs-6 fw-normal text-white-50">dari ${totalCards}</small></h3>
         </div>
       </div>
    </div>
    <div class="col-md-4">
       <div class="card bg-success text-white border-0 shadow-sm rounded-4 h-100">
         <div class="card-body">
           <h6 class="text-white-50 mb-1">Total Saldo (Seluruh Kartu)</h6>
           <h3 class="fw-bold mb-0 text-white">${formatCurrency(totalBalance)}</h3>
         </div>
       </div>
    </div>
    <div class="col-md-4">
       <div class="card bg-info text-white border-0 shadow-sm rounded-4 h-100">
         <div class="card-body">
           <h6 class="text-white-50 mb-1">Top Up Terakhir</h6>
           <h5 class="fw-bold mb-0">${data.topups.length > 0 ? formatCurrency(data.topups[0].amount) + ' (' + formatDateShort(data.topups[0].date) + ')' : '-'}</h5>
         </div>
       </div>
    </div>
  `;
  document.getElementById('flazz-summary-cards').innerHTML = html;

  let alertContainer = document.getElementById('flazz-dashboard-alert');
  if (alertContainer) {
    if (activeCards > 0) {
      alertContainer.innerHTML = `
        <div class="alert alert-warning d-flex align-items-center mb-3 rounded-4 shadow-sm" role="alert">
          <i class="bi bi-exclamation-triangle-fill fs-4 me-3"></i>
          <div>
            <strong>Peringatan!</strong> Ada <strong>${activeCards} kartu Flazz</strong> berstatus "Sedang Digunakan". 
            Jika fisik kartu sudah dikembalikan oleh supir ke Admin, Anda mungkin terlewat melakukan <a href="#" onclick="switchTab('flazz-recon'); return false;" class="alert-link text-decoration-underline">Rekonsiliasi Flazz</a> hari ini.
          </div>
        </div>
      `;
    } else {
      alertContainer.innerHTML = '';
    }
  }

  let tbody = document.getElementById('flazz-dashboard-table');
  tbody.innerHTML = '';
  cards.forEach(c => {
    let tr = document.createElement('tr');
    let badgeClass = c.status === 'SEDANG_DIGUNAKAN' ? 'bg-warning' : (c.status === 'TERSEDIA' ? 'bg-success' : 'bg-secondary');
    tr.innerHTML = `
      <td class="fw-bold">${esc(c.card_number)}</td>
      <td>${esc(c.card_type)}</td>
      <td>${esc(c.driver_id || '-')}</td>
      <td class="fw-bold">${formatCurrency(c.last_balance)}</td>
      <td><span class="badge ${badgeClass}">${esc(c.status)}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

function renderFlazzMasterTable(cards) {
  let tbody = document.getElementById('flazz-master-table');
  if(!tbody) return;
  tbody.innerHTML = '';
  cards.forEach(c => {
    let tr = document.createElement('tr');
    let badgeClass = c.status === 'SEDANG_DIGUNAKAN' ? 'bg-warning' : (c.status === 'TERSEDIA' ? 'bg-success' : 'bg-secondary');
    tr.innerHTML = `
      <td><small class="text-muted">${esc(c.id)}</small></td>
      <td class="fw-bold">${esc(c.card_number)}</td>
      <td>${esc(c.card_name || '-')}</td>
      <td>${esc(c.card_type || '-')}</td>
      <td><span class="badge ${c.card_role === 'UTAMA' ? 'bg-primary' : 'bg-secondary'}">${esc(c.card_role || 'CADANGAN')}</span></td>
      <td>${esc(c.branch_id)}</td>
      <td class="fw-bold">${formatCurrency(c.last_balance)}</td>
      <td><span class="badge ${badgeClass}">${esc(c.status)}</span></td>
      <td class="text-center">
         <button class="btn btn-sm btn-outline-primary" onclick="editFlazzCard('${c.id}')" title="Edit" aria-label="Edit kartu"><i class="bi bi-pencil"></i></button> 
         ${c.status === 'NONAKTIF' 
           ? `<button class="btn btn-sm btn-outline-success" onclick="activateFlazzCardClient('${c.id}')" title="Aktifkan Kembali" aria-label="Aktifkan kembali kartu"><i class="bi bi-arrow-counterclockwise"></i></button>`
           : `<button class="btn btn-sm btn-outline-danger" onclick="deleteFlazzCardClient('${c.id}')" title="Nonaktifkan" aria-label="Nonaktifkan kartu"><i class="bi bi-trash"></i></button>`
         }
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function renderFlazzMasterSearch(q) {
  q = (q || '').toLowerCase();
  document.querySelectorAll('#flazz-master-table tr').forEach(function(tr) {
    var text = tr.textContent.toLowerCase();
    tr.style.display = (!q || text.indexOf(q) >= 0) ? '' : 'none';
  });
}

function populateFlazzDropdowns(data) {
  let cards = data.cards || [];
  
  // Topup form
  let tCard = document.getElementById('t_card_id');
  if(tCard) tCard.innerHTML = '<option value="">Pilih Kartu...</option>';
  
  // Top up: semua kartu aktif (bisa top up kapan saja)
  cards.filter(c => c.status !== 'NONAKTIF').forEach(c => {
     let opt = `<option value="${esc(c.id)}">${esc(c.card_number)} ${c.driver_id ? '['+esc(c.driver_id)+']' : ''} - ${formatCurrency(c.last_balance)}</option>`;
     if(tCard) tCard.innerHTML += opt;
  });

  // Recon form (kartu yang sedang digunakan ATAU punya usage DIBERIKAN yang belum kembali,
  // untuk menangani kondisi macet: status kartu sudah TERSEDIA tapi usage belum DIKEMBALIKAN)
  let rCard = document.getElementById('r_card_id');
  if(rCard) {
    const openUsageCards = new Set((data.usages || [])
      .filter(u => u.status === 'DIBERIKAN')
      .map(u => String(u.card_id)));
    rCard.innerHTML = '<option value="">Pilih Kartu...</option>';
    cards.filter(c => c.status === 'SEDANG_DIGUNAKAN' || openUsageCards.has(String(c.id))).forEach(c => {
       rCard.innerHTML += `<option value="${esc(c.id)}" data-balance="${esc(c.last_balance)}">${esc(c.card_number)} [${esc(c.driver_id)}] - Saldo: ${formatCurrency(c.last_balance)}</option>`;
    });
  }
}

// Hitung saldo sistem untuk rekonsiliasi dari ledger (pola sama dengan server),
// agar angka pratinjau sesuai dengan yang disimpan saat "Selesaikan Rekonsiliasi".
// Periode = transaksi yang TERCATAT setelah penyerahan kartu (used_at), memakai kolom
// timestamp pencatatan (created_at / timestamp) bukan tanggal input, agar transaksi yang
// sudah masuk opening_balance tidak dihitung dua kali.
function computeClientSystemBalance(cardId) {
  const data = flazzDataCache;
  if (!data) return 0;
  const uid = String(cardId);

  let usage = null;
  const usages = (data.usages || []).filter(u => String(u.card_id) === uid && u.status === 'DIBERIKAN');
  if (usages.length) usage = usages[0]; // data.usages di-reverse: index 0 = yang terbaru

  let opening = usage ? (parseFloat(usage.opening_balance) || 0) : 0;
  let since = null;
  if (usage) {
    const raw = usage.used_at || usage.date;
    const dts = new Date(raw);
    if (!isNaN(dts.getTime())) {
      since = dts;
    }
  }
  if (!usage) since = null;

  const within = function(v) {
    if (!since) return true;
    let dt = (v instanceof Date) ? v : new Date(v);
    if (isNaN(dt.getTime())) return false; // tanggal tidak dikenal dianggap di luar periode
    return dt.getTime() > since.getTime();
  };

  let topup = 0, tol = 0, bbm = 0;
  (data.topups || []).forEach(t => {
    if (String(t.card_id) === uid && String(t.is_deleted || '') !== '1' && within(t.created_at || t.date)) topup += parseFloat(t.amount) || 0;
  });
  (data.tols || []).forEach(t => {
    if (String(t.card_id) === uid && String(t.is_deleted || '') !== '1' && within(t.created_at || t.date)) tol += parseFloat(t.amount) || 0;
  });
  (data.bbmFlazz || []).forEach(b => {
    if (String(b.card_id) === uid && within(b.timestamp || b.tanggal)) {
      bbm += parseFloat(b.amount) || 0;
      tol += parseFloat(b.toll_amount) || 0;
    }
  });

  return +(opening + topup - tol - bbm);
}

function onReconCardSelect() {
  let select = document.getElementById('r_card_id');
  let cardId = select.value || '';
  let balance = 0;
  if (select.selectedIndex > 0) {
     balance = computeClientSystemBalance(select.value);
  }
  document.getElementById('r_system_balance').value = balance;
  calculateReconVariance();
  updateReconGateStatus(cardId);
}

function updateReconGateStatus(cardId) {
  let box = document.getElementById('recon-gate-status');
  let btn = document.getElementById('btn-save-recon');
  if (!box) return;
  if (!cardId) {
    box.className = 'alert d-none py-2';
    if (btn) btn.disabled = false;
    return;
  }
  box.className = 'alert d-none py-2';
  if (btn) btn.disabled = false;
  google.script.run
    .withSuccessHandler(function(res) {
      box.className = 'alert py-2';
      if (res && res.eligible) {
        box.className = 'alert alert-success py-2';
        box.innerHTML = '<i class="bi bi-check-circle me-1"></i> Laporan valid dengan foto KM awal & akhir terdeteksi.';
        if (btn) btn.disabled = false;
      } else {
        box.className = 'alert alert-danger py-2';
        box.innerHTML = '<i class="bi bi-slash-circle me-1"></i> ' + esc(((res && res.reason) || 'Belum ada laporan valid. Rekonsiliasi diblokir.'));
        if (btn) btn.disabled = true;
      }
    })
    .withFailureHandler(function() {
      box.className = 'alert d-none py-2';
      if (btn) btn.disabled = false;
    })
    .apiCheckReconGate(cardId, bbmToken());
}

function calculateReconVariance() {
  let sys = parseFloat(document.getElementById('r_system_balance').value) || 0;
  let act = parseFloat(document.getElementById('r_actual_balance').value) || 0;
  let diff = act - sys;
  let alert = document.getElementById('recon-variance-alert');
  
  if(diff === 0) {
     alert.style.display = 'block';
     alert.className = 'alert alert-success py-2 mb-3';
     alert.innerHTML = '<i class="bi bi-check-circle me-1"></i> Saldo sesuai.';
     document.getElementById('r_action').value = 'IGNORE';
  } else if (diff < 0) {
     alert.style.display = 'block';
     alert.className = 'alert alert-warning py-2 mb-3';
     alert.innerHTML = `<i class="bi bi-exclamation-triangle me-1"></i> Selisih kurang ${formatCurrency(Math.abs(diff))}. Ada pengeluaran belum tercatat?`;
     document.getElementById('r_action').value = 'ADJUST';
  } else {
     alert.style.display = 'block';
     alert.className = 'alert alert-info py-2 mb-3';
     alert.innerHTML = `<i class="bi bi-info-circle me-1"></i> Selisih lebih ${formatCurrency(diff)}. Top up belum tercatat?`;
     document.getElementById('r_action').value = 'ADJUST';
  }
}

function showFlazzModal() {
  document.getElementById('form-flazz-card').reset();
  document.getElementById('f_card_id').value = '';
  
  let branchSelect = document.getElementById('f_branch_id');
  branchSelect.innerHTML = document.getElementById('m_cabang') ? document.getElementById('m_cabang').innerHTML : '';
  let driverSelect = document.getElementById('f_driver_id');
  driverSelect.innerHTML = '<option value="">-- Tidak Ada / Kartu Bebas --</option>';
  (allDrivers || []).forEach(d => driverSelect.innerHTML += '<option value="'+esc(d.nama)+'">'+esc(d.nama)+'</option>');
  
  new bootstrap.Modal(document.getElementById('modal-flazz-card')).show();
}

function saveFlazzCardForm(e) {
  e.preventDefault();
  let btn = document.getElementById('btn-save-flazz-card');
  let orig = btn.innerHTML;
  btn.dataset.origHtml = orig;
  btn.disabled = true;
  btn.innerHTML = 'Menyimpan...';

  let payload = {
    id: document.getElementById('f_card_id').value,
    card_number: document.getElementById('f_card_number').value,
    card_name: document.getElementById('f_card_name').value,
    card_type: document.getElementById('f_card_type').value,
    card_role: document.getElementById('f_card_role').value,
    branch_id: document.getElementById('f_branch_id').value,
    driver_id: document.getElementById('f_driver_id').value,
    notes: document.getElementById('f_notes').value
  };

  google.script.run
    .withSuccessHandler(function(res) {
       btn.disabled = false;
       btn.innerHTML = orig;
       if(res.success) {
         showToast(res.msg, 'success');
         bootstrap.Modal.getInstance(document.getElementById('modal-flazz-card')).hide();
         loadFlazzDataWrapper(true);
       } else {
         showToast(res.msg, 'error');
       }
    })
    .withFailureHandler(flazzFailHandler('Menyimpan kartu', ['btn-save-flazz-card']))
    .apiSaveFlazzCard(payload, bbmToken());
}

// ... Additional forms for usage, topup, tol, recon will follow the same pattern:
// Build payload -> google.script.run -> showToast -> loadFlazzDataWrapper()

function saveFlazzTopUpForm(e) {
  e.preventDefault();
  var kard = (document.getElementById('t_card_id') || {}).selectedOptions;
  var kardLabel = kard && kard[0] ? kard[0].text : '-';
  var amount = document.getElementById('t_amount').value;
  var tglTxt = document.getElementById('t_date').value;
  if (!confirm('Konfirmasi Top Up:\nKartu: ' + kardLabel + '\nNominal: ' + formatCurrency(amount) + '\nTanggal: ' + tglTxt + '\n\nLanjutkan?')) return;
  let btn = document.getElementById('btn-save-topup');
  let orig = btn.innerHTML;
  btn.dataset.origHtml = orig;
  btn.disabled = true;
  btn.innerHTML = 'Memproses...';

  let payload = {
    card_id: document.getElementById('t_card_id').value,
    amount: document.getElementById('t_amount').value,
    tanggal: transTimestamp(document.getElementById('t_date').value),
    notes: document.getElementById('t_notes').value,
    foto_bukti: null,
    foto_bukti_name: null
  };

  google.script.run
   .withSuccessHandler(res => {
      btn.disabled = false;
      btn.innerHTML = orig;
      if(res.success) {
        showToast(res.msg, 'success');
        document.getElementById('form-flazz-topup').reset();
        loadFlazzDataWrapper(true);
      } else showToast(res.msg, 'error');
   })
   .withFailureHandler(flazzFailHandler('Menyimpan top up', ['btn-save-topup']))
   .apiSaveFlazzTopUp(payload, bbmToken());
}

function saveFlazzReconForm(e) {
  e.preventDefault();
  let cardId = document.getElementById('r_card_id').value;
  if (!cardId) {
    showToast('Pilih kartu terlebih dahulu.', 'error');
    return;
  }
  let btn = document.getElementById('btn-save-recon');
  let orig = btn.innerHTML;
  btn.dataset.origHtml = orig;
  btn.disabled = true;
  btn.innerHTML = 'Memproses...';

  let file = document.getElementById('r_foto_bukti').files[0];

  let payload = {
    card_id: cardId,
    system_balance: document.getElementById('r_system_balance').value,
    actual_balance: document.getElementById('r_actual_balance').value,
    action: document.getElementById('r_action').value,
    notes: document.getElementById('r_notes').value,
    };

  let submitRecon = function() {
    google.script.run
      .withSuccessHandler(res => {
         btn.disabled = false;
         btn.innerHTML = orig;
         if(res.success) {
           showToast(res.msg, 'success');
           document.getElementById('form-flazz-recon').reset();
           document.getElementById('recon-variance-alert').style.display = 'none';
           let statusBox = document.getElementById('recon-gate-status');
           if (statusBox) statusBox.className = 'alert d-none py-2';
           loadFlazzDataWrapper(true);
         } else showToast(res.msg, 'error');
      })
      .withFailureHandler(flazzFailHandler('Menyimpan recon', ['btn-save-recon']))
      .apiSaveFlazzRecon(payload, bbmToken());
  };

  let proceed = function() {
    if (file) {
      let reader = new FileReader();
      reader.onload = function(event) {
         payload.foto_bukti = event.target.result;
         payload.foto_bukti_name = file.name;
         submitRecon();
      };
      reader.readAsDataURL(file);
    } else {
      submitRecon();
    }
  };

  // Lapisan kedua: verifikasi gate di server sebelum menyimpan
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && !res.eligible) {
        btn.disabled = false;
        btn.innerHTML = orig;
        showToast('Rekonsiliasi diblokir: ' + ((res && res.reason) || 'belum ada laporan valid dengan foto KM.'), 'error');
        return;
      }
      proceed();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.innerHTML = orig;
      showToast('Gagal memverifikasi gate: ' + err, 'error');
    })

const HIST_PER = 10;
let __flazzHist = null;
let __histPage = { topup: 1, tol: 1, bbm: 1, usage: 1, recon: 1 };

function renderFlazzHistory(data) {
  __flazzHist = data;
  __histPage = { topup: 1, tol: 1, bbm: 1, usage: 1, recon: 1 };
  renderHistSection('topup');
  renderHistSection('tol');
  renderHistSection('bbm');
  renderHistSection('usage');
  renderHistSection('recon');
}

function renderHistSection(type) {
  let data = __flazzHist;
  if(!data) return;
  let list = [];
  if (type === 'topup') list = data.topups || [];
  else if (type === 'tol') list = data.tolHistory || data.tols || [];
  else if (type === 'bbm') list = data.bbmFlazz || [];
  else if (type === 'usage') list = data.usages || [];
  else if (type === 'recon') list = data.recons || [];

  let cardsById = {};
  (data.cards || []).forEach(function(c) { cardsById[String(c.id)] = c; });
  list = list.filter(function(t) {
    if (__flazzFilterCabang) {
      var c = cardsById[String(t.card_id)] || {};
      if (c.branch_id && String(c.branch_id) !== String(__flazzFilterCabang)) return false;
    }
    if (!__flazzHistStart && !__flazzHistEnd) return true;
    var dv = t.date || t.tanggal || t.timestamp;
    if (dv == null || dv === '') return true;
    var key = localDateKey(new Date(dv)).toString();
    if (__flazzHistStart && key < __flazzHistStart) return false;
    if (__flazzHistEnd && key > __flazzHistEnd) return false;
    return true;
  });

  let tbody = document.getElementById('tb-hist-' + type);
  if (!tbody) return;
  tbody.innerHTML = '';

  let totalPages = Math.max(1, Math.ceil(list.length / HIST_PER));
  if (__histPage[type] > totalPages) __histPage[type] = totalPages;
  let start = (__histPage[type] - 1) * HIST_PER;
  let pageData = list.slice(start, start + HIST_PER);

  pageData.forEach(t => {
    if (type === 'topup') {
      let cardStr = data.cards.find(c => c.id === t.card_id)?.card_number || t.card_id;
      tbody.innerHTML += `<tr>
        <td>${formatDateShort(t.date)}</td>
        <td>${esc(cardStr)}</td>
        <td class="fw-bold text-success">+${formatCurrency(t.amount)}</td>
        <td><a href="${escUrl(t.evidence_url)}" target="_blank">Lihat Bukti</a></td>
        <td>${esc(t.notes)}</td>
        <td class="text-end text-nowrap">
          <button class="btn btn-sm btn-outline-primary" title="Edit Top Up" aria-label="Edit top up" onclick="editTopUp('${t.id}')"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger" title="Hapus Top Up" aria-label="Hapus top up" onclick="deleteTopUp('${t.id}')"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`;
    } else if (type === 'tol') {
      let cardStr = data.cards.find(c => c.id === t.card_id)?.card_number || t.card_id;
      let isDaily = t.source === 'DAILY';
      let srcBadge = isDaily ? " <span class='badge bg-info ms-1'>Laporan Harian</span>" : '';
      let bukti = t.evidence_url
        ? `<a href="${escUrl(t.evidence_url)}" target="_blank">Lihat Bukti</a>`
        : "<span class='text-muted'>-</span>";
      let aksi = isDaily
        ? "<span class='text-muted small'>Dari laporan harian</span>"
        : `<button class="btn btn-sm btn-outline-primary" title="Edit Tol" aria-label="Edit tol" onclick="editTol('${t.id}')"><i class="bi bi-pencil"></i></button> ` +
          `<button class="btn btn-sm btn-outline-danger" title="Hapus Tol" aria-label="Hapus tol" onclick="deleteTol('${t.id}')"><i class="bi bi-trash"></i></button>`;
      tbody.innerHTML += `<tr>
        <td>${formatDateShort(t.date)}${srcBadge}</td>
        <td>${esc(cardStr)}</td>
        <td>${esc(t.driver_id || '-')} / ${esc(t.vehicle_id || '-')}</td>
        <td class="fw-bold text-danger">-${formatCurrency(t.amount)}</td>
        <td>${bukti}</td>
        <td>${esc(t.notes || '')}</td>
        <td class="text-end text-nowrap">${aksi}</td>
      </tr>`;
    } else if (type === 'usage') {
      let cardStr = data.cards.find(c => c.id === t.card_id)?.card_number || t.card_id;
      tbody.innerHTML += `<tr>
        <td>${formatDateShort(t.date)}</td>
        <td>${esc(cardStr)}</td>
        <td>${esc(t.driver_id)} / ${esc(t.vehicle_id)}</td>
        <td><span class="badge bg-secondary">${esc(t.usage_type)}</span></td>
        <td>${esc(t.notes)}</td>
      </tr>`;
    } else if (type === 'bbm') {
      let cardStr = data.cards.find(c => c.id === t.card_id)?.card_number || t.card_id;
      tbody.innerHTML += `<tr>
        <td>${formatDateShort(t.tanggal)}</td>
        <td>${esc(cardStr)}</td>
        <td>${esc(t.driver)} / ${esc(t.vehicle)}</td>
        <td class="fw-bold text-danger">-${formatCurrency(t.amount)}</td>
        <td><a href="${escUrl(t.evidence)}" target="_blank">Struk BBM</a></td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-danger" title="Hapus transaksi BBM" aria-label="Hapus transaksi BBM" onclick="deleteBBMFlazz('${t.transaction_id}')"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`;
    } else if (type === 'recon') {
      let cardStr = data.cards.find(c => c.id === t.card_id)?.card_number || t.card_id;
      let statClass = t.reconciliation_status === 'SESUAI' ? 'bg-success' : 'bg-danger';
      tbody.innerHTML += `<tr>
        <td>${formatDateShort(t.date)}</td>
        <td>${esc(cardStr)}</td>
        <td>${t.driver_id ? esc(t.driver_id) + ' / ' : ''}${esc(t.vehicle_id || '')}</td>
        <td>${formatCurrency(t.opening_balance)}</td>
        <td class="text-success">+${formatCurrency(t.total_topup)}</td>
        <td class="text-danger">-${formatCurrency(t.total_bbm_flazz + t.total_tol)}</td>
        <td class="fw-bold">${formatCurrency(t.flazz_balance)}</td>
        <td>${formatCurrency(t.actual_balance)}</td>
        <td class="${t.difference < 0 ? 'text-success' : 'text-danger'}">${formatCurrency(t.difference)}</td>
        <td><span class="badge ${statClass}">${esc(t.reconciliation_status)}</span></td>
        <td>${esc(t.notes || '')}</td>
        <td>${esc(t.reconciled_by || '')}</td>
        <td>${t.reconciled_at ? formatDateShort(t.reconciled_at) : '-'}</td>
      </tr>`;
    }
  });

  if (list.length === 0) {
    tbody.innerHTML = "<tr><td colspan='99' class='text-center text-muted py-4'>Belum ada data.</td></tr>";
  }

  renderHistPagination(type, totalPages);
}

function renderHistPagination(type, totalPages) {
  let ul = document.getElementById('hist-page-' + type);
  if(!ul) return;
  if(totalPages <= 1){ ul.innerHTML = ''; return; }
  let cur = __histPage[type] || 1;
  let html = '';
  html += "<li class='page-item" + (cur===1?" disabled":"") + "'><a class='page-link' href='#' onclick='histGotoPage(\"" + type + "\", " + (cur-1) + "); return false;'>&laquo;</a></li>";
  for (let p = 1; p <= totalPages; p++) {
    html += "<li class='page-item" + (p===cur?" active":"") + "'><a class='page-link' href='#' onclick='histGotoPage(\"" + type + "\", " + p + "); return false;'>" + p + "</a></li>";
  }
  html += "<li class='page-item" + (cur===totalPages?" disabled":"") + "'><a class='page-link' href='#' onclick='histGotoPage(\"" + type + "\", " + (cur+1) + "); return false;'>&raquo;</a></li>";
  ul.innerHTML = html;
}

function histGotoPage(type, n) {
  if(!__flazzHist) return;
  let data = __flazzHist;
  let len = 0;
  if (type === 'topup') len = (data.topups||[]).length;
  else if (type === 'tol') len = (data.tolHistory || data.tols || []).length;
  else if (type === 'bbm') len = (data.bbmFlazz||[]).length;
  else if (type === 'usage') len = (data.usages||[]).length;
  else if (type === 'recon') len = (data.recons||[]).length;
  let total = Math.max(1, Math.ceil(len / HIST_PER));
  if(n < 1) n = 1;
  if(n > total) n = total;
  __histPage[type] = n;
  renderHistSection(type);
}

function transTimestamp(val) {
   let d;
   if (!val) {
     d = new Date();
   } else {
     let m = String(val).match(/^(\d{4})-(\d{2})-(\d{2})/);
     if (!m) return val;
     let n = new Date();
     d = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10), n.getHours(), n.getMinutes(), n.getSeconds(), 0);
   }
   return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}

function localDateKey(val) {
   if (val == null || val === '') return '';
   if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
   let d = new Date(val);
   if (isNaN(d.getTime())) return String(val).substring(0, 10);
   return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function matchesDateKey(val, keyStr) {
   return keyStr ? localDateKey(val) === keyStr : true;
}
function inRange(val, start, end) {
   var key = localDateKey(val);
   if (!key) return true;
   if (start && key < start) return false;
   if (end && key > end) return false;
   return true;
}
function formatDateShort(val) {
   if(!val) return '-';
   let d = new Date(val);
   let isDateOnly = typeof val === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(val);
   let hasRealTime = !isDateOnly && (d.getHours() !== 0 || d.getMinutes() !== 0);
   let base = d.toLocaleDateString('id-ID');
   return hasRealTime ? base + ' ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') : base;
}

<script>
// ==========================================
// LIST FLAZZ - Listing Page
// ==========================================

let __flazzListingData = null;

function renderFlazzListing() {
  if (flazzDataCache) {
    __flazzListingData = flazzDataCache;
    document.getElementById('flazz-listing-loading').style.display = 'none';
    document.getElementById('flazz-listing-loaded').style.display = 'block';
    renderFlazzListingTable();
  } else {
    document.getElementById('flazz-listing-loading').style.display = 'block';
    document.getElementById('flazz-listing-loaded').style.display = 'none';
    let attempts = 0;
    let checker = setInterval(function() {
      attempts++;
      if (flazzDataCache) {
        clearInterval(checker);
        __flazzListingData = flazzDataCache;
        document.getElementById('flazz-listing-loading').style.display = 'none';
        document.getElementById('flazz-listing-loaded').style.display = 'block';
        renderFlazzListingTable();
      } else if (attempts > 30) {
        clearInterval(checker);
        document.getElementById('flazz-listing-loading').style.display = 'none';
        showToast('Gagal memuat data Flazz', 'error');
      }
    }, 200);
  }
}

function renderFlazzListingTable() {
  if (!__flazzListingData) return;
  let data = __flazzListingData;
  let cards = data.cards || [];
  var q = (document.getElementById('flazz-listing-search') || {}).value || '';
  q = q.toLowerCase();
  cards = cards.filter(function(c) {
    return !q || String(c.card_number||'').toLowerCase().indexOf(q) >= 0 || String(c.card_name||'').toLowerCase().indexOf(q) >= 0;
  });
  if (__flazzFilterCabang) {
    cards = cards.filter(function(c) { return String(c.branch_id || '') === String(__flazzFilterCabang); });
  }
  let startEl = document.getElementById('flazz-listing-date-start');
  let endEl = document.getElementById('flazz-listing-date-end');
  let start = startEl ? startEl.value : '';
  let end = endEl ? endEl.value : '';
  if (!start) start = end || new Date().toISOString().slice(0, 10);
  if (!end) end = start;
  if (startEl) startEl.value = start;
  if (endEl) endEl.value = end;

  let tbody = document.getElementById('flazz-listing-table');
  let noneEl = document.getElementById('flazz-listing-none');
  if (!tbody) return;
  tbody.innerHTML = '';

  let activeCards = cards.filter(c => c.status !== 'NONAKTIF');
  if (activeCards.length === 0) {
    noneEl.style.display = 'block';
    return;
  }
  noneEl.style.display = 'none';

  activeCards.forEach(function(c, idx) {
    let cardId = c.id;
    let lastBal = parseFloat(c.last_balance) || 0;

    let dayTopups = (data.topups || []).filter(t =>
      t.card_id === cardId && inRange(t.date, start, end)
    );
    let dayTols = (data.tols || []).filter(t =>
      t.card_id === cardId && inRange(t.date, start, end)
    );
    let dayBbm = (data.bbmFlazz || []).filter(b =>
      b.card_id === cardId && inRange(b.tanggal || b.timestamp, start, end)
    );

    let totalTopup = dayTopups.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
    let totalTol = dayTols.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0) +
                   dayBbm.reduce((s, b) => s + (parseFloat(b.toll_amount) || 0), 0);
    let totalBbm = dayBbm.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);
    let totalExpense = totalTol + totalBbm;

    // saldo_awal/saldo_akhir periode: utamakan rekonsiliasi dalam rentang,
    // fallback = saldo terakhir (last_balance)
    let cardRecons = (data.recons || []).filter(r =>
      r.card_id === cardId && inRange(r.date, start, end)
    );
    cardRecons.sort(function(a, b) { return localDateKey(a.date) < localDateKey(b.date) ? -1 : 1; });
    let saldoAwal = totalExpense > 0 || totalTopup > 0 || cardRecons.length > 0
      ? (cardRecons.length > 0 ? (parseFloat(cardRecons[0].opening_balance) || 0) : (lastBal + totalExpense - totalTopup))
      : 0;
    let saldoAkhir = cardRecons.length > 0
      ? (parseFloat(cardRecons[cardRecons.length - 1].flazz_balance) || lastBal)
      : lastBal;

    let tr = document.createElement('tr');
    let statusBadgeCls = c.status === 'SEDANG_DIGUNAKAN' ? 'bg-warning' : (c.status === 'TERSEDIA' ? 'bg-success' : 'bg-secondary');
    tr.innerHTML = `
      <td class='text-center text-muted'>${idx + 1}</td>
      <td>
        <a href='#' class='fw-bold text-primary text-decoration-underline' onclick="showFlazzDetailModal('${cardId}'); return false;">
          ${esc(c.card_number)}
        </a>
      </td>
      <td>${esc(c.card_name || '-')}</td>
      <td>${esc(c.driver_id || '-')}</td>
      <td><span class="badge ${statusBadgeCls}">${esc(c.status || 'NONAKTIF')}</span></td>
      <td class='text-end'>${formatCurrency(saldoAwal)}</td>
      <td class='text-end text-danger fw-bold'>${totalExpense > 0 ? '-' + formatCurrency(totalExpense) : '-'}</td>
      <td class='text-end fw-bold'>${formatCurrency(saldoAkhir)}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>
<script>
// ==========================================
// LIST FLAZZ - Detail Modal
// ==========================================

let __activeFlazzCardId = null;

function flazzListingRange() {
  var startEl = document.getElementById('flazz-listing-date-start');
  var endEl = document.getElementById('flazz-listing-date-end');
  var start = startEl ? startEl.value : '';
  var end = endEl ? endEl.value : '';
  if (!start) start = end || new Date().toISOString().slice(0, 10);
  if (!end) end = start;
  return { start: start, end: end };
}

function showFlazzDetailModal(cardId) {
  if (!__flazzListingData) return;
  let data = __flazzListingData;
  let card = (data.cards || []).find(c => c.id === cardId);
  if (!card) return;
  __activeFlazzCardId = cardId;

  let statusBadge = card.status === 'SEDANG_DIGUNAKAN' ? 'bg-warning' :
    (card.status === 'TERSEDIA' ? 'bg-success' : 'bg-secondary');

  document.getElementById('flazz-detail-title').innerHTML =
    'Laporan Penggunaan Kartu Flazz - ' + esc(card.card_number) +
    ' <span class="badge ' + statusBadge + ' ms-2" style="font-size:0.7rem;">' + esc(card.status) + '</span>';

  var range = flazzListingRange();
  let html = '';

  // Card info section
  html += '<div class="row g-3 mb-4">';
  html += '<div class="col-md-3"><div class="text-muted small fw-bold">Nama Kartu</div><div>' + esc(card.card_name || '-') + '</div></div>';
  html += '<div class="col-md-3"><div class="text-muted small fw-bold">Tipe</div><div>' + esc(card.card_type || '-') + '</div></div>';
  html += '<div class="col-md-3"><div class="text-muted small fw-bold">Driver</div><div>' + esc(card.driver_id || '-') + '</div></div>';
  html += '<div class="col-md-3"><div class="text-muted small fw-bold">Cabang</div><div>' + esc(card.branch_id || '-') + '</div></div>';
  html += '<div class="col-md-3"><div class="text-muted small fw-bold">Saldo Saat Ini</div><div class="fw-bold text-primary fs-5">' + formatCurrency(card.last_balance) + '</div></div>';
  html += '<div class="col-md-3"><div class="text-muted small fw-bold">Periode Laporan</div><div class="fw-bold">' + esc(range.start) + ' s/d ' + esc(range.end) + '</div></div>';
  html += '</div>';

  // Top Up table
  html += '<h6 class="text-primary fw-bold mt-2">Top Up</h6>';
  html += '<table class="table table-sm align-middle"><thead class="table-light"><tr><th>Tanggal</th><th>Nominal</th><th>Bukti</th><th>Catatan</th></tr></thead><tbody id="tb-detail-topup"></tbody><tfoot id="tf-detail-topup" class="table-light fw-bold"></tfoot></table>';

  // Pengeluaran table (Tol + BBM gabungan)
  html += '<h6 class="text-primary fw-bold mt-4">Rincian Pengeluaran</h6>';
  html += '<table class="table table-sm align-middle"><thead class="table-light"><tr><th>Tanggal</th><th>Jenis</th><th>Supir/Kendaraan</th><th>Nominal</th></tr></thead><tbody id="tb-detail-pengeluaran"></tbody><tfoot id="tf-detail-pengeluaran" class="table-light fw-bold"></tfoot></table>';

  // Reconciliation table
  html += '<h6 class="text-primary fw-bold mt-4">Rekonsiliasi Harian</h6>';
  html += '<table class="table table-sm align-middle"><thead class="table-light"><tr><th>Tanggal</th><th>Saldo Awal</th><th>Top Up</th><th>BBM+Tol</th><th>Saldo Sistem</th><th>Saldo Fisik</th><th>Selisih</th><th>Status</th></tr></thead><tbody id="tb-detail-recon"></tbody></table>';

  document.getElementById('flazz-detail-body').innerHTML = html;

  renderFlazzDetailHistory(cardId, data);

  new bootstrap.Modal(document.getElementById('modal-flazz-detail')).show();
}

function renderFlazzDetailHistory(cardId, data) {
  var range = flazzListingRange();
  var start = range.start;
  var end = range.end;

  // Top Ups
  let topups = (data.topups || []).filter(t => t.card_id === cardId && inRange(t.date, start, end));
  let topupTbody = document.getElementById('tb-detail-topup');
  if (topupTbody) {
    topupTbody.innerHTML = '';
    if (topups.length === 0) {
      topupTbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Tidak ada data</td></tr>';
    } else {
      topups.forEach(t => {
        topupTbody.innerHTML += '<tr><td>' + formatDateShort(t.date) + '</td><td class="text-success fw-bold">+' + formatCurrency(t.amount) + '</td><td>' + (t.evidence_url ? '<a href="' + escUrl(t.evidence_url) + '" target="_blank">Lihat</a>' : '-') + '</td><td>' + esc(t.notes || '') + '</td></tr>';
      });
    }
  }
  let topupTotal = topups.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
  let topupFoot = document.getElementById('tf-detail-topup');
  if (topupFoot) {
    topupFoot.innerHTML = topups.length > 0
      ? '<tr><td colspan="3" class="text-end">Total Top Up Periode</td><td class="text-success">+' + formatCurrency(topupTotal) + '</td></tr>'
      : '';
  }

  // Pengeluaran (Tol dari Flazz_Tol + toll_amount dari BBM harian + BBM)
  let tols = (data.tolHistory || []).filter(t => t.card_id === cardId && inRange(t.date, start, end));
  let bbm = (data.bbmFlazz || []).filter(b => b.card_id === cardId && inRange(b.tanggal || b.timestamp, start, end));
  let totalExpense = 0;
  let pengeluaranTbody = document.getElementById('tb-detail-pengeluaran');
  if (pengeluaranTbody) {
    pengeluaranTbody.innerHTML = '';
    let rows = [];
    tols.forEach(t => {
      rows.push({ tanggal: t.date, jenis: 'Tol', supir: t.driver_id || '-', kendaraan: t.vehicle_id || '-', nilai: '-' + formatCurrency(t.amount) });
      totalExpense += parseFloat(t.amount) || 0;
    });
    bbm.forEach(b => {
      rows.push({ tanggal: b.tanggal, jenis: 'BBM', supir: b.driver || '-', kendaraan: b.vehicle || '-', nilai: '-' + formatCurrency(b.amount) });
      totalExpense += parseFloat(b.amount) || 0;
    });
    if (rows.length === 0) {
      pengeluaranTbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Tidak ada data</td></tr>';
    } else {
      rows.forEach(r => {
        pengeluaranTbody.innerHTML += '<tr><td>' + formatDateShort(r.tanggal) + '</td><td>' + r.jenis + '</td><td>' + esc(r.supir) + ' / ' + esc(r.kendaraan) + '</td><td class="text-danger fw-bold">' + r.nilai + '</td></tr>';
      });
    }
  }
  let pengeluaranFoot = document.getElementById('tf-detail-pengeluaran');
  if (pengeluaranFoot) {
    pengeluaranFoot.innerHTML = (tols.length > 0 || bbm.length > 0)
      ? '<tr><td colspan="3" class="text-end">Total Pengeluaran Periode</td><td class="text-danger">-' + formatCurrency(totalExpense) + '</td></tr>'
      : '';
  }

  // Reconciliation
  let recons = (data.recons || []).filter(r => r.card_id === cardId && inRange(r.date, start, end));
  let reconTbody = document.getElementById('tb-detail-recon');
  if (reconTbody) {
    reconTbody.innerHTML = '';
    if (recons.length === 0) {
      reconTbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Tidak ada data</td></tr>';
    } else {
      recons.forEach(r => {
        let statClass = r.reconciliation_status === 'SESUAI' ? 'bg-success' : 'bg-danger';
        reconTbody.innerHTML += '<tr><td>' + formatDateShort(r.date) + '</td><td>' + formatCurrency(r.opening_balance) + '</td><td class="text-success">+' + formatCurrency(r.total_topup) + '</td><td class="text-danger">-' + formatCurrency(r.total_bbm_flazz + r.total_tol) + '</td><td class="fw-bold">' + formatCurrency(r.flazz_balance) + '</td><td>' + formatCurrency(r.actual_balance) + '</td><td class="' + (r.difference < 0 ? 'text-success' : 'text-danger') + '">' + formatCurrency(r.difference) + '</td><td><span class="badge ' + statClass + '">' + esc(r.reconciliation_status) + '</span></td></tr>';
      });
    }
  }
}
</script>
<script>
// ==========================================
// LIST FLAZZ - Print A4
// ==========================================

function printFlazzA4() {
  let cardId = __activeFlazzCardId;
  let data = __flazzListingData;
  if (!cardId || !data) return;
  let card = (data.cards || []).find(c => c.id === cardId);
  if (!card) return;

  var range = flazzListingRange();
  var start = range.start;
  var end = range.end;

  let lastBal = parseFloat(card.last_balance) || 0;

  let printHtml = '<!DOCTYPE html><html><head><title>Laporan Penggunaan Kartu Flazz - ' + esc(card.card_number) + '</title>';
  printHtml += '<style>@page{size:A4;margin:5mm 5mm 15mm 5mm;}body{font-family:Arial,sans-serif;font-size:11pt;color:#000;}';
  printHtml += '.print-header{text-align:center;margin-bottom:20px;border-bottom:2px solid #000;padding-bottom:10px;}';
  printHtml += '.print-header h2{margin:0;font-size:16pt;}';
  printHtml += '.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:15px;}';
  printHtml += '.info-grid .label{font-weight:bold;color:#555;}';
  printHtml += 'h4{margin-top:18px;margin-bottom:6px;font-size:12pt;border-bottom:1px solid #ccc;padding-bottom:4px;}';
  printHtml += 'table{width:100%;border-collapse:collapse;margin-top:6px;}';
  printHtml += 'table th,table td{border:1px solid #ccc;padding:6px 8px;font-size:10pt;text-align:left;}';
  printHtml += 'table th{background:#f0f0f0;font-weight:bold;}';
  printHtml += 'table tfoot td{font-weight:bold;background:#f8f9fa;border-top:2px solid #666;}';
  printHtml += '.summary-box{background:#f8f9fa;border:1px solid #dee2e6;border-radius:4px;padding:12px;margin:15px 0;}';
  printHtml += '.summary-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted #ccc;}';
  printHtml += '.summary-row:last-child{border-bottom:none;font-weight:bold;font-size:12pt;}';
  printHtml += '.footer{margin-top:30px;font-size:9pt;color:#888;text-align:center;border-top:1px solid #ccc;padding-top:8px;}';
  printHtml += '</style></head><body>';

  printHtml += '<div class="print-header"><h2>LAPORAN PENGGUNAAN KARTU FLAZZ</h2>';
  printHtml += '<div>' + esc(card.card_number) + ' | Periode: <strong>' + esc(start) + ' s/d ' + esc(end) + '</strong></div></div>';

  printHtml += '<div class="info-grid">';
  printHtml += '<div><span class="label">Nomor Kartu:</span> ' + esc(card.card_number) + '</div>';
  printHtml += '<div><span class="label">Nama Kartu:</span> ' + esc(card.card_name || '-') + '</div>';
  printHtml += '<div><span class="label">Tipe Kartu:</span> ' + esc(card.card_type || '-') + '</div>';
  printHtml += '<div><span class="label">Driver:</span> ' + esc(card.driver_id || '-') + '</div>';
  printHtml += '<div><span class="label">Cabang:</span> ' + esc(card.branch_id || '-') + '</div>';
  printHtml += '<div><span class="label">Status:</span> ' + esc(card.status) + '</div>';
  printHtml += '<div><span class="label">Saldo Saat Ini:</span> <strong>' + formatCurrency(lastBal) + '</strong></div>';
  printHtml += '</div>';

  // Summary periode
  let periodTopups = (data.topups || []).filter(t => t.card_id === card.id && inRange(t.date, start, end));
  let periodTols = (data.tolHistory || []).filter(t => t.card_id === card.id && inRange(t.date, start, end));
  let periodBbm = (data.bbmFlazz || []).filter(b => b.card_id === card.id && inRange(b.tanggal || b.timestamp, start, end));
  let periodRecons = (data.recons || []).filter(r => r.card_id === card.id && inRange(r.date, start, end));
  periodRecons.sort(function(a, b) { return localDateKey(a.date) < localDateKey(b.date) ? -1 : 1; });

  let totalTopup = periodTopups.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
  let totalTol = periodTols.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
  let totalBbm = periodBbm.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);
  let totalExpense = totalTol + totalBbm;

  let saldoAwal = periodRecons.length > 0
    ? (parseFloat(periodRecons[0].opening_balance) || 0)
    : (lastBal + totalExpense - totalTopup);
  let saldoAkhir = periodRecons.length > 0
    ? (parseFloat(periodRecons[periodRecons.length - 1].flazz_balance) || lastBal)
    : lastBal;

  printHtml += '<div class="summary-box">';
  printHtml += '<div class="summary-row"><span>Saldo Awal Periode</span><span>' + formatCurrency(saldoAwal) + '</span></div>';
  printHtml += '<div class="summary-row"><span>Total Top Up Periode</span><span>+' + formatCurrency(totalTopup) + '</span></div>';
  printHtml += '<div class="summary-row"><span>Pengeluaran BBM Periode</span><span>-' + formatCurrency(totalBbm) + '</span></div>';
  printHtml += '<div class="summary-row"><span>Pengeluaran Tol Periode</span><span>-' + formatCurrency(totalTol) + '</span></div>';
  printHtml += '<div class="summary-row"><span>Total Pengeluaran Periode</span><span>-' + formatCurrency(totalExpense) + '</span></div>';
  printHtml += '<div class="summary-row"><span>Saldo Akhir Periode</span><span>' + formatCurrency(saldoAkhir) + '</span></div>';
  printHtml += '</div>';

  // Top Up
  printHtml += '<h4>Top Up</h4>';
  printHtml += '<table><thead><tr><th>Tanggal</th><th>Nominal</th><th>Bukti</th><th>Catatan</th></tr></thead><tbody>';
  if (periodTopups.length === 0) {
    printHtml += '<tr><td colspan="4" class="text-center">Tidak ada data</td></tr>';
  } else {
    periodTopups.forEach(t => {
      printHtml += '<tr><td>' + esc(formatDateShort(t.date)) + '</td><td>+' + formatCurrency(t.amount) + '</td><td>' + (t.evidence_url ? 'Ada' : '-') + '</td><td>' + esc(t.notes || '') + '</td></tr>';
    });
  }
  printHtml += '</tbody>';
  if (periodTopups.length > 0) {
    printHtml += '<tfoot><tr><td colspan="3" style="text-align:right">Total Top Up Periode</td><td>+' + formatCurrency(totalTopup) + '</td></tr></tfoot>';
  }
  printHtml += '</table>';

  // Pengeluaran (Tol + BBM)
  printHtml += '<h4>Rincian Pengeluaran</h4>';
  printHtml += '<table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Supir/Kendaraan</th><th>Nominal</th></tr></thead><tbody>';
  if (periodTols.length === 0 && periodBbm.length === 0) {
    printHtml += '<tr><td colspan="4" class="text-center">Tidak ada data</td></tr>';
  } else {
    periodTols.forEach(t => {
      printHtml += '<tr><td>' + esc(formatDateShort(t.date)) + '</td><td>Tol</td><td>' + esc(t.driver_id || '-') + ' / ' + esc(t.vehicle_id || '-') + '</td><td>-' + formatCurrency(t.amount) + '</td></tr>';
    });
    periodBbm.forEach(b => {
      printHtml += '<tr><td>' + esc(formatDateShort(b.tanggal)) + '</td><td>BBM</td><td>' + esc(b.driver || '-') + ' / ' + esc(b.vehicle || '-') + '</td><td>-' + formatCurrency(b.amount) + '</td></tr>';
    });
  }
  printHtml += '</tbody>';
  if (periodTols.length > 0 || periodBbm.length > 0) {
    printHtml += '<tfoot><tr><td colspan="3" style="text-align:right">Total Pengeluaran Periode</td><td>-' + formatCurrency(totalExpense) + '</td></tr></tfoot>';
  }
  printHtml += '</table>';

  // Rekonsiliasi
  printHtml += '<h4>Rekonsiliasi Harian</h4>';
  printHtml += '<table><thead><tr><th>Tanggal</th><th>Saldo Awal</th><th>Top Up</th><th>BBM+Tol</th><th>Saldo Sistem</th><th>Saldo Fisik</th><th>Selisih</th><th>Status</th></tr></thead><tbody>';
  if (periodRecons.length === 0) {
    printHtml += '<tr><td colspan="8" class="text-center">Tidak ada data</td></tr>';
  } else {
    periodRecons.forEach(r => {
      printHtml += '<tr><td>' + esc(formatDateShort(r.date)) + '</td><td>' + formatCurrency(r.opening_balance) + '</td><td>+' + formatCurrency(r.total_topup) + '</td><td>-' + formatCurrency(r.total_bbm_flazz + r.total_tol) + '</td><td>' + formatCurrency(r.flazz_balance) + '</td><td>' + formatCurrency(r.actual_balance) + '</td><td>' + formatCurrency(r.difference) + '</td><td>' + esc(r.reconciliation_status) + '</td></tr>';
    });
  }
  printHtml += '</tbody></table>';

  printHtml += '<div class="footer">Dicetak pada ' + esc(new Date().toLocaleString('id-ID')) + ' | Sistem Monitoring BBM</div>';
  printHtml += '</body></html>';

  openPrintWindowFor(printHtml);
}
</script>
