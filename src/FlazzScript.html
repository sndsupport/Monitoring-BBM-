<script>
// ==========================================
// FLAZZ SCRIPTS
// ==========================================

let flazzDataCache = null;

function flazzUserInfo() {
  var u = (typeof userInfo !== 'undefined' && userInfo) ? userInfo : {};
  var loginName = document.getElementById('login_username') ? document.getElementById('login_username').value : '';
  return { username: u.username || loginName || '', nama: u.nama || '' };
}

function loadFlazzDashboard() {
  document.getElementById('flazz-dashboard-loading').style.display = 'block';
  document.getElementById('flazz-dashboard-content').style.display = 'none';

  google.script.run
    .withSuccessHandler(function(res) {
       flazzDataCache = res;
       document.getElementById('flazz-dashboard-loading').style.display = 'none';
       document.getElementById('flazz-dashboard-content').style.display = 'block';
       
       renderFlazzDashboardCards(res);
       renderFlazzMasterTable(res.cards);
       populateFlazzDropdowns(res);
       renderFlazzHistory(res);
    })
    .withFailureHandler(function(err) {
       showToast("Gagal memuat data Flazz: " + err, 'error');
       document.getElementById('flazz-dashboard-loading').style.display = 'none';
    })
    .apiGetFlazzDashboardData({
       username: document.getElementById('login_username').value, 
       role: userRole,
       cabang: userRole === 'SUPERADMIN' ? '' : (document.getElementById('m_cabang_supir') ? document.getElementById('m_cabang_supir').value : '') 
       // Note: the login context should actually pass the cabang from loadInitialData, but loadInitialData stores it where?
       // We'll let the server side handle it via userInfo if we pass the right thing, or we can just fetch all if SUPERADMIN.
       // The server needs userInfo object. Since we don't have userInfo global in js.html, we must construct it.
       // Wait, in js.html: loadInitialData passes `uInfo` from login. 
       // We can just rely on the server session if we didn't have one, but we are stateless.
    });
}

// Override loadFlazzDashboard call in switchTab if needed. We can just patch switchTab to call this.
function loadFlazzDataWrapper(force) {
   if (!force && flazzDataCache) {
      document.getElementById('flazz-dashboard-loading').style.display = 'none';
      document.getElementById('flazz-dashboard-content').style.display = 'block';
      renderFlazzDashboardCards(flazzDataCache);
      renderFlazzMasterTable(flazzDataCache.cards);
      populateFlazzDropdowns(flazzDataCache);
      renderFlazzHistory(flazzDataCache);
      return;
   }
   let uInfo = {
       username: document.getElementById('login_username') ? document.getElementById('login_username').value : '',
       role: userRole,
       cabang: document.getElementById('input-cabang-filter') ? document.getElementById('input-cabang-filter').value : '' // fallback
   };
   document.getElementById('flazz-dashboard-loading').style.display = 'block';
   document.getElementById('flazz-dashboard-content').style.display = 'none';

   google.script.run
    .withSuccessHandler(function(res) {
       flazzDataCache = res;
       document.getElementById('flazz-dashboard-loading').style.display = 'none';
       document.getElementById('flazz-dashboard-content').style.display = 'block';
       
       renderFlazzDashboardCards(res);
       renderFlazzMasterTable(res.cards);
       populateFlazzDropdowns(res);
       renderFlazzHistory(res);
    })
    .apiGetFlazzDashboardData(uInfo);
}

function renderFlazzDashboardCards(data) {
  let cards = data.cards || [];
  let totalCards = cards.length;
  let activeCards = cards.filter(c => c.status === 'SEDANG_DIGUNAKAN').length;
  let totalBalance = cards.reduce((sum, c) => sum + (parseFloat(c.last_balance) || 0), 0);

  let html = `
    <div class="col-md-4">
       <div class="card bg-primary text-white border-0 shadow-sm rounded-4 h-100">
         <div class="card-body">
           <h6 class="text-white-50 mb-1">Total Kartu Aktif</h6>
           <h3 class="fw-bold mb-0 text-white">${activeCards} <small class="fs-6 fw-normal text-white-50">dari ${totalCards}</small></h3>
         </div>
       </div>
    </div>
    <div class="col-md-4">
       <div class="card bg-success text-white border-0 shadow-sm rounded-4 h-100">
         <div class="card-body">
           <h6 class="text-white-50 mb-1">Total Saldo (Seluruh Kartu)</h6>
           <h3 class="fw-bold mb-0 text-white">${formatCurrency(totalBalance)}</h3>
         </div>
       </div>
    </div>
    <div class="col-md-4">
       <div class="card bg-info text-white border-0 shadow-sm rounded-4 h-100">
         <div class="card-body">
           <h6 class="text-white-50 mb-1">Top Up Terakhir</h6>
           <h5 class="fw-bold mb-0">${data.topups.length > 0 ? formatCurrency(data.topups[0].amount) + ' (' + formatDateShort(data.topups[0].date) + ')' : '-'}</h5>
         </div>
       </div>
    </div>
  `;
  document.getElementById('flazz-summary-cards').innerHTML = html;

  let tbody = document.getElementById('flazz-dashboard-table');
  tbody.innerHTML = '';
  cards.forEach(c => {
    let tr = document.createElement('tr');
    let badgeClass = c.status === 'SEDANG_DIGUNAKAN' ? 'bg-warning' : (c.status === 'TERSEDIA' ? 'bg-success' : 'bg-secondary');
    tr.innerHTML = `
      <td class="fw-bold">${c.card_number}</td>
      <td>${c.card_type}</td>
      <td>${c.driver_id || '-'}</td>
      <td class="fw-bold">${formatCurrency(c.last_balance)}</td>
      <td><span class="badge ${badgeClass}">${c.status}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

function renderFlazzMasterTable(cards) {
  let tbody = document.getElementById('flazz-master-table');
  if(!tbody) return;
  tbody.innerHTML = '';
  cards.forEach(c => {
    let tr = document.createElement('tr');
    let badgeClass = c.status === 'SEDANG_DIGUNAKAN' ? 'bg-warning' : (c.status === 'TERSEDIA' ? 'bg-success' : 'bg-secondary');
    tr.innerHTML = `
      <td><small class="text-muted">${c.id}</small></td>
      <td class="fw-bold">${c.card_number}</td>
      <td>${c.card_name || '-'}</td>
      <td>${c.card_type || '-'}</td>
      <td><span class="badge ${c.card_role === 'UTAMA' ? 'bg-primary' : 'bg-secondary'}">${c.card_role || 'CADANGAN'}</span></td>
      <td>${c.branch_id}</td>
      <td class="fw-bold">${formatCurrency(c.last_balance)}</td>
      <td><span class="badge ${badgeClass}">${c.status}</span></td>
      <td class="text-center">
         <button class="btn btn-sm btn-outline-primary" onclick="editFlazzCard('${c.id}')"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" onclick="deleteFlazzCardClient('${c.id}')"><i class="bi bi-trash"></i></button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function populateFlazzDropdowns(data) {
  let cards = data.cards || [];
  
  // Usage form (hanya tersedia)
  let uCard = document.getElementById('u_card_id');
  if(uCard) {
    uCard.innerHTML = '<option value="">Pilih Kartu...</option>';
    cards.filter(c => c.status === 'TERSEDIA').forEach(c => {
       let pemegang = c.driver_id ? c.driver_id : 'Belum Ada Pemegang';
       let info = c.card_number + ' - Pemegang: ' + pemegang;
       if (c.notes) info += ' - Ket: ' + c.notes;
       uCard.innerHTML += `<option value="${c.id}">${info}</option>`;
    });
  }

  // Topup & Tol form
  let tCard = document.getElementById('t_card_id');
  let tolCard = document.getElementById('tol_card_id');
  if(tCard) tCard.innerHTML = '<option value="">Pilih Kartu...</option>';
  if(tolCard) tolCard.innerHTML = '<option value="">Pilih Kartu...</option>';
  
  // Top up: semua kartu aktif (bisa top up kapan saja)
  cards.filter(c => c.status !== 'NONAKTIF').forEach(c => {
     let opt = `<option value="${c.id}">${c.card_number} ${c.driver_id ? '['+c.driver_id+']' : ''} - ${formatCurrency(c.last_balance)}</option>`;
     if(tCard) tCard.innerHTML += opt;
  });
  // Tol: hanya kartu yang sedang digunakan supir
  cards.filter(c => c.status === 'SEDANG_DIGUNAKAN').forEach(c => {
     let opt = `<option value="${c.id}">${c.card_number} [${c.driver_id || '-'}] - ${formatCurrency(c.last_balance)}</option>`;
     if(tolCard) tolCard.innerHTML += opt;
  });

  // Recon form (kartu yang sedang digunakan ATAU punya usage DIBERIKAN yang belum kembali,
  // untuk menangani kondisi macet: status kartu sudah TERSEDIA tapi usage belum DIKEMBALIKAN)
  let rCard = document.getElementById('r_card_id');
  if(rCard) {
    const openUsageCards = new Set((data.usages || [])
      .filter(u => u.status === 'DIBERIKAN')
      .map(u => String(u.card_id)));
    rCard.innerHTML = '<option value="">Pilih Kartu...</option>';
    cards.filter(c => c.status === 'SEDANG_DIGUNAKAN' || openUsageCards.has(String(c.id))).forEach(c => {
       rCard.innerHTML += `<option value="${c.id}" data-balance="${c.last_balance}">${c.card_number} [${c.driver_id}] - Saldo: ${formatCurrency(c.last_balance)}</option>`;
    });
  }
}

// Hitung saldo sistem untuk rekonsiliasi dari ledger (pola sama dengan server),
// agar angka pratinjau sesuai dengan yang disimpan saat "Selesaikan Rekonsiliasi".
// Periode = transaksi yang TERCATAT setelah penyerahan kartu (used_at), memakai kolom
// timestamp pencatatan (created_at / timestamp) bukan tanggal input, agar transaksi yang
// sudah masuk opening_balance tidak dihitung dua kali.
function computeClientSystemBalance(cardId) {
  const data = flazzDataCache;
  if (!data) return 0;
  const uid = String(cardId);

  let usage = null;
  const usages = (data.usages || []).filter(u => String(u.card_id) === uid && u.status === 'DIBERIKAN');
  if (usages.length) usage = usages[0]; // data.usages di-reverse: index 0 = yang terbaru

  let opening = usage ? (parseFloat(usage.opening_balance) || 0) : 0;
  let since = null;
  if (usage) {
    const raw = usage.used_at || usage.date;
    const dts = new Date(raw);
    if (!isNaN(dts.getTime())) {
      since = dts;
    }
  }
  if (!usage) since = null;

  const within = function(v) {
    if (!since) return true;
    let dt = (v instanceof Date) ? v : new Date(v);
    if (isNaN(dt.getTime())) return false; // tanggal tidak dikenal dianggap di luar periode
    return dt.getTime() > since.getTime();
  };

  let topup = 0, tol = 0, bbm = 0;
  (data.topups || []).forEach(t => {
    if (String(t.card_id) === uid && String(t.is_deleted || '') !== '1' && within(t.created_at || t.date)) topup += parseFloat(t.amount) || 0;
  });
  (data.tols || []).forEach(t => {
    if (String(t.card_id) === uid && String(t.is_deleted || '') !== '1' && within(t.created_at || t.date)) tol += parseFloat(t.amount) || 0;
  });
  (data.bbmFlazz || []).forEach(b => {
    if (String(b.card_id) === uid && within(b.timestamp || b.tanggal)) {
      bbm += parseFloat(b.amount) || 0;
      tol += parseFloat(b.toll_amount) || 0;
    }
  });

  return +(opening + topup - tol - bbm);
}

function onReconCardSelect() {
  let select = document.getElementById('r_card_id');
  let balance = 0;
  if(select.selectedIndex > 0) {
     balance = computeClientSystemBalance(select.value);
  }
  document.getElementById('r_system_balance').value = balance;
  calculateReconVariance();
}

function calculateReconVariance() {
  let sys = parseFloat(document.getElementById('r_system_balance').value) || 0;
  let act = parseFloat(document.getElementById('r_actual_balance').value) || 0;
  let diff = act - sys;
  let alert = document.getElementById('recon-variance-alert');
  
  if(diff === 0) {
     alert.style.display = 'block';
     alert.className = 'alert alert-success py-2 mb-3';
     alert.innerHTML = '<i class="bi bi-check-circle me-1"></i> Saldo sesuai.';
     document.getElementById('r_action').value = 'IGNORE';
  } else if (diff < 0) {
     alert.style.display = 'block';
     alert.className = 'alert alert-warning py-2 mb-3';
     alert.innerHTML = `<i class="bi bi-exclamation-triangle me-1"></i> Selisih kurang ${formatCurrency(Math.abs(diff))}. Ada pengeluaran belum tercatat?`;
     document.getElementById('r_action').value = 'ADJUST';
  } else {
     alert.style.display = 'block';
     alert.className = 'alert alert-info py-2 mb-3';
     alert.innerHTML = `<i class="bi bi-info-circle me-1"></i> Selisih lebih ${formatCurrency(diff)}. Top up belum tercatat?`;
     document.getElementById('r_action').value = 'ADJUST';
  }
}

function showFlazzModal() {
  document.getElementById('form-flazz-card').reset();
  document.getElementById('f_card_id').value = '';
  
  let branchSelect = document.getElementById('f_branch_id');
  branchSelect.innerHTML = document.getElementById('m_cabang') ? document.getElementById('m_cabang').innerHTML : '';
  let driverSelect = document.getElementById('f_driver_id');
  driverSelect.innerHTML = '<option value="">-- Tidak Ada / Kartu Bebas --</option>';
  (allDrivers || []).forEach(d => driverSelect.innerHTML += '<option value="'+d.nama+'">'+d.nama+'</option>');
  
  new bootstrap.Modal(document.getElementById('modal-flazz-card')).show();
}

function saveFlazzCardForm(e) {
  e.preventDefault();
  let btn = document.getElementById('btn-save-flazz-card');
  let orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Menyimpan...';

  let payload = {
    id: document.getElementById('f_card_id').value,
    card_number: document.getElementById('f_card_number').value,
    card_name: document.getElementById('f_card_name').value,
    card_type: document.getElementById('f_card_type').value,
    card_role: document.getElementById('f_card_role').value,
    branch_id: document.getElementById('f_branch_id').value,
    driver_id: document.getElementById('f_driver_id').value,
    notes: document.getElementById('f_notes').value
  };

  let uInfo = { username: document.getElementById('login_username') ? document.getElementById('login_username').value : 'admin' };

  google.script.run
    .withSuccessHandler(function(res) {
       btn.disabled = false;
       btn.innerHTML = orig;
       if(res.success) {
         showToast(res.msg, 'success');
         bootstrap.Modal.getInstance(document.getElementById('modal-flazz-card')).hide();
         loadFlazzDataWrapper(true);
       } else {
         showToast(res.msg, 'error');
       }
    })
    .apiSaveFlazzCard(payload, uInfo);
}

// ... Additional forms for usage, topup, tol, recon will follow the same pattern:
// Build payload -> google.script.run -> showToast -> loadFlazzDataWrapper()

function saveFlazzTopUpForm(e) {
  e.preventDefault();
  let btn = document.getElementById('btn-save-topup');
  let orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Memproses...';

  let file = document.getElementById('t_foto_bukti').files[0];
  
  let payload = {
    card_id: document.getElementById('t_card_id').value,
    amount: document.getElementById('t_amount').value,
    tanggal: transTimestamp(document.getElementById('t_date').value),
    notes: document.getElementById('t_notes').value,
    userInfo: flazzUserInfo(),
    foto_bukti_name: file.name
  };

  let reader = new FileReader();
  reader.onload = function(event) {
     payload.foto_bukti = event.target.result;
     google.script.run
      .withSuccessHandler(res => {
         btn.disabled = false;
         btn.innerHTML = orig;
         if(res.success) {
           showToast(res.msg, 'success');
           document.getElementById('form-flazz-topup').reset();
           loadFlazzDataWrapper(true);
         } else showToast(res.msg, 'error');
      }).apiSaveFlazzTopUp(payload);
  };
  reader.readAsDataURL(file);
}

function saveFlazzReconForm(e) {
  e.preventDefault();
  let btn = document.getElementById('btn-save-recon');
  let orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Memproses...';

  let file = document.getElementById('r_foto_bukti').files[0];
  
  let payload = {
    card_id: document.getElementById('r_card_id').value,
    system_balance: document.getElementById('r_system_balance').value,
    actual_balance: document.getElementById('r_actual_balance').value,
    action: document.getElementById('r_action').value,
    notes: document.getElementById('r_notes').value,
    userInfo: flazzUserInfo()
  };

  let submitRecon = function() {
    google.script.run
      .withSuccessHandler(res => {
         btn.disabled = false;
         btn.innerHTML = orig;
         if(res.success) {
           showToast(res.msg, 'success');
           document.getElementById('form-flazz-recon').reset();
           document.getElementById('recon-variance-alert').style.display = 'none';
           loadFlazzDataWrapper(true);
         } else showToast(res.msg, 'error');
      }).apiSaveFlazzRecon(payload);
  };

  if (file) {
    let reader = new FileReader();
    reader.onload = function(event) {
       payload.foto_bukti = event.target.result;
       payload.foto_bukti_name = file.name;
       submitRecon();
    };
    reader.readAsDataURL(file);
  } else {
    submitRecon();
  }
}

function showHistoryTab(type, e) {
  if(e) e.preventDefault();
  document.querySelectorAll('#historyFlazzTabs .nav-link').forEach(el => el.classList.remove('active'));
  if(e) e.target.classList.add('active');
  
  document.getElementById('hist-topup-container').style.display = 'none';
  document.getElementById('hist-tol-container').style.display = 'none';
  document.getElementById('hist-bbm-container').style.display = 'none';
  document.getElementById('hist-usage-container').style.display = 'none';
  document.getElementById('hist-recon-container').style.display = 'none';
  
  document.getElementById('hist-' + type + '-container').style.display = 'block';
}

const HIST_PER = 10;
let __flazzHist = null;
let __histPage = { topup: 1, tol: 1, bbm: 1, usage: 1, recon: 1 };

function renderFlazzHistory(data) {
  __flazzHist = data;
  __histPage = { topup: 1, tol: 1, bbm: 1, usage: 1, recon: 1 };
  renderHistSection('topup');
  renderHistSection('tol');
  renderHistSection('bbm');
  renderHistSection('usage');
  renderHistSection('recon');
}

function renderHistSection(type) {
  let data = __flazzHist;
  if(!data) return;
  let list = [];
  if (type === 'topup') list = data.topups || [];
  else if (type === 'tol') list = data.tols || [];
  else if (type === 'bbm') list = data.bbmFlazz || [];
  else if (type === 'usage') list = data.usages || [];
  else if (type === 'recon') list = data.recons || [];

  let tbody = document.getElementById('tb-hist-' + type);
  if (!tbody) return;
  tbody.innerHTML = '';

  let totalPages = Math.max(1, Math.ceil(list.length / HIST_PER));
  if (__histPage[type] > totalPages) __histPage[type] = totalPages;
  let start = (__histPage[type] - 1) * HIST_PER;
  let pageData = list.slice(start, start + HIST_PER);

  pageData.forEach(t => {
    if (type === 'topup') {
      let cardStr = data.cards.find(c => c.id === t.card_id)?.card_number || t.card_id;
      tbody.innerHTML += `<tr>
        <td>${formatDateShort(t.date)}</td>
        <td>${cardStr}</td>
        <td class="fw-bold text-success">+${formatCurrency(t.amount)}</td>
        <td><a href="${t.evidence_url}" target="_blank">Lihat Bukti</a></td>
        <td>${t.notes}</td>
        <td class="text-end text-nowrap">
          <button class="btn btn-sm btn-outline-primary" onclick="editTopUp('${t.id}')"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteTopUp('${t.id}')"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`;
    } else if (type === 'tol') {
      let cardStr = data.cards.find(c => c.id === t.card_id)?.card_number || t.card_id;
      tbody.innerHTML += `<tr>
        <td>${formatDateShort(t.date)}</td>
        <td>${cardStr}</td>
        <td>${t.driver_id} / ${t.vehicle_id}</td>
        <td class="fw-bold text-danger">-${formatCurrency(t.amount)}</td>
        <td><a href="${t.evidence_url}" target="_blank">Lihat Bukti</a></td>
        <td>${t.notes}</td>
        <td class="text-end text-nowrap">
          <button class="btn btn-sm btn-outline-primary" onclick="editTol('${t.id}')"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteTol('${t.id}')"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`;
    } else if (type === 'usage') {
      let cardStr = data.cards.find(c => c.id === t.card_id)?.card_number || t.card_id;
      tbody.innerHTML += `<tr>
        <td>${formatDateShort(t.date)}</td>
        <td>${cardStr}</td>
        <td>${t.driver_id} / ${t.vehicle_id}</td>
        <td><span class="badge bg-secondary">${t.usage_type}</span></td>
        <td>${t.notes}</td>
      </tr>`;
    } else if (type === 'bbm') {
      let cardStr = data.cards.find(c => c.id === t.card_id)?.card_number || t.card_id;
      tbody.innerHTML += `<tr>
        <td>${formatDateShort(t.tanggal)}</td>
        <td>${cardStr}</td>
        <td>${t.driver} / ${t.vehicle}</td>
        <td class="fw-bold text-danger">-${formatCurrency(t.amount)}</td>
        <td><a href="${t.evidence}" target="_blank">Struk BBM</a></td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-danger" onclick="deleteBBMFlazz('${t.transaction_id}')"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`;
    } else if (type === 'recon') {
      let cardStr = data.cards.find(c => c.id === t.card_id)?.card_number || t.card_id;
      let statClass = t.reconciliation_status === 'SESUAI' ? 'bg-success' : 'bg-danger';
      tbody.innerHTML += `<tr>
        <td>${formatDateShort(t.date)}</td>
        <td>${cardStr}</td>
        <td>${t.driver_id ? t.driver_id + ' / ' : ''}${t.vehicle_id || ''}</td>
        <td>${formatCurrency(t.opening_balance)}</td>
        <td class="text-success">+${formatCurrency(t.total_topup)}</td>
        <td class="text-danger">-${formatCurrency(t.total_bbm_flazz + t.total_tol)}</td>
        <td class="fw-bold">${formatCurrency(t.flazz_balance)}</td>
        <td>${formatCurrency(t.actual_balance)}</td>
        <td class="${t.difference < 0 ? 'text-success' : 'text-danger'}">${formatCurrency(t.difference)}</td>
        <td><span class="badge ${statClass}">${t.reconciliation_status}</span></td>
        <td>${t.notes || ''}</td>
        <td>${t.reconciled_by || ''}</td>
        <td>${t.reconciled_at ? formatDateShort(t.reconciled_at) : '-'}</td>
      </tr>`;
    }
  });

  renderHistPagination(type, totalPages);
}

function renderHistPagination(type, totalPages) {
  let ul = document.getElementById('hist-page-' + type);
  if(!ul) return;
  if(totalPages <= 1){ ul.innerHTML = ''; return; }
  let cur = __histPage[type] || 1;
  let html = '';
  html += "<li class='page-item" + (cur===1?" disabled":"") + "'><a class='page-link' href='#' onclick='histGotoPage(\"" + type + "\", " + (cur-1) + "); return false;'>&laquo;</a></li>";
  for (let p = 1; p <= totalPages; p++) {
    html += "<li class='page-item" + (p===cur?" active":"") + "'><a class='page-link' href='#' onclick='histGotoPage(\"" + type + "\", " + p + "); return false;'>" + p + "</a></li>";
  }
  html += "<li class='page-item" + (cur===totalPages?" disabled":"") + "'><a class='page-link' href='#' onclick='histGotoPage(\"" + type + "\", " + (cur+1) + "); return false;'>&raquo;</a></li>";
  ul.innerHTML = html;
}

function histGotoPage(type, n) {
  if(!__flazzHist) return;
  let data = __flazzHist;
  let len = 0;
  if (type === 'topup') len = (data.topups||[]).length;
  else if (type === 'tol') len = (data.tols||[]).length;
  else if (type === 'bbm') len = (data.bbmFlazz||[]).length;
  else if (type === 'usage') len = (data.usages||[]).length;
  else if (type === 'recon') len = (data.recons||[]).length;
  let total = Math.max(1, Math.ceil(len / HIST_PER));
  if(n < 1) n = 1;
  if(n > total) n = total;
  __histPage[type] = n;
  renderHistSection(type);
}

function transTimestamp(val) {
   let d;
   if (!val) {
     d = new Date();
   } else {
     let m = String(val).match(/^(\d{4})-(\d{2})-(\d{2})/);
     if (!m) return val;
     let n = new Date();
     d = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10), n.getHours(), n.getMinutes(), n.getSeconds(), 0);
   }
   return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}

function formatDateShort(val) {
   if(!val) return '-';
   let d = new Date(val);
   let isDateOnly = typeof val === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(val);
   let hasRealTime = !isDateOnly && (d.getHours() !== 0 || d.getMinutes() !== 0);
   let base = d.toLocaleDateString('id-ID');
   return hasRealTime ? base + ' ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') : base;
}
