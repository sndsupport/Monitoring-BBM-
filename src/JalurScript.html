<script>
function loadJalurWrapper() {
  if (typeof jalurEnsureMaster === 'function') jalurEnsureMaster(function(){});
}

function jalurEnsureMaster(callback) {
  const needsDriver = (window.masterData && window.masterData.supir && window.masterData.supir.length);
  const needsVehicle = (window.masterData && window.masterData.kendaraan && window.masterData.kendaraan.length);
  if (needsDriver && needsVehicle) { if (typeof callback === 'function') callback(); return; }
  google.script.run
    .withSuccessHandler(function(data) {
      if (data && typeof data === 'object') {
        if (!window.masterData) window.masterData = {};
        if (Array.isArray(data.vehicles)) window.masterData.kendaraan = data.vehicles;
        if (Array.isArray(data.drivers)) window.masterData.supir = data.drivers;
        if (Array.isArray(data.cabangList)) window.masterData.cabang = data.cabangList;
        if (Array.isArray(data.bbmList)) window.masterData.bbm = data.bbmList;
      }
      if (typeof callback === 'function') callback();
    })
    .withFailureHandler(function() {
      if (typeof callback === 'function') callback();
    })
    .getMasterData(userInfo);
}

function jalurPopulateDriverDatalist() {
  var dl = document.getElementById('jalur-supir-datalist');
  if (!dl) return;
  var drivers = (window.masterData && window.masterData.supir) || [];
  var cabangEl = document.getElementById('input-cabang');
  var cabang = cabangEl ? cabangEl.value : '';
  dl.innerHTML = '';
  drivers.forEach(function (d) {
    if (cabang && d.cabang !== cabang) return;
    var o = document.createElement('option');
    o.value = d.nama;
    o.setAttribute('data-driver-id', d.id);
    if (d.default_vehicle_id) o.setAttribute('data-default-vehicle', d.default_vehicle_id);
    dl.appendChild(o);
  });
}

function jalurFindDriverByName(name) {
  var drivers = (window.masterData && window.masterData.supir) || [];
  var cabangEl = document.getElementById('input-cabang');
  var cabang = cabangEl ? cabangEl.value : '';
  return drivers.find(function (d) { 
    if (cabang && d.cabang !== cabang) return false;
    return d.nama === name; 
  });
}

function jalurResolveDriverId(inputEl) {
  var name = inputEl ? (inputEl.value || '').trim() : '';
  var d = jalurFindDriverByName(name);
  return d ? d.id : '';
}

function jalurResolveDefaultVehicle(inputEl) {
  var name = inputEl ? (inputEl.value || '').trim() : '';
  var d = jalurFindDriverByName(name);
  return (d && d.default_vehicle_id) ? d.default_vehicle_id : '';
}

function jalurAutofillFromDriver(driverInput) {
  var row = driverInput.closest('.jalur-row');
  if (!row) return;
  var vehSel = row.querySelector('.jalur-row-vehicle');
  var defVeh = jalurResolveDefaultVehicle(driverInput);
  if (vehSel) vehSel.value = defVeh || '';
}

function jalurValidateRow(row) {
  var driverInput = row.querySelector('.jalur-row-driver');
  var name = driverInput ? (driverInput.value || '').trim() : '';
  if (!name) return false;
  return !!jalurFindDriverByName(name);
}

function jalurDriverNameById(id) {
  var drivers = (window.masterData && window.masterData.supir) || [];
  var d = drivers.find(function (x) { return String(x.id) === String(id); });
  return d ? d.nama : '';
}

function jalurRenderVehicleOptions(selectEl, selected) {
  if (!selectEl) return;
  const vehicles = (window.masterData && window.masterData.kendaraan) || [];
  var cabangEl = document.getElementById('input-cabang');
  var cabang = cabangEl ? cabangEl.value : '';
  let html = '<option value="">Pilih Kendaraan...</option>';
  vehicles.forEach(function(v) {
    if (cabang && v.cabang !== cabang) return;
    const sel = v.vehicle_id === selected ? ' selected' : '';
    html += '<option value="' + v.vehicle_id + '"' + sel + '>' + v.plat_nomor + ' - ' + v.nama + ' (' + v.jenis + ')</option>';
  });
  selectEl.innerHTML = html;
}

function jalurAddRow() {
  const container = document.getElementById('jalur-rows');
  const row = document.createElement('div');
  row.className = 'row g-2 mb-2 align-items-end jalur-row';
  row.innerHTML =
    '<div class="col-12 col-md-3"><label class="form-label text-muted small text-uppercase fw-bold">Driver 1</label>' +
    '<input class="form-control jalur-row-driver" list="jalur-supir-datalist" autocomplete="off" placeholder="Nama driver 1..." oninput="jalurAutofillFromDriver(this)"></div>' +
    '<div class="col-12 col-md-3"><label class="form-label text-muted small text-uppercase fw-bold">Driver 2 (Ops)</label>' +
    '<input class="form-control jalur-row-driver2" list="jalur-supir-datalist" autocomplete="off" placeholder="Nama driver 2..."></div>' +
    '<div class="col-12 col-md-3"><label class="form-label text-muted small text-uppercase fw-bold">Kendaraan</label>' +
    '<select class="form-select jalur-row-vehicle"></select></div>' +
    '<div class="col-12 col-md-3"><label class="form-label text-muted small text-uppercase fw-bold">Rute Tujuan</label>' +
    '<div class="input-group"><input type="text" class="form-control jalur-row-rute" placeholder="ex: Gudang A - Toko B">' +
    '<button type="button" class="btn btn-outline-danger" onclick="this.closest(\'.jalur-row\').remove()"><i class="bi bi-x"></i></button></div></div>';
  container.appendChild(row);
  jalurRenderVehicleOptions(row.querySelector('.jalur-row-vehicle'));
}

function jalurInitForm() {
  jalurEnsureMaster(function() {
    jalurPopulateDriverDatalist();
    const rows = document.getElementById('jalur-rows');
    if (!rows) return;
    rows.innerHTML = '';
    const t = document.getElementById('jalur-tanggal');
    if (t && !t.value) t.value = new Date().toISOString().slice(0, 10);
    jalurAddRow();
  });
}

function jalurShowListing() {
  document.getElementById('jalur-listing-loaded').style.display = 'none';
  const loading = document.getElementById('jalur-listing-loading');
  if (loading) loading.style.display = 'block';

  google.script.run
    .withSuccessHandler(function(res) {
      if (loading) loading.style.display = 'none';
      const loaded = document.getElementById('jalur-listing-loaded');
      if (!loaded) return;
      if (!res.success) {
        showToast(res.msg || 'Terjadi kesalahan saat memuat daftar.', 'error');
        return;
      }
      if (!res.list || !res.list.length) {
        loaded.style.display = 'block';
        document.getElementById('jalur-listing-none').style.display = 'block';
        document.getElementById('jalur-listing-none').textContent = 'Belum ada jadwal pengiriman pada ' + tanggal + '.';
        document.querySelector('#jalur-listing-loaded .card').style.display = 'none';
        return;
      }
      jalurEnsureMaster(function() {
        document.querySelector('#jalur-listing-loaded .card').style.display = 'block';
        document.getElementById('jalur-listing-none').style.display = 'none';
        const tbody = document.getElementById('jalur-listing-table');
        const rows = res.list.map(function(it) {
          const icon = it.jenis_kendaraan === 'Motor' ? 'bi-bicycle' : 'bi-truck';
          return '<tr>' +
            '<td>' + it.tanggal + '</td>' +
            '<td><i class="bi ' + icon + ' me-2 text-primary"></i>' + it.plat_nomor + ' <span class="text-muted small">' + it.nama_kendaraan + '</span></td>' +
            '<td>' + it.nama_driver + '</td>' +
            '<td>' + it.rute_tujuan + '</td>' +
            '<td>' + jalurPajakBadge(it.status_pajak, it.sisa_hari_pajak) + '</td>' +
            '<td class="text-end"><button class="btn btn-sm btn-outline-primary me-1" onclick="jalurEdit(\'' + it.id + '\')"><i class="bi bi-pencil"></i></button>' +
            '<button class="btn btn-sm btn-outline-danger" onclick="jalurDelete(\'' + it.id + '\')"><i class="bi bi-trash"></i></button></td>' +
          '</tr>';
        }).join('');
        tbody.innerHTML = rows;
      });
      loaded.style.display = 'block';
    })
    .withFailureHandler(function(err) { 
      const loading = document.getElementById('jalur-listing-loading');
      if (loading) loading.style.display = 'none';
      showToast('Gagal memuat: ' + err.message, 'error'); 
    })
    .apiGetJalurByTanggal('', userInfo);
}

function jalurShowSummary() {
  const tanggal = document.getElementById('jalur-filter-tanggal').value;
  if (!tanggal) { showToast('Pilih tanggal untuk menampilkan', 'error'); return; }

  document.getElementById('jalur-summary-loaded').style.display = 'none';
  const loading = document.getElementById('jalur-summary-loading');
  if (loading) loading.style.display = 'block';

  google.script.run
    .withSuccessHandler(function(res) {
      if (loading) loading.style.display = 'none';
      const loaded = document.getElementById('jalur-summary-loaded');
      if (!loaded) return;
      if (!res.success) {
        showToast(res.msg || 'Terjadi kesalahan saat memuat jadwal.', 'error');
        return;
      }
      if (!res.list || !res.list.length) {
        loaded.style.display = 'block';
        document.getElementById('jalur-shot').style.display = 'none';
        document.getElementById('jalur-summary-none').style.display = 'block';
        document.getElementById('jalur-summary-none').textContent = 'Belum ada jadwal pengiriman pada ' + tanggal + '.';
        return;
      }
      jalurEnsureMaster(function() {
        document.getElementById('jalur-shot').style.display = '';
        document.getElementById('jalur-summary-none').style.display = 'none';
        document.getElementById('jalur-summary-tanggal').textContent = tanggal;
        document.getElementById('jalur-summary-created').textContent = res.created_by || '-';
        const tbody = document.getElementById('jalur-summary-table');
        const rows = res.list.map(function(it) {
          const icon = it.jenis_kendaraan === 'Motor' ? 'bi-bicycle' : 'bi-truck';
          return '<tr>' +
            '<td><i class="bi ' + icon + ' me-2 text-primary"></i>' + it.plat_nomor + ' <span class="text-muted small">' + it.nama_kendaraan + '</span></td>' +
            '<td>' + it.nama_driver + '</td>' +
            '<td>' + (it.nama_driver2 || '-') + '</td>' +
            '<td>' + it.rute_tujuan + '</td>' +
            '<td>' + jalurPajakBadge(it.status_pajak, it.sisa_hari_pajak) + '</td>' +
            '<td>' + jalurPajakBadge(it.status_pajak_5, it.sisa_hari_pajak_5) + '</td>' +
            '<td>' + (it.jenis_kendaraan === 'Mobil' ? jalurPajakBadge(it.status_kir, it.sisa_hari_kir) : '<span class="badge bg-light text-muted fw-normal border">N/A</span>') + '</td>' +
            '</tr>';
        }).join('');
        tbody.innerHTML = rows;
      });
      loaded.style.display = 'block';
      })
      .withFailureHandler(function(err) { 
        const loading = document.getElementById('jalur-summary-loading');
        if (loading) loading.style.display = 'none';
        showToast('Gagal memuat: ' + err.message, 'error'); 
      })
      .apiGetJalurByTanggal(tanggal, userInfo);
}

function jalurRefreshActive() {
  if (document.getElementById('page-jalur-summary') && document.getElementById('page-jalur-summary').style.display === 'block') {
    jalurShowSummary();
  }
  if (document.getElementById('page-jalur-listing') && document.getElementById('page-jalur-listing').style.display === 'block') {
    jalurShowListing();
  }
}

function jalurSave() {
  const tanggal = document.getElementById('jalur-tanggal').value;
  if (!tanggal) { showToast('Pilih tanggal pengiriman', 'error'); return; }
  if (!(window.masterData && window.masterData.supir && window.masterData.kendaraan && window.masterData.supir.length && window.masterData.kendaraan.length)) {
    showToast('Data master driver/kendaraan belum siap', 'error'); return;
  }
  const rows = [];
  let valid = true;
  document.querySelectorAll('#jalur-rows .jalur-row').forEach(function(r) {
    const driverInput = r.querySelector('.jalur-row-driver');
    const vehicleId = r.querySelector('.jalur-row-vehicle').value;
    const rute = r.querySelector('.jalur-row-rute').value;
    if (driverInput && (driverInput.value || '').trim() && vehicleId && rute.trim()) {
      if (!jalurValidateRow(r)) { valid = false; return; }
      rows.push({ 
        driver_id: jalurResolveDriverId(driverInput), 
        driver2_id: jalurResolveDriverId(r.querySelector('.jalur-row-driver2')),
        vehicle_id: vehicleId, 
        rute_tujuan: rute.trim() 
      });
    }
  });
  if (!valid) { showToast('Ada nama driver yang tidak dikenal, pilih dari daftar', 'error'); return; }
  if (!rows.length) { showToast('Isi minimal satu baris lengkap', 'error'); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      showToast(res.msg, res.success ? 'success' : 'error');
      if (res.success) jalurInitForm();
    })
    .withFailureHandler(function(err) { showToast('Gagal menyimpan: ' + err.message, 'error'); })
    .apiSaveJalur({ tanggal: tanggal, rows: rows }, userInfo);
}

function jalurPajakBadge(status, days) {
  if (status === 'TIDAK_ADA') return '<span class="badge bg-secondary">Pajak -</span>';
  if (status === 'LEWAT') return '<span class="badge bg-dark">Pajak lewat ' + Math.abs(days) + ' hari</span>';
  if (status === 'KRITIS') return '<span class="badge bg-danger">Pajak habis dalam ' + days + ' hari</span>';
  if (status === 'WASPADA') return '<span class="badge bg-warning text-dark">Pajak habis dalam ' + days + ' hari</span>';
  return '<span class="badge bg-success">Pajak habis dalam ' + days + ' hari</span>';
}

function jalurEdit(id) {
  const tanggal = document.getElementById('jalur-filter-tanggal').value;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success || !res.list) return;
      const it = res.list.find(function(x) { return String(x.id) === String(id); });
      if (!it) return;
      document.getElementById('jalur-edit-id').value = it.id;
      document.getElementById('jalur-edit-tanggal').value = it.tanggal;
      jalurPopulateDriverDatalist();
      document.getElementById('jalur-edit-driver').value = it.nama_driver || jalurDriverNameById(it.driver_id) || '';
      document.getElementById('jalur-edit-driver2').value = it.nama_driver2 || jalurDriverNameById(it.driver2_id) || '';
      jalurRenderVehicleOptions(document.getElementById('jalur-edit-vehicle'), it.vehicle_id);
      document.getElementById('jalur-edit-rute').value = it.rute_tujuan;
      new bootstrap.Modal(document.getElementById('modal-jalur-edit')).show();
    })
    .withFailureHandler(function(err) { showToast('Gagal memuat data edit: ' + err.message, 'error'); })
    .apiGetJalurByTanggal(tanggal, userInfo);
}

function jalurSaveEdit() {
  const data = {
    id: document.getElementById('jalur-edit-id').value,
    tanggal: document.getElementById('jalur-edit-tanggal').value,
    driver_id: jalurResolveDriverId(document.getElementById('jalur-edit-driver')),
    driver2_id: jalurResolveDriverId(document.getElementById('jalur-edit-driver2')),
    vehicle_id: document.getElementById('jalur-edit-vehicle').value,
    rute_tujuan: document.getElementById('jalur-edit-rute').value
  };
  if (!data.driver_id) { showToast('Nama driver tidak valid, pilih dari daftar', 'error'); return; }
  if (!data.tanggal || !data.vehicle_id || !data.rute_tujuan.trim()) {
    showToast('Lengkapi semua field', 'error'); return;
  }
  google.script.run
    .withSuccessHandler(function(res) {
      showToast(res.msg, res.success ? 'success' : 'error');
      if (res.success) {
        bootstrap.Modal.getInstance(document.getElementById('modal-jalur-edit')).hide();
        jalurRefreshActive();
      }
    })
    .withFailureHandler(function(err) { showToast('Gagal: ' + err.message, 'error'); })
    .apiUpdateJalur(data, userInfo);
}

function jalurDelete(id) {
  if (!confirm('Yakin ingin menghapus jadwal ini?')) return;
  google.script.run
    .withSuccessHandler(function(res) {
      showToast(res.msg, res.success ? 'success' : 'error');
      if (res.success) jalurRefreshActive();
    })
    .withFailureHandler(function(err) { showToast('Gagal menghapus: ' + err.message, 'error'); })
    .apiDeleteJalur(id);
}

function jalurSummaryText() {
  const rows = document.querySelectorAll('#jalur-summary-table tr');
  const tanggal = document.getElementById('jalur-summary-tanggal').textContent;
  const created = document.getElementById('jalur-summary-created').textContent;
  let text = 'JALUR PENGIRIMAN\nTanggal: ' + tanggal + '\nDibuat oleh: ' + created + '\n\n';
  rows.forEach(function(tr) {
    const tds = tr.querySelectorAll('td');
    if (tds.length >= 4) {
      text += '- ' + tds[0].textContent.trim() + ' | Driver: ' + tds[1].textContent.trim() + ' | Rute: ' + tds[2].textContent.trim() + '\n';
    }
  });
  return text;
}

function jalurShareWA() {
  const text = encodeURIComponent(jalurSummaryText());
  window.open('https://wa.me/?text=' + text, '_blank');
}

function jalurTakeScreenshot() {
  const shot = document.getElementById('jalur-shot');
  if (!shot || shot.style.display === 'none') { showToast('Tampilkan dulu jadwal pada tanggal yang dipilih', 'error'); return; }
  if (typeof html2canvas === 'undefined') { showToast('Library screenshot belum dimuat', 'error'); return; }
  html2canvas(shot, { scale: 2, backgroundColor: '#ffffff' }).then(function(canvas) {
    const container = document.getElementById('jalur-shot-canvas');
    container.innerHTML = '';
    canvas.style.maxWidth = '100%';
    canvas.style.height = 'auto';
    container.appendChild(canvas);
    new bootstrap.Modal(document.getElementById('modal-jalur-shot')).show();
  }).catch(function(e) { showToast('Gagal screenshot: ' + e, 'error'); });
}
</script>
