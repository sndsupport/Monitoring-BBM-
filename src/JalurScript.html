<script>
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escUrl(v) {
  var s = esc(v);
  if (/^(https:\/\/drive\.google\.com|https:\/\/lh3\.googleusercontent\.com|data:image\/)/.test(s)) return s;
  if (/^https:\/\//.test(s)) return s;
  return '';
}

function bbmToken() {
  return localStorage.getItem('bbm_token') || '';
}

function loadJalurWrapper() {
  if (typeof jalurEnsureMaster === 'function') jalurEnsureMaster(function(){});
}

function jalurEnsureMaster(callback) {
  const needsDriver = (window.masterData && window.masterData.supir && window.masterData.supir.length);
  const needsVehicle = (window.masterData && window.masterData.kendaraan && window.masterData.kendaraan.length);
  if (needsDriver && needsVehicle) { if (typeof callback === 'function') callback(); return; }
  google.script.run
    .withSuccessHandler(function(data) {
      if (data && typeof data === 'object') {
        if (!window.masterData) window.masterData = {};
        if (Array.isArray(data.vehicles)) window.masterData.kendaraan = data.vehicles;
        if (Array.isArray(data.drivers)) window.masterData.supir = data.drivers;
        if (Array.isArray(data.cabangList)) window.masterData.cabang = data.cabangList;
        if (Array.isArray(data.bbmList)) window.masterData.bbm = data.bbmList;
        if (Array.isArray(data.flazzCards)) window.masterData.flazzCards = data.flazzCards;
      }
      if (typeof callback === 'function') callback();
    })
    .withFailureHandler(function() {
      if (typeof callback === 'function') callback();
    })
    .getMasterData(bbmToken());
}

function jalurPopulateDriverDatalist() {
  var dl = document.getElementById('jalur-supir-datalist');
  if (!dl) return;
  var drivers = (window.masterData && window.masterData.supir) || [];
  var cabangEl = document.getElementById('input-cabang');
  var cabang = cabangEl ? cabangEl.value : '';
  dl.innerHTML = '';
  drivers.forEach(function (d) {
    if (cabang && d.cabang !== cabang) return;
    var o = document.createElement('option');
    o.value = d.nama;
    o.setAttribute('data-driver-id', d.id);
    if (d.default_vehicle_id) o.setAttribute('data-default-vehicle', d.default_vehicle_id);
    dl.appendChild(o);
  });
}

function jalurFindDriverByName(name) {
  var drivers = (window.masterData && window.masterData.supir) || [];
  var cabangEl = document.getElementById('input-cabang');
  var cabang = cabangEl ? cabangEl.value : '';
  return drivers.find(function (d) { 
    if (cabang && d.cabang !== cabang) return false;
    return d.nama === name; 
  });
}

function jalurResolveDriverId(inputEl) {
  var name = inputEl ? (inputEl.value || '').trim() : '';
  var d = jalurFindDriverByName(name);
  return d ? d.id : '';
}

function jalurResolveDefaultVehicle(inputEl) {
  var name = inputEl ? (inputEl.value || '').trim() : '';
  var d = jalurFindDriverByName(name);
  return (d && d.default_vehicle_id) ? d.default_vehicle_id : '';
}

function jalurAutofillFromDriver(driverInput) {
  var row = driverInput.closest('.jalur-row');
  if (!row) return;
  var vehSel = row.querySelector('.jalur-row-vehicle');
  var defVeh = jalurResolveDefaultVehicle(driverInput);
  if (vehSel) vehSel.value = defVeh || '';
  jalurSetEtollDisplay(
    row.querySelector('.jalur-row-etoll'),
    row.querySelector('.jalur-row-etoll-id'),
    (driverInput.value || '').trim()
  );
}

function jalurSetEtollDisplay(etollSel, etollId, driverName) {
  var defCard = jalurResolveDefaultCard((driverName || '').trim());
  var selId = defCard ? defCard.id : '';
  jalurPopulateEtollOptions(etollSel, selId);
  if (etollSel) jalurSyncEtollRow(etollSel);
}

function jalurAutofillEditEtoll(driverInput) {
  var sel = document.getElementById('jalur-edit-etoll');
  if (sel) jalurPopulateEtollOptions(sel, document.getElementById('jalur-edit-etoll-id').value || '');
  jalurSetEtollDisplay(
    document.getElementById('jalur-edit-etoll'),
    document.getElementById('jalur-edit-etoll-id'),
    (driverInput && driverInput.value || '')
  );
}

function jalurResolveDefaultCard(driverName) {
  if (!driverName) return null;
  var driver = jalurFindDriverByName(driverName);
  if (!driver) return null;
  var cards = (window.masterData && window.masterData.flazzCards) || [];
  return cards.find(function(x) {
    var defName = String(driver.nama || '').trim();
    var defFor = String(x.default_driver_id || '').trim();
    var hit = defFor === defName || defFor === String(driver.id || '');
    return hit && String(x.status || '').toUpperCase() !== 'NONAKTIF';
  }) || null;
}

function jalurActiveCabang() {
  if (typeof userRole !== 'undefined' && userRole === 'SUPERADMIN') {
    var sel = document.getElementById('jalur-filter-cabang');
    return sel ? sel.value : '';
  }
  return (typeof flazzUserInfo === 'function') ? flazzUserInfo().cabang : '';
}

function jalurPopulateEtollOptions(selectEl, selectedId) {
  if (!selectEl) return;
  var cards = (window.masterData && window.masterData.flazzCards) || [];
  var cabang = jalurActiveCabang();
  var html = '<option value="">Pilih Kartu Etoll...</option>';
  cards.forEach(function(c) {
    if (String(c.status || '') === 'NONAKTIF') return;
    if (cabang && String(c.branch_id) !== String(cabang)) return;
    var label = (c.card_name || '') + (c.card_number ? ' (' + c.card_number + ')' : '') +
      (c.card_role === 'UTAMA' ? ' [UTAMA]' : '');
    var sel = selectedId && String(c.id) === String(selectedId) ? ' selected' : '';
    html += '<option value="' + esc(String(c.id)) + '" data-name="' + esc(String(c.card_name || '')) + '"' + sel + '>' + esc(label) + '</option>';
  });
  selectEl.innerHTML = html;
}

function jalurSyncEtollRow(selectEl) {
  var row = selectEl.closest('.jalur-row');
  var idEl = row ? row.querySelector('.jalur-row-etoll-id') : null;
  var nameEl = row ? row.querySelector('.jalur-row-etoll-name') : null;
  var opt = selectEl.options[selectEl.selectedIndex];
  if (idEl) idEl.value = opt && opt.value ? opt.value : '';
  if (nameEl) nameEl.value = opt && opt.value ? (opt.getAttribute('data-name') || opt.text) : '';
}

function jalurValidateRow(row) {
  var driverInput = row.querySelector('.jalur-row-driver');
  var name = driverInput ? (driverInput.value || '').trim() : '';
  if (!name) return false;
  return !!jalurFindDriverByName(name);
}

function jalurDriverNameById(id) {
  var drivers = (window.masterData && window.masterData.supir) || [];
  var d = drivers.find(function (x) { return String(x.id) === String(id); });
  return d ? d.nama : '';
}

function jalurRenderVehicleOptions(selectEl, selected) {
  if (!selectEl) return;
  const vehicles = (window.masterData && window.masterData.kendaraan) || [];
  var cabangEl = document.getElementById('input-cabang');
  var cabang = cabangEl ? cabangEl.value : '';
  let html = '<option value="">Pilih Kendaraan...</option>';
  vehicles.forEach(function(v) {
    if (cabang && v.cabang !== cabang) return;
    const sel = v.vehicle_id === selected ? ' selected' : '';
    html += '<option value="' + esc(v.vehicle_id) + '"' + sel + '>' + esc(v.plat_nomor) + ' - ' + esc(v.nama) + ' (' + esc(v.jenis) + ')</option>';
  });
  selectEl.innerHTML = html;
}

function jalurAddRow() {
  const container = document.getElementById('jalur-rows');
  const row = document.createElement('div');
  row.className = 'row g-2 mb-2 align-items-end jalur-row';
  row.innerHTML =
    '<div class="col-12 col-md-3"><label class="form-label text-muted small text-uppercase fw-bold">Driver 1</label>' +
    '<input class="form-control jalur-row-driver" list="jalur-supir-datalist" autocomplete="off" placeholder="Nama driver 1..." oninput="jalurAutofillFromDriver(this)"></div>' +
    '<div class="col-12 col-md-3"><label class="form-label text-muted small text-uppercase fw-bold">Driver 2 (Ops)</label>' +
    '<input class="form-control jalur-row-driver2" list="jalur-supir-datalist" autocomplete="off" placeholder="Nama driver 2..."></div>' +
    '<div class="col-12 col-md-3"><label class="form-label text-muted small text-uppercase fw-bold">Kendaraan</label>' +
    '<select class="form-select jalur-row-vehicle"></select></div>' +
    '<div class="col-12 col-md-3"><label class="form-label text-muted small text-uppercase fw-bold">Kartu Etoll</label>' +
    '<select class="form-select jalur-row-etoll" onchange="jalurSyncEtollRow(this)"></select>' +
    '<input type="hidden" class="jalur-row-etoll-id">' +
    '<input type="hidden" class="jalur-row-etoll-name"></div>' +
    '<div class="col-12"><label class="form-label text-muted small text-uppercase fw-bold">Rute Tujuan</label>' +
    '<div class="input-group"><input type="text" class="form-control jalur-row-rute" placeholder="ex: Gudang A - Toko B">' +
    '<button type="button" class="btn btn-outline-danger" onclick="this.closest(\'.jalur-row\').remove()"><i class="bi bi-x"></i></button></div></div>';
  container.appendChild(row);
  jalurRenderVehicleOptions(row.querySelector('.jalur-row-vehicle'));
  jalurPopulateEtollOptions(row.querySelector('.jalur-row-etoll'), '');
}

function jalurInitForm() {
  jalurEnsureMaster(function() {
    populateJalurBuatCabang();
    jalurPopulateDriverDatalist();
    const rows = document.getElementById('jalur-rows');
    if (!rows) return;
    rows.innerHTML = '';
    const t = document.getElementById('jalur-tanggal');
    if (t && !t.value) t.value = new Date().toISOString().slice(0, 10);
    jalurAddRow();
  });
}

function jalurBatal() {
  jalurInitForm();
}

function jalurPopulateListingFilter() {
  var wrap = document.getElementById('jalur-listing-cabang-wrap');
  if (!wrap) return;
  if (typeof userRole !== 'undefined' && userRole === 'SUPERADMIN') {
    wrap.style.display = '';
    if (typeof fillCabangSelect === 'function') fillCabangSelect(document.getElementById('jalur-listing-filter-cabang'));
  } else {
    wrap.style.display = 'none';
  }
}

function jalurPopulateSummaryFilter() {
  var wrap = document.getElementById('jalur-summary-cabang-wrap');
  if (!wrap) return;
  if (typeof userRole !== 'undefined' && userRole === 'SUPERADMIN') {
    wrap.style.display = '';
    if (typeof fillCabangSelect === 'function') fillCabangSelect(document.getElementById('jalur-summary-filter-cabang'));
  } else {
    wrap.style.display = 'none';
  }
}

function populateJalurBuatCabang() {
  var wrap = document.getElementById('jalur-buat-cabang-wrap');
  if (!wrap) return;
  if (typeof userRole !== 'undefined' && userRole === 'SUPERADMIN') {
    wrap.style.display = '';
    if (typeof fillCabangSelect === 'function') fillCabangSelect(document.getElementById('jalur-filter-cabang'));
  } else {
    wrap.style.display = 'none';
  }
}

function onJalurBuatCabangChange() {
  document.querySelectorAll('#jalur-rows .jalur-row').forEach(function(r) {
    var sel = r.querySelector('.jalur-row-etoll');
    if (!sel) return;
    var driver = r.querySelector('.jalur-row-driver');
    var defCard = jalurResolveDefaultCard(driver ? (driver.value || '').trim() : '');
    jalurPopulateEtollOptions(sel, defCard ? defCard.id : '');
    jalurSyncEtollRow(sel);
  });
}

function jalurShowListing() {
  jalurPopulateListingFilter();
  document.getElementById('jalur-listing-loaded').style.display = 'none';
  const loading = document.getElementById('jalur-listing-loading');
  if (loading) loading.style.display = 'block';
  var flt = document.getElementById('jalur-listing-filter-tanggal');
  var tanggal = flt ? flt.value : '';
  var flEnd = document.getElementById('jalur-listing-filter-tanggal-akhir');
  var tanggalAkhir = flEnd ? flEnd.value : '';
  var cabEl = document.getElementById('jalur-listing-filter-cabang');
  var cabang = cabEl ? cabEl.value : '';
  var rid = ++__jalurRequestId;

  google.script.run
    .withSuccessHandler(function(res) {
      if (rid !== __jalurRequestId) return;
      if (loading) loading.style.display = 'none';
      const loaded = document.getElementById('jalur-listing-loaded');
      if (!loaded) return;
      if (!res.success) {
        showToast(res.msg || 'Terjadi kesalahan saat memuat daftar.', 'error');
        return;
      }
      if (!res.list || !res.list.length) {
        loaded.style.display = 'block';
        document.getElementById('jalur-listing-none').style.display = 'block';
        document.getElementById('jalur-listing-none').textContent = 'Belum ada jadwal pengiriman pada ' + (tanggal || 'tanggal terpilih') + '.';
        document.querySelector('#jalur-listing-loaded .card').style.display = 'none';
        return;
      }
      jalurEnsureMaster(function() {
        document.querySelector('#jalur-listing-loaded .card').style.display = 'block';
        document.getElementById('jalur-listing-none').style.display = 'none';
        const tbody = document.getElementById('jalur-listing-table');
        const rows = res.list.map(function(it) {
          const icon = it.jenis_kendaraan === 'Motor' ? 'bi-bicycle' : 'bi-truck';
          return '<tr>' +
            '<td>' + esc(it.tanggal) + '</td>' +
            '<td><i class="bi ' + icon + ' me-2 text-primary"></i>' + esc(it.plat_nomor) + ' <span class="text-muted small">' + esc(it.nama_kendaraan) + '</span></td>' +
            '<td>' + esc(it.nama_driver) + '</td>' +
            '<td>' + esc(it.rute_tujuan) + '</td>' +
            '<td>' + esc(it.flazz_card_name || '-') + '</td>' +
            '<td>' + jalurStatusBadge(it.status) + '</td>' +
            '<td>' + jalurPajakBadge(it.status_pajak, it.sisa_hari_pajak) + '</td>' +
            '<td class="text-end">' + (typeof userRole !== 'undefined' && userRole === 'SUPERADMIN'
              ? '<button class="btn btn-sm btn-outline-primary me-1" title="Edit Jadwal" aria-label="Edit jadwal" onclick="jalurEdit(\'' + it.id + '\')"><i class="bi bi-pencil"></i></button>' +
                '<button class="btn btn-sm btn-outline-danger" title="Hapus Jadwal" aria-label="Hapus jadwal" onclick="jalurDelete(\'' + it.id + '\')"><i class="bi bi-trash"></i></button>'
              : '-') + '</td>' +
          '</tr>';
        }).join('');
        tbody.innerHTML = rows;
      });
      loaded.style.display = 'block';
    })
    .withFailureHandler(function(err) { 
      const loading = document.getElementById('jalur-listing-loading');
      if (loading) loading.style.display = 'none';
      showToast('Gagal memuat: ' + err.message, 'error'); 
    })
    .apiGetJalurByTanggal(tanggal, bbmToken(), { tanggalAkhir: tanggalAkhir, cabang: cabang });
}

  jalurPopulateSummaryFilter();
  const tanggal = document.getElementById('jalur-filter-tanggal').value;
  if (!tanggal) { showToast('Pilih tanggal untuk menampilkan', 'error'); return; }
  var cabEl = document.getElementById('jalur-summary-filter-cabang');
  var cabang = cabEl ? cabEl.value : '';
  var rid = ++__jalurRequestId;

  document.getElementById('jalur-summary-loaded').style.display = 'none';
  const loading = document.getElementById('jalur-summary-loading');
  if (loading) loading.style.display = 'block';

  google.script.run
    .withSuccessHandler(function(res) {
      if (rid !== __jalurRequestId) return;
      if (loading) loading.style.display = 'none';
      const loaded = document.getElementById('jalur-summary-loaded');
      if (!loaded) return;
      if (!res.success) {
        showToast(res.msg || 'Terjadi kesalahan saat memuat jadwal.', 'error');
        return;
      }
      if (!res.list || !res.list.length) {
        loaded.style.display = 'block';
        document.getElementById('jalur-shot').style.display = 'none';

        document.getElementById('jalur-summary-none').textContent = 'Belum ada jadwal pengiriman pada ' + tanggal + '.';
        return;
      }
      jalurEnsureMaster(function() {

        document.getElementById('jalur-summary-none').style.display = 'none';

        const rows = res.list.map(function(it) {
          const icon = it.jenis_kendaraan === 'Motor' ? 'bi-bicycle' : 'bi-truck';
          return '<tr>' +
            '<td><i class="bi ' + icon + ' me-2 text-primary"></i>' + esc(it.plat_nomor) + ' <span class="text-muted small">' + esc(it.nama_kendaraan) + '</span></td>' +
            '<td>' + esc(it.nama_driver) + '</td>' +
            '<td>' + esc(it.nama_driver2 || '-') + '</td>' +
            '<td>' + esc(it.rute_tujuan) + '</td>' +
            '<td>' + esc(it.flazz_card_name || '-') + '</td>' +
            '<td>' + jalurStatusBadge(it.status) + '</td>' +
            '<td>' + jalurPajakBadge(it.status_pajak, it.sisa_hari_pajak, 'Pajak') + '</td>' +
            '<td>' + jalurPajakBadge(it.status_pajak_5, it.sisa_hari_pajak_5, 'Pajak 5 Tahun') + '</td>' +
            '<td>' + (it.jenis_kendaraan === 'Mobil' ? jalurPajakBadge(it.status_kir, it.sisa_hari_kir, 'KIR') : '<span class="badge bg-light text-muted fw-normal border">N/A</span>') + '</td>' +
            '</tr>';
        }).join('');
        tbody.innerHTML = rows;
      });
      loaded.style.display = 'block';
      })
      .withFailureHandler(function(err) { 
        const loading = document.getElementById('jalur-summary-loading');
        if (loading) loading.style.display = 'none';
        showToast('Gagal memuat: ' + err.message, 'error'); 
      })
      .apiGetJalurByTanggal(tanggal, bbmToken(), { cabang: cabang });
}

function jalurRefreshActive() {
  if (document.getElementById('page-jalur-summary') && document.getElementById('page-jalur-summary').style.display === 'block') {
    jalurShowSummary();
  }
  if (document.getElementById('page-jalur-listing') && document.getElementById('page-jalur-listing').style.display === 'block') {
    jalurShowListing();
  }
}

function jalurSave() {
  const tanggal = document.getElementById('jalur-tanggal').value;
  if (!tanggal) { showToast('Pilih tanggal pengiriman', 'error'); return; }
  if (!(window.masterData && window.masterData.supir && window.masterData.kendaraan && window.masterData.supir.length && window.masterData.kendaraan.length)) {
    showToast('Data master driver/kendaraan belum siap', 'error'); return;
  }
  const rows = [];
  let valid = true;
  document.querySelectorAll('#jalur-rows .jalur-row').forEach(function(r) {
    const driverInput = r.querySelector('.jalur-row-driver');
    const vehicleId = r.querySelector('.jalur-row-vehicle').value;
    const rute = r.querySelector('.jalur-row-rute').value;
    if (driverInput && (driverInput.value || '').trim() && vehicleId && rute.trim()) {
      if (!jalurValidateRow(r)) { valid = false; return; }
      const etollId = r.querySelector('.jalur-row-etoll-id');
      const etollName = r.querySelector('.jalur-row-etoll-name');
      rows.push({ 
        driver_id: jalurResolveDriverId(driverInput), 
        driver2_id: jalurResolveDriverId(r.querySelector('.jalur-row-driver2')),
        vehicle_id: vehicleId, 
        rute_tujuan: rute.trim(),
        etoll_card_id: etollId ? etollId.value : '',
        etoll_card_name: etollName ? etollName.value : ''
      });
    }
  });
  if (!valid) { showToast('Ada nama driver yang tidak dikenal, pilih dari daftar', 'error'); return; }
  if (!rows.length) { showToast('Isi minimal satu baris lengkap', 'error'); return; }

  const btnJalur = document.getElementById('btn-jalur-save');
  const originalJalurHTML = btnJalur ? btnJalur.innerHTML : '';
  if (btnJalur) {
    btnJalur.disabled = true;
    btnJalur.innerHTML = "<span class='spinner-border spinner-border-sm'></span> Memproses...";
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (btnJalur) { btnJalur.disabled = false; btnJalur.innerHTML = originalJalurHTML; }
      showToast(res.msg, res.success ? 'success' : 'error');
      if (res.success) {
        if (res.warnings && res.warnings.length) {
          setTimeout(function() { 
            res.warnings.forEach(function(w) { showToast(w, 'error'); });
          }, 400);
        }
        jalurInitForm();
        const tJalur = document.getElementById('jalur-tanggal');
        if (tJalur) tJalur.value = new Date().toISOString().slice(0, 10);
      }
    })
    .withFailureHandler(function(err) {
      if (btnJalur) { btnJalur.disabled = false; btnJalur.innerHTML = originalJalurHTML; }
      showToast('Gagal menyimpan: ' + err.message, 'error');
    })
    .apiSaveJalur({ tanggal: tanggal, rows: rows }, bbmToken());
}

function jalurStatusBadge(status) {
  var s = String(status || 'BELUM_DIISI');
  if (s === 'SELESAI') return '<span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Selesai</span>';
  if (s === 'SUDAH_LAPORAN') return '<span class="badge bg-info text-dark"><i class="bi bi-clipboard-check me-1"></i>Sudah Laporan</span>';
  return '<span class="badge bg-warning text-dark"><i class="bi bi-hourglass-split me-1"></i>Terjadwal</span>';
}

function jalurPajakBadge(status, days, label) {
  label = label || 'Pajak';
  if (status === 'TIDAK_ADA') return '<span class="badge bg-secondary">' + esc(label) + ' -</span>';
  if (status === 'LEWAT') return '<span class="badge bg-dark">' + esc(label) + ' lewat ' + esc(Math.abs(days)) + ' hari</span>';
  if (status === 'KRITIS') return '<span class="badge bg-danger">' + esc(label) + ' habis dalam ' + esc(days) + ' hari</span>';
  if (status === 'WASPADA') return '<span class="badge bg-warning text-dark">' + esc(label) + ' habis dalam ' + esc(days) + ' hari</span>';
  return '<span class="badge bg-success">' + esc(label) + ' habis dalam ' + esc(days) + ' hari</span>';
}

function jalurEdit(id) {
  if (typeof userRole !== 'undefined' && userRole !== 'SUPERADMIN') { showToast('Akses ditolak: hanya SUPERADMIN.', 'error'); return; }
  const tanggalInput = document.getElementById('jalur-listing-filter-tanggal');
  const tanggal = tanggalInput ? tanggalInput.value : '';
  const flEnd = document.getElementById('jalur-listing-filter-tanggal-akhir');
  const tanggalAkhir = flEnd ? flEnd.value : '';
  const cabEl = document.getElementById('jalur-listing-filter-cabang');
  const cabang = cabEl ? cabEl.value : '';
  var rid = ++__jalurRequestId;
  google.script.run
    .withSuccessHandler(function(res) {
      if (rid !== __jalurRequestId) return;
      if (!res.success || !res.list) return;
      const it = res.list.find(function(x) { return String(x.id) === String(id); });
      if (!it) return;
      document.getElementById('jalur-edit-id').value = it.id;
      document.getElementById('jalur-edit-tanggal').value = it.tanggal;
      jalurPopulateDriverDatalist();
      document.getElementById('jalur-edit-driver').value = it.nama_driver || jalurDriverNameById(it.driver_id) || '';
      document.getElementById('jalur-edit-driver2').value = it.nama_driver2 || jalurDriverNameById(it.driver2_id) || '';
      jalurRenderVehicleOptions(document.getElementById('jalur-edit-vehicle'), it.vehicle_id);
      document.getElementById('jalur-edit-rute').value = it.rute_tujuan;
      var editDriverEl = document.getElementById('jalur-edit-driver');
      jalurSetEtollDisplay(
        document.getElementById('jalur-edit-etoll'),
        document.getElementById('jalur-edit-etoll-id'),
        editDriverEl ? editDriverEl.value : ''
      );
      var editEtollId = document.getElementById('jalur-edit-etoll');
      var editEtollIdHidden = document.getElementById('jalur-edit-etoll-id');
      if (!editEtollIdHidden.value && it.flazz_card_id) {
        jalurPopulateEtollOptions(editEtollId, it.flazz_card_id);
        editEtollIdHidden.value = it.flazz_card_id;
        if (editEtollId) {
          var hasOption = Array.prototype.some.call(editEtollId.options, function(o) { return String(o.value) === String(it.flazz_card_id); });
          if (!hasOption) editEtollId.value = '';
        }
      }
      new bootstrap.Modal(document.getElementById('modal-jalur-edit')).show();
    })
    .withFailureHandler(function(err) { showToast('Gagal memuat data edit: ' + err.message, 'error'); })
    .apiGetJalurByTanggal(tanggal, bbmToken(), { tanggalAkhir: tanggalAkhir, cabang: cabang });
}

function jalurSaveEdit() {
  if (typeof userRole !== 'undefined' && userRole !== 'SUPERADMIN') { showToast('Akses ditolak: hanya SUPERADMIN.', 'error'); return; }
  const etollEl = document.getElementById('jalur-edit-etoll');
  const etollId = document.getElementById('jalur-edit-etoll-id');
  const etollOpt = etollEl && etollEl.selectedIndex > -1 ? etollEl.options[etollEl.selectedIndex] : null;
  const data = {
    id: document.getElementById('jalur-edit-id').value,
    tanggal: document.getElementById('jalur-edit-tanggal').value,
    driver_id: jalurResolveDriverId(document.getElementById('jalur-edit-driver')),
    driver2_id: jalurResolveDriverId(document.getElementById('jalur-edit-driver2')),
    vehicle_id: document.getElementById('jalur-edit-vehicle').value,
    rute_tujuan: document.getElementById('jalur-edit-rute').value,
    etoll_card_id: etollId ? etollId.value : '',
    etoll_card_name: etollOpt && etollOpt.value ? (etollOpt.getAttribute('data-name') || etollOpt.text) : ''
  };
  if (!data.driver_id) { showToast('Nama driver tidak valid, pilih dari daftar', 'error'); return; }
  if (!data.tanggal || !data.vehicle_id || !data.rute_tujuan.trim()) {
    showToast('Lengkapi semua field', 'error'); return;
  }
  google.script.run
    .withSuccessHandler(function(res) {
      showToast(res.msg, res.success ? 'success' : 'error');
      if (res.success) {
        bootstrap.Modal.getInstance(document.getElementById('modal-jalur-edit')).hide();
        jalurRefreshActive();
      }
    })
    .withFailureHandler(function(err) { showToast('Gagal: ' + err.message, 'error'); })
    .apiUpdateJalur(data, bbmToken());
}

function jalurDelete(id) {
  if (typeof userRole !== 'undefined' && userRole !== 'SUPERADMIN') { showToast('Akses ditolak: hanya SUPERADMIN.', 'error'); return; }
  showConfirmModal({ message: 'Yakin ingin menghapus jadwal ini?' }, function() {
  google.script.run
    .withSuccessHandler(function(res) {
      showToast(res.msg, res.success ? 'success' : 'error');
      if (res.success) jalurRefreshActive();
    })
    .withFailureHandler(function(err) { showToast('Gagal menghapus: ' + err.message, 'error'); })
    .apiDeleteJalur(id, bbmToken());
  });
}

function jalurSummaryText() {
  const rows = document.querySelectorAll('#jalur-summary-table tr');
  const tanggal = document.getElementById('jalur-summary-tanggal').textContent;
  const created = document.getElementById('jalur-summary-created').textContent;
  let text = 'JALUR PENGIRIMAN\nTanggal: ' + tanggal + '\nDibuat oleh: ' + created + '\n\n';
  rows.forEach(function(tr) {
    const tds = tr.querySelectorAll('td');
    if (tds.length >= 5) {
      text += '- ' + tds[0].textContent.trim() + ' | Driver: ' + tds[1].textContent.trim() + ' | Rute: ' + tds[3].textContent.trim() + ' | Etoll: ' + tds[4].textContent.trim() + '\n';
    }
  });
  return text;
}

function jalurShareWA() {
  const text = encodeURIComponent(jalurSummaryText());
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

function jalurTakeScreenshot() {
  const shot = document.getElementById('jalur-shot');
  if (!shot || shot.style.display === 'none') { showToast('Tampilkan dulu jadwal pada tanggal yang dipilih', 'error'); return; }
  if (typeof html2canvas === 'undefined') { showToast('Library screenshot belum dimuat', 'error'); return; }
  html2canvas(shot, { scale: 2, backgroundColor: '#ffffff' }).then(function(canvas) {
    const container = document.getElementById('jalur-shot-canvas');
    container.innerHTML = '';
    canvas.style.maxWidth = '100%';
    canvas.style.height = 'auto';
    container.appendChild(canvas);
    new bootstrap.Modal(document.getElementById('modal-jalur-shot')).show();
  }).catch(function(e) { showToast('Gagal screenshot: ' + e, 'error'); });
}
</script>
