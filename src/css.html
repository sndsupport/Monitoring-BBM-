<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css' rel='stylesheet'>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap' rel='stylesheet'>
<style>

  /* ============ DESIGN TOKENS ============ */
  :root {
    --color-primary: #208b3a;
    --color-primary-dark: #176b2c;
    --color-primary-darker: #124f21;
    --color-primary-light: #e6f4ea;
    --color-primary-100: #c6e6cf;

    --color-accent: #7c3aed;
    --color-accent-dark: #6428c9;
    --color-accent-light: #f1eafe;

    --color-info: #0ea5e9;
    --color-info-dark: #0284c7;
    --color-info-light: #e6f7fd;

    --color-warning: #d97706;
    --color-warning-dark: #b45309;
    --color-warning-light: #fef3e2;

    --color-danger: #dc2626;
    --color-danger-dark: #b91c1c;
    --color-danger-light: #fdecec;

    --color-success: #198754;

    --color-bg: #f5f8f6;
    --color-surface: #ffffff;
    --color-border: #e2e8e4;
    --color-border-strong: #cbd5cf;

    --color-text: #16241a;
    --color-text-secondary: #43574a;
    --color-text-muted: #6b7d72;

    --font-heading: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    --font-body: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-full: 999px;

    --shadow-sm: 0 1px 3px rgba(20, 40, 28, 0.07);
    --shadow-md: 0 6px 20px rgba(20, 40, 28, 0.08);
    --shadow-lg: 0 16px 40px rgba(20, 40, 28, 0.14);

    --transition-fast: 150ms ease;
    --transition-base: 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ============ BRAND COLOR MAPPING (single source of truth) ============ */
  .bg-primary { background-color: var(--color-primary) !important; }
  .text-primary { color: var(--color-primary) !important; }
  .border-primary { border-color: var(--color-primary) !important; }

  .btn-primary {
    background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%) !important;
    border-color: var(--color-primary-dark) !important;
    color: #fff !important;
  }
  .btn-primary:hover, .btn-primary:focus {
    background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary-darker) 100%) !important;
    border-color: var(--color-primary-darker) !important;
  }
  .btn-outline-primary {
    color: var(--color-primary) !important;
    border-color: var(--color-primary) !important;
    background: transparent !important;
  }
  .btn-outline-primary:hover {
    background: var(--color-primary) !important;
    color: #fff !important;
  }

  /* Accent (violet) — used for the Supir module so it stays visually distinct
     from the primary brand green without relying on inline style overrides. */
  .btn-accent {
    background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-dark) 100%) !important;
    border-color: var(--color-accent-dark) !important;
    color: #fff !important;
  }
  .btn-accent:hover, .btn-accent:focus {
    background: var(--color-accent-dark) !important;
    border-color: var(--color-accent-dark) !important;
  }
  .bg-accent { background-color: var(--color-accent) !important; }
  .border-accent { border-color: var(--color-accent) !important; }
  .text-accent { color: var(--color-accent) !important; }

  .bg-info { background-color: var(--color-info) !important; color: #fff !important; }
  .text-info { color: var(--color-info-dark) !important; }
  .border-info { border-color: var(--color-info) !important; }
  .alert-info {
    background-color: var(--color-info-light) !important;
    border-color: #bce8f7 !important;
    color: #075985 !important;
  }
  .bg-warning { background-color: var(--color-warning) !important; color: #fff !important; }
  .alert-warning {
    background-color: var(--color-warning-light) !important;
    border-color: #fbd9a5 !important;
    color: #8a5108 !important;
  }

  .nav-pills .nav-link.active { background-color: var(--color-primary) !important; color: white !important; }
  .nav-pills .nav-link {
    color: var(--color-text-secondary);
    font-weight: 500;
    transition: var(--transition-fast);
  }
  .nav-pills .nav-link:hover {
    color: var(--color-primary);
    background-color: var(--color-primary-light);
  }
  .navbar-dark .navbar-brand { font-weight: 700; letter-spacing: 0.01em; }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; font-size: 75%; }

  body {
    background-color: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    font-size: 12px;
    line-height: 1.55;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-heading);
    color: var(--color-text);
  }
  h1 { font-size: 2rem; font-weight: 700; }
  h2 { font-size: 1.5rem; font-weight: 600; }
  h3 { font-size: 1.25rem; font-weight: 600; }
  h4 { font-size: 1.125rem; font-weight: 600; }
  h5 { font-size: 1rem; font-weight: 600; }

  a { color: var(--color-primary); }

  /* Respect user motion preference across every animation in this file */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  :focus-visible {
    outline: 2.5px solid var(--color-primary);
    outline-offset: 2px;
  }

  /* ============ NAVBAR ============ */
  .navbar.bg-primary {
    background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%) !important;
    box-shadow: var(--shadow-sm);
  }
  .navbar-brand {
    font-family: var(--font-heading);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .navbar-brand::before {
    content: '\f612'; /* bi-fuel-pump-fill */
    font-family: 'bootstrap-icons';
    font-size: 1.1rem;
  }
  #user-info { font-size: 13px; opacity: 0.95; white-space: nowrap; }

  .navbar-logout-btn {
    width: 40px;
    height: 40px;
    min-width: 44px;
    min-height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: background-color var(--transition-fast);
    flex-shrink: 0;
  }
  .navbar-logout-btn:hover { background: rgba(255, 255, 255, 0.3); }

  /* ============ CARDS ============ */
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
    overflow: hidden;
    transition: box-shadow var(--transition-base);
  }

  .card-header {
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: 16px;
    font-weight: 600;
    font-family: var(--font-heading);
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--color-text);
  }

  .card-body { padding: 16px; }

  .rounded-4 { border-radius: var(--radius-lg) !important; }

  /* ============ FORMS ============ */
  .form-label {
    font-weight: 600;
    color: var(--color-text-secondary);
    margin-bottom: 6px;
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  .form-control, .form-select {
    height: 48px;
    border: 1.5px solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-family: var(--font-body);
    padding: 8px 12px;
    color: var(--color-text);
    background-color: var(--color-surface);
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }

  .form-control:focus, .form-select:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3.5px var(--color-primary-light);
    outline: none;
  }

  .form-control-sm, .form-select-sm, .form-control-lg {
    font-size: 12px;
  }

  .form-control::placeholder { color: #97a69d; }

  .input-group-text {
    border: 1.5px solid var(--color-border-strong);
    color: var(--color-text-muted);
    background-color: #f2f6f3;
  }

  /* ============ BUTTONS ============ */
  .btn {
    height: 48px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-family: var(--font-heading);
    font-size: 12px;
    padding: 0 24px;
    transition: all var(--transition-fast);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .btn:active { transform: scale(0.98); }

  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-success {
    background: linear-gradient(135deg, #198754 0%, #157347 100%);
    border: none;
  }

  .btn-danger {
    background: linear-gradient(135deg, var(--color-danger) 0%, var(--color-danger-dark) 100%);
    border: none;
  }

  .btn-outline-secondary {
    border: 1.5px solid var(--color-border-strong);
    color: var(--color-text-secondary);
    background: transparent;
  }
  .btn-outline-secondary:hover {
    background: #eef2ef;
    border-color: var(--color-text-muted);
  }

  .btn-outline-danger {
    color: var(--color-danger);
    border-color: var(--color-danger);
  }
  .btn-outline-danger:hover {
    background: var(--color-danger);
    color: #fff;
  }

  .btn-sm { height: 38px; padding: 0 14px; font-size: 12px; }

  .btn-full { width: 100%; }

  .btn-lg { height: 54px; font-size: 12px; }

  /* ============ SECTION HEADERS ============ */
  .section-title {
    font-family: var(--font-heading);
    font-size: 1rem;
    font-weight: 600;
    color: var(--color-text-secondary);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--color-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ============ TOGGLES ============ */
  .toggle-group { display: flex; gap: 8px; }

  .toggle-btn {
    flex: 1;
    height: 44px;
    border: 1.5px solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    font-weight: 600;
    color: var(--color-text-muted);
    cursor: pointer;
    transition: all var(--transition-fast);
  }

  .toggle-btn.active {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: white;
  }

  /* ============ PHOTO UPLOAD ============ */
  .photo-upload {
    border: 2px dashed var(--color-border-strong);
    border-radius: var(--radius-md);
    padding: 24px;
    text-align: center;
    background: #f7faf8;
    cursor: pointer;
    transition: all var(--transition-fast);
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .photo-upload:hover {
    border-color: var(--color-primary);
    background: var(--color-primary-light);
  }

  .photo-upload.has-image {
    border-style: solid;
    border-color: var(--color-success);
    background: var(--color-primary-light);
  }

  .photo-upload i { font-size: 32px; color: #a7b6ac; }

  .photo-upload.has-image i { color: var(--color-success); }

  .photo-upload span { font-size: 12px; color: var(--color-text-muted); }

  /* ============ STATS / SUMMARY ============ */
  .stats-box {
    background: #f2f6f3;
    border-radius: var(--radius-sm);
    padding: 12px;
    text-align: center;
  }

  .stats-box .stats-label {
    font-size: 12px;
    color: var(--color-text-muted);
    margin-bottom: 4px;
  }

  .stats-box .stats-value {
    font-family: var(--font-heading);
    font-size: 16px;
    font-weight: 600;
    color: var(--color-text);
    font-variant-numeric: tabular-nums;
  }

  .summary-box {
    background: var(--color-primary-light);
    border: 1px solid var(--color-primary-100);
    border-radius: var(--radius-md);
    padding: 16px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .summary-row:last-child { margin-bottom: 0; }

  .summary-total {
    border-top: 2px solid var(--color-primary);
    padding-top: 8px;
    margin-top: 8px;
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 18px;
    color: var(--color-primary-dark);
  }

  /* ============ EMPTY STATE ============ */
  .empty-state { text-align: center; padding: 48px 24px; }

  .empty-state i { font-size: 64px; color: #b7c6bd; margin-bottom: 16px; }

  .empty-state h5 { color: var(--color-text-secondary); margin-bottom: 8px; }

  .empty-state p { color: var(--color-text-muted); font-size: 14px; }

  /* ============ TOASTS ============ */
  .toast-container {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
  }

  @media (max-width: 768px) {
    .toast-container { top: 16px; left: 16px; right: 16px; }
  }

  .app-toast {
    background: var(--color-surface);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lg);
    padding: 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-body);
    animation: slideIn var(--transition-base);
  }

  .app-toast.success { border-left: 4px solid var(--color-success); }
  .app-toast.error { border-left: 4px solid var(--color-danger); }

  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes slideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0; }
  }

  /* ============ SKELETON / LOADING ============ */
  .skeleton {
    background: linear-gradient(90deg, #e9efec 25%, #dde6e0 50%, #e9efec 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: var(--radius-sm);
  }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .loading-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(245, 248, 246, 0.92);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
  }

  .loading-overlay .spinner-border { width: 48px; height: 48px; color: var(--color-primary); }

  /* ============ NAVIGATION ============ */
  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 66px;
    z-index: 1000;
    box-shadow: 0 -2px 12px rgba(20, 40, 28, 0.06);
  }

  /* Self-contained flex row: not dependent on Bootstrap's .d-flex utility
     classes, so the bar always lays out correctly regardless of load order. */
  .bottom-nav > div {
    display: flex !important;
    width: 100%;
    height: 100%;
  }

  .btn-nav {
    background: none;
    border: none;
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 4px;
    color: var(--color-text-muted);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    gap: 4px;
    transition: color var(--transition-fast);
    cursor: pointer;
    touch-action: manipulation;
    position: relative;
    min-width: 44px;
    min-height: 44px;
  }

  .btn-nav i { font-size: 20px; }

  .btn-nav.active { color: var(--color-primary); font-weight: 600; }

  .btn-nav.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 3px;
    background: var(--color-primary);
    border-radius: 3px 3px 0 0;
  }

  .btn-nav:hover { color: var(--color-primary); }

  /* ============ APP SHELL (sidebar on desktop, stacked on mobile) ============ */
  .app-shell { display: block; }

  .app-sidebar {
    flex-direction: column;
    gap: 2px;
    margin: 0;
    padding: 0;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border-left: 3px solid transparent;
    color: var(--color-text-secondary) !important;
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 12.5px;
    text-decoration: none;
    white-space: nowrap;
    transition: background-color var(--transition-fast), color var(--transition-fast);
  }

  .sidebar-link i { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

  .sidebar-link:hover {
    background: var(--color-primary-light);
    color: var(--color-primary-dark) !important;
    text-decoration: none;
  }

  .sidebar-link.active {
    background: var(--color-primary-light);
    color: var(--color-primary-dark) !important;
    border-left-color: var(--color-primary);
  }

  .sidebar-admin-group {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--color-border);
  }

  .sidebar-footer {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--color-border);
  }

  .sidebar-user {
    padding: 0 14px 10px;
    font-size: 12px;
    color: var(--color-text-muted);
    line-height: 1.5;
  }

  .sidebar-user strong {
    display: block;
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text);
  }

  .sidebar-logout-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 14px;
    border: none;
    background: transparent;
    border-radius: var(--radius-sm);
    color: var(--color-danger);
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    transition: background-color var(--transition-fast);
  }

  .sidebar-logout-btn i { font-size: 15px; width: 18px; text-align: center; }

  .sidebar-logout-btn:hover { background: var(--color-danger-light); }

  .app-footer {
    margin-top: 24px;
    padding: 14px 4px;
    border-top: 1px solid var(--color-border);
    text-align: center;
    color: var(--color-text-muted);
    font-size: 12px;
  }

  @media (min-width: 769px) {
    .bottom-nav { display: none !important; }
    .top-tabs { display: flex !important; }

    .app-shell {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }

    .app-sidebar {
      flex: 0 0 220px;
      position: sticky;
      top: 20px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 16px 12px;
    }

    .app-main-content {
      flex: 1 1 0%;
      min-width: 0;
      width: 100%;
    }
    
    .app-main-content > div {
      width: 100%;
    }
    
    .app-main-content .card {
      width: 100%;
    }
  }

  @media (max-width: 768px) {
    .bottom-nav { display: flex; }
    .top-tabs { display: none !important; }
    #main-app { padding-bottom: 84px; }
    .card { margin-left: -16px; margin-right: -16px; border-radius: 0; }
  }

  /* ============ LOGIN ============ */
  #page-login .card {
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--color-border);
  }

  #login-logo i { color: var(--color-primary) !important; }

  /* ============ TABLES ============ */
  .table thead.table-dark {
    --bs-table-bg: var(--color-primary-darker);
    --bs-table-color: #fff;
  }
  .table-hover tbody tr:hover { background-color: var(--color-primary-light); }

  /* ============ MISC ============ */
  .list-group-item { border-color: var(--color-border); }
  .modal-content { border-radius: var(--radius-lg); overflow: hidden; }

  /* ============ JALUR PENGIRIMAN ============ */
  #jalur-shot .badge { font-size: 0.7rem; }
  #jalur-shot .table { font-size: 0.85rem; }
  #jalur-shot-canvas img, #jalur-shot-canvas canvas { max-width: 100%; height: auto; }
</style>
