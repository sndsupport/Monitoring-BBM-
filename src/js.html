<script>
  let formDataPayload = {};
  let userRole = '';
  let ocrModal;
  let userInfo = null;
  window.masterData = { kendaraan: [], cabang: [], supir: [], bbm: [] };
  let allVehicles = [];
  let allDrivers = [];

  var SESSION_MAX_AGE_MS = 12 * 60 * 60 * 1000;
  function loadSessionUser() {
    try {
      var raw = localStorage.getItem('bbm_user');
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object') return null;
      if (obj.__ts && (Date.now() - obj.__ts > SESSION_MAX_AGE_MS)) {
        localStorage.removeItem('bbm_user');
        return null;
      }
      return obj;
    } catch (e) {
      localStorage.removeItem('bbm_user');
      return null;
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    ocrModal = new bootstrap.Modal(document.getElementById('ocrModal'));
    document.getElementById('tanggal').valueAsDate = new Date();
    
    loadAppSettings();
    
    var kmAwalInput = document.getElementById('km_awal_val');
    var kmAkhirInput = document.getElementById('km_akhir_val');
    if (kmAwalInput) kmAwalInput.addEventListener('input', updateOCRSummary);
    if (kmAkhirInput) kmAkhirInput.addEventListener('input', updateOCRSummary);
    
    let storedUser = loadSessionUser();
    if (storedUser) {
       userInfo = storedUser;
       loadInitialData(userInfo);
    } else {
       document.getElementById('page-login').style.display = 'block';
       var loginUserInput = document.getElementById('login_username');
       if (loginUserInput) loginUserInput.focus();
    }
  });

  var btnTogglePw = document.getElementById('btn-toggle-pw');
  var pwInput = document.getElementById('login_password');
  if (btnTogglePw && pwInput) {
    btnTogglePw.addEventListener('click', function() {
      var isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      btnTogglePw.querySelector('i').className = isPw ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  }

  function handleLogin() {
    let un = document.getElementById('login_username').value;
    let pw = document.getElementById('login_password').value;
    var errBox = document.getElementById('login-error');
    function showLoginError(msg) {
      if (errBox) { errBox.textContent = msg; errBox.classList.remove('d-none'); }
      else showToast(msg, 'error');
    }
    if (!un || !pw) { showLoginError('Username dan password wajib diisi.'); return; }
    if (errBox) errBox.classList.add('d-none');

    let btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.innerText = 'Mengecek...';

    google.script.run.withSuccessHandler(function(res) {
       if (res.success) {
         res.__ts = Date.now();
         userInfo = res;
         localStorage.setItem('bbm_user', JSON.stringify(res));
         showToast('Login berhasil!', 'success');
         loadInitialData(userInfo);
       } else {
          showLoginError(res.msg);
          btn.disabled = false;
          btn.innerText = 'Masuk';
       }
    }).doLogin(un, pw);
  }

  function logout() {
    localStorage.removeItem('bbm_user');
    document.getElementById('user-info').innerHTML = '';
    var sidebarUserInfo = document.getElementById('sidebar-user-info');
    if (sidebarUserInfo) sidebarUserInfo.innerHTML = '';
    var btnLogoutMobile = document.getElementById('btn-logout-mobile');
    if (btnLogoutMobile) btnLogoutMobile.style.display = 'none';
    document.getElementById('main-app').style.display = 'none';
    var bottomNav = document.getElementById('bottom-nav');
    if (bottomNav) bottomNav.style.display = 'none';
    document.getElementById('page-login').style.display = 'block';
    document.getElementById('page-form').style.display = 'none';
    document.getElementById('page-dashboard').style.display = 'none';
    document.getElementById('page-dashboard-history').style.display = 'none';
    document.getElementById('page-master').style.display = 'none';
    document.getElementById('page-settings').style.display = 'none';
    document.getElementById('login_username').value = '';
    document.getElementById('login_password').value = '';
    var btn = document.getElementById('btn-login');
    btn.disabled = false;
    btn.innerText = 'Masuk';
  }

  function loadInitialData(uInfo) {
    document.getElementById('page-login').style.display = 'none';
    
    let btn = document.getElementById('btn-login');
    if(btn) btn.innerText = 'Memuat Data...';

    google.script.run
      .withFailureHandler(function(err) {
         console.error('SERVER FAILURE:', err && err.stack || err);
         var msg = err && err.message ? err.message : (err ? String(err) : 'unknown');
         showToast('Terjadi kesalahan server: ' + msg, 'error');
         logout();
      })
      .withSuccessHandler(function(data) {
        var isInvalidData = !data || typeof data !== 'object' || (Array.isArray && Array.isArray(data));
        if (data && data.error) {
           console.error('processInitialData error payload:', data);
           showToast('Error server: ' + data.error, 'error');
           logout();
           return;
        }
        if (isInvalidData) {
           console.error('processInitialData returned invalid data:', data);
           showToast('Data server tidak valid (respons null). Coba muat ulang atau hubungi admin.', 'error');
           logout();
           return;
        }

        document.getElementById('main-app').style.display = 'block';
        var bottomNav = document.getElementById('bottom-nav');
        if (bottomNav) bottomNav.style.display = 'flex';
        var btnLogoutMobile = document.getElementById('btn-logout-mobile');
        if (btnLogoutMobile) btnLogoutMobile.style.display = 'flex';

        userRole = data.role;
        let displayRole = userRole === 'PIC CABANG' ? 'Admin' : userRole;
        var userSummary = data.user + ' (' + displayRole + ' - ' + data.cabang + ')';
        document.getElementById('user-info').innerHTML = userSummary;
        var sidebarUserInfo = document.getElementById('sidebar-user-info');
        if (sidebarUserInfo) sidebarUserInfo.innerHTML = '<strong>' + data.user + '</strong><br><span class="text-muted" style="font-size: 0.85rem;">' + displayRole + ' &middot; ' + data.cabang + '</span>';

        if (userRole === 'SUPERADMIN' || userRole === 'PIC CABANG') {
          document.getElementById('nav-master').classList.remove('d-none');
          document.getElementById('btn-nav-master').style.display = 'flex';
          
          if (userRole !== 'SUPERADMIN') {
             // Sembunyikan tab cabang dan BBM dari DOM dengan CSS inject atau hide element
             let masterTabs = document.getElementById('master-tabs');
             if (masterTabs) {
                let btnCabang = masterTabs.querySelector('button[data-tab="cabang"]');
                if (btnCabang) btnCabang.parentElement.style.display = 'none';
                let btnBBM = masterTabs.querySelector('button[data-tab="bbm"]');
                if (btnBBM) btnBBM.parentElement.style.display = 'none';
             }
          }
        }

        if (userRole === 'SUPERADMIN') {
          document.getElementById('nav-settings').classList.remove('d-none');
          document.getElementById('btn-nav-settings').style.display = 'flex';
          var inputCabangFilter = document.getElementById('input-cabang-filter');
          if (inputCabangFilter) inputCabangFilter.style.display = 'block';
          var wrapperFilterCabang = document.getElementById('wrapper-filter-cabang');
          if (wrapperFilterCabang) wrapperFilterCabang.style.display = 'block';
        }

        
        let roleAlert = document.getElementById('role-alert');
        if (userRole === 'SUPERADMIN') {
          if(roleAlert) {
             roleAlert.className = 'alert alert-warning text-center';
             roleAlert.innerHTML = '<small><i class="bi bi-shield-check me-1"></i> Anda login sebagai SUPERADMIN. Akses penuh ke seluruh warehouse.</small>';
          }
        } else {
          if(roleAlert) {
             let displayRole = userRole === 'PIC CABANG' ? 'Admin' : userRole;
             roleAlert.className = 'alert alert-info text-center';
             roleAlert.innerHTML = '<small><i class="bi bi-info-circle me-1"></i> Anda login sebagai ' + displayRole + '. Warehouse: ' + data.cabang + '</small>';
          }
        }

        let selectVeh = document.getElementById('vehicle');
        selectVeh.innerHTML = ''; 
        let defaultOptVeh = document.createElement('option');
        defaultOptVeh.value = '';
        defaultOptVeh.text = 'Pilih Kendaraan...';
        selectVeh.appendChild(defaultOptVeh);
        data.vehicles.forEach(v => {
          let opt = document.createElement('option');
          opt.value = v.vehicle_id;
          opt.setAttribute('data-indikator', (v.jenis_indikator || 'DIGITAL_BAR'));
          opt.text = v.plat_nomor + ' - ' + v.nama;
          selectVeh.appendChild(opt);
        });
        
        let selectSupir = document.getElementById('nama_supir');
        let filterSupir = document.getElementById('filter-supir');
        selectSupir.innerHTML = '';
        if (filterSupir) filterSupir.innerHTML = '<option value="">Semua Supir</option>';
        if (data.drivers) {
          data.drivers.forEach(d => {
            let opt = document.createElement('option');
            opt.value = d.nama;
            opt.text = d.nama; // Sembunyikan ID agar lebih rapi
            selectSupir.appendChild(opt);
            
            if (filterSupir) {
              let opt2 = document.createElement('option');
              opt2.value = d.nama;
              opt2.text = d.nama;
              filterSupir.appendChild(opt2);
            }
          });
        }

        let selectCabang = document.getElementById('m_cabang');
        let selectCabangSupir = document.getElementById('m_cabang_supir');
        if (selectCabang) {
           selectCabang.innerHTML = '';
           if(selectCabangSupir) selectCabangSupir.innerHTML = '';
           
           data.cabangList.forEach(c => {
             let opt = document.createElement('option');
             opt.value = c.kode;
             opt.text = c.nama;
             selectCabang.appendChild(opt);
             
             if(selectCabangSupir) {
               let opt2 = document.createElement('option');
               opt2.value = c.kode;
               opt2.text = c.nama;
               selectCabangSupir.appendChild(opt2);
             }
           });
        }

        let selectBBM = document.getElementById('jenis_bbm');
        if (selectBBM && data.bbmList) {
          selectBBM.innerHTML = '<option value="">-- Pilih BBM --</option>';
          data.bbmList.forEach(b => {
             let opt = document.createElement('option');
             opt.value = b.harga;
             opt.text = b.jenis + ' (Rp ' + b.harga + '/L)';
             opt.dataset.jenis = b.jenis;
             selectBBM.appendChild(opt);
          });
        }

        let selectFlazz = document.getElementById('flazz_card_id');
        if (selectFlazz && data.flazzCards) {
          selectFlazz.innerHTML = '<option value="">Pilih Kartu...</option>';
          data.flazzCards.forEach(f => {
             // Hanya kartu yang status SEDANG_DIGUNAKAN (Atau biarkan admin pilih yang mana saja tapi disarankan SEDANG_DIGUNAKAN, 
             // Untuk mempermudah, kita filter status SEDANG_DIGUNAKAN atau biarkan semua muncul jika role admin. Kita tampilkan semua aktif saja)
             if(f.status !== 'NONAKTIF') {
                let opt = document.createElement('option');
                opt.value = f.id;
                let driverName = f.driver_id ? ` [${f.driver_id}]` : '';
                opt.text = f.card_number + ' - ' + f.card_type + driverName;
                selectFlazz.appendChild(opt);
             }
          });
        }

        let filterCabang = document.getElementById('filter-cabang');
        if (filterCabang && data.cabangList) {
          filterCabang.innerHTML = '<option value="">Semua Warehouse</option>';
          data.cabangList.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c.nama;
            opt.text = c.nama;
            filterCabang.appendChild(opt);
          });
        }

        let inputCabang = document.getElementById('input-cabang');
        if (inputCabang && data.cabangList) {
          inputCabang.innerHTML = '<option value="">Semua Warehouse</option>';
          data.cabangList.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c.kode;
            opt.text = c.nama;
            inputCabang.appendChild(opt);
          });
        }

        allVehicles = data.vehicles || [];
        allDrivers = data.drivers || [];
        if (data.bbmList) window.masterData.bbm = data.bbmList;
        if (data.flazzCards) window.masterData.flazzCards = data.flazzCards;
        populateSupirDatalist();

        loadAppSettings();
        switchTab('dashboard');
        prefillFormFromLast(uInfo);
      })
      .processInitialData(uInfo);
  }

  function loadAppSettings() {
    google.script.run
      .withSuccessHandler(function(settings) {
        if (settings.logo_url) {
          var logoHtml = '<img src="' + settings.logo_url + '" alt="Logo" style="max-height: 100px; max-width: 200px;">';
          var loginLogo = document.getElementById('login-logo');
          if (loginLogo) loginLogo.innerHTML = logoHtml;
        }
        if (settings.app_name) {
          document.getElementById('login-app-name').innerText = settings.app_name;
          var brand = document.querySelector('.navbar-brand');
          if (brand) brand.innerText = settings.app_name;
        }
        if (settings.company_name) {
          document.getElementById('login-company-name').innerText = settings.company_name;
        }
        if (settings.footer_text !== undefined && settings.footer_text !== null) {
          var footer = document.getElementById('app-footer');
          var footerText = document.getElementById('app-footer-text');
          if (footer && footerText) {
            if (settings.footer_text !== '') {
              footerText.innerText = settings.footer_text;
              footer.style.display = 'block';
            }
          }
        }
      })
      .getAppSettings();
  }

  function switchTab(tab) {
    document.getElementById('page-form').style.display = 'none';
    document.getElementById('page-dashboard').style.display = 'none';
    document.getElementById('page-dashboard-history').style.display = 'none';
    document.getElementById('page-performa').style.display = 'none';
    document.getElementById('page-gallery').style.display = 'none';
    document.getElementById('page-master').style.display = 'none';
    document.getElementById('page-settings').style.display = 'none';
    
    let flazzPages = ['dashboard', 'master', 'usage', 'topup', 'tol', 'recon', 'history', 'listing'];
    flazzPages.forEach(p => {
       let el = document.getElementById('page-flazz-' + p);
       if(el) el.style.display = 'none';
    });

    let jalurPages = ['buat', 'listing', 'summary'];
    jalurPages.forEach(p => {
       let el = document.getElementById('page-jalur-' + p);
       if(el) el.style.display = 'none';
    });
    
    let sharedFilter = document.getElementById('shared-filter-card');
    if(sharedFilter) sharedFilter.style.display = (tab === 'history' || tab === 'gallery') ? 'block' : 'none';
    
    if (tab === 'form') {
      document.getElementById('page-form').style.display = 'block';
    } else if (tab === 'dashboard') {
      document.getElementById('page-dashboard').style.display = 'block';
      renderDashboard();
    } else if (tab === 'history') {
      document.getElementById('page-dashboard-history').style.display = 'block';
      loadDashboard();
    } else if (tab === 'performa') {
      document.getElementById('page-performa').style.display = 'block';
      loadPerforma();
    } else if (tab === 'gallery') {
      document.getElementById('page-gallery').style.display = 'block';
      loadDashboard(); // Gunakan data yang sama
    } else if (tab === 'master') {
      document.getElementById('page-master').style.display = 'block';
      loadMasterData();
    } else if (tab === 'settings') {
      document.getElementById('page-settings').style.display = 'block';
      if (typeof loadSettings === 'function') loadSettings();
    } else if (tab === 'flazz-listing') {
      document.getElementById('page-flazz-listing').style.display = 'block';
      if (typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper();
      if (typeof renderFlazzListing === 'function') renderFlazzListing();
    } else if (tab.startsWith('flazz-')) {
      let flazzTab = tab.substring(6);
      let pageEl = document.getElementById('page-flazz-' + flazzTab);
      if(pageEl) pageEl.style.display = 'block';
      if(typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper();
    } else if (tab === 'jalur-buat') {
      document.getElementById('page-jalur-buat').style.display = 'block';
      if (typeof jalurInitForm === 'function') jalurInitForm();
    } else if (tab === 'jalur-listing') {
      document.getElementById('page-jalur-listing').style.display = 'block';
      let t = document.getElementById('jalur-listing-filter-tanggal');
      if (t && !t.value) t.value = new Date().toISOString().slice(0, 10);
      if (typeof jalurShowListing === 'function') jalurShowListing();
    } else if (tab === 'jalur-summary') {
      document.getElementById('page-jalur-summary').style.display = 'block';
      let t = document.getElementById('jalur-filter-tanggal');
      if (t && !t.value) t.value = new Date().toISOString().slice(0, 10);
      if (typeof jalurShowSummary === 'function') jalurShowSummary();
    }
    
    document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.btn-nav').forEach(el => el.classList.remove('active'));
    
    let activeTab = document.getElementById('tab-' + tab);
    if (activeTab) activeTab.classList.add('active');
    
    let activeBtn = document.querySelector('.btn-nav[data-tab="' + tab + '"]');
    if (activeBtn) activeBtn.classList.add('active');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  var MAX_PHOTO_BYTES = 5 * 1024 * 1024;
  function validatePhotoFile(file) {
    if (!file) return { ok: true };
    if (file.size > MAX_PHOTO_BYTES) {
      return { ok: false, msg: 'Ukuran foto maksimal 5MB. Foto Anda ' + Math.ceil(file.size / 1024 / 1024) + 'MB.' };
    }
    return { ok: true };
  }

  function previewPhoto(input, previewId) {
    if (!(input.files && input.files[0])) return;
    var v = validatePhotoFile(input.files[0]);
    if (!v.ok) { showToast(v.msg, 'error'); input.value = ''; return; }
    var reader = new FileReader();
    reader.onload = function(e) {
      var previewDiv = document.getElementById(previewId);
      previewDiv.style.display = 'block';
      previewDiv.querySelector('img').src = e.target.result;
      input.closest('.photo-upload').classList.add('has-image');
      input.closest('.photo-upload').querySelector('span').textContent = 'Foto sudah dipilih';
    };
    reader.readAsDataURL(input.files[0]);
  }

  function previewEditPhoto(input, previewId) {
    if (input.files && input.files[0]) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = document.getElementById(previewId);
        if (img) { img.src = e.target.result; img.style.display = 'block'; }
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function validateStep(step) {
    if (step === 1) {
      let v = document.getElementById('vehicle');
      let s = document.getElementById('nama_supir');
      let t = document.getElementById('tanggal');
      if (!v.checkValidity() || !s.checkValidity() || !t.checkValidity()) {
        v.reportValidity();
        s.reportValidity();
        t.reportValidity();
        return false;
      }
      if (typeof isSupirNameValid === 'function' && !isSupirNameValid()) {
        showToast('Nama supir tidak valid, pilih dari daftar', 'error');
        s.classList.add('is-invalid');
        return false;
      }
      s.classList.remove('is-invalid');
    } else if (step === 2) {
      let ba = document.getElementById('bar_awal');
      let bk = document.getElementById('bar_akhir');
      let fo = document.getElementById('foto_odo_awal');
      let fa = document.getElementById('foto_odo_akhir');
      if (!ba.checkValidity() || !bk.checkValidity() || !fo.checkValidity() || !fa.checkValidity()) {
        ba.reportValidity();
        bk.reportValidity();
        fo.reportValidity();
        fa.reportValidity();
        return false;
      }
    }
    return true;
  }

  function nextStep(currentStep) {
    if (!validateStep(currentStep)) return;
    document.getElementById('step-' + currentStep).style.display = 'none';
    let next = currentStep + 1;
    document.getElementById('step-' + next).style.display = 'block';
    updateStepIndicator(next);
  }

  function prevStep(currentStep) {
    document.getElementById('step-' + currentStep).style.display = 'none';
    let prev = currentStep - 1;
    document.getElementById('step-' + prev).style.display = 'block';
    updateStepIndicator(prev);
  }

  function updateStepIndicator(step) {
    let progress = step === 1 ? 0 : (step === 2 ? 50 : 100);
    document.getElementById('step-progress').style.width = progress + '%';
    
    for(let i=1; i<=3; i++) {
      let ind = document.getElementById('indicator-step-' + i);
      if (!ind) continue;
      let circle = ind.querySelector('.step-circle');
      let text = ind.querySelector('small');
      
      if (i <= step) {
        circle.className = 'step-circle bg-success text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-1 fw-bold shadow-sm border';
        text.className = 'fw-bold text-success';
      } else {
        circle.className = 'step-circle bg-light text-muted rounded-circle d-flex align-items-center justify-content-center mx-auto mb-1 fw-bold border';
        text.className = 'text-muted';
      }
    }
  }

  function toggleBBM(value, btn) {
    document.getElementById('isi_bensin').value = value;
    document.getElementById('bbm-section').style.display = (value === 'Ya') ? 'block' : 'none';
    btn.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (value === 'Tidak') {
      resetTolFields();
      var tolSec = document.getElementById('tol-section');
      if (tolSec) tolSec.style.display = 'none';
      var flazzSec = document.getElementById('flazz-card-section');
      if (flazzSec) flazzSec.style.display = 'none';
    }
  }

  function toggleFlazzCardSelection() {
    var metode = document.getElementById('metode_pembayaran').value;
    var isFlazz = (metode === 'FLAZZ');
    document.getElementById('flazz-card-section').style.display = isFlazz ? 'block' : 'none';
    var tolSec = document.getElementById('tol-section');
    if (tolSec) tolSec.style.display = isFlazz ? 'block' : 'none';
  }

  function resetTolFields() {
    var t = document.getElementById('biaya_toll');
    if (t) t.value = '';
    var f = document.getElementById('foto_struk_toll');
    if (f) f.value = '';
  }

  function toggleSection(id, val) {
    document.getElementById(id).style.display = (val === 'Ya') ? 'block' : 'none';
  }

  function confirmResetForm() {
    if (!confirm('Laporan yang sudah diisi akan dihapus. Lanjutkan?')) return;
    resetDailyForm();
  }

  function resetDailyForm() {
    document.getElementById('daily-form').reset();
    document.getElementById('isi_bensin').value = 'Tidak';
    document.getElementById('bbm-section').style.display = 'none';
    document.getElementById('flazz-card-section').style.display = 'none';
    var tolSec = document.getElementById('tol-section');
    if (tolSec) tolSec.style.display = 'none';

    document.querySelectorAll('#daily-form .toggle-group').forEach(group => {
      group.querySelectorAll('.toggle-btn').forEach((b, idx) => b.classList.toggle('active', idx === 0));
    });

    ['preview-awal', 'preview-akhir', 'preview-indikator', 'preview-bbm', 'preview-toll'].forEach(id => {
      const p = document.getElementById(id);
      p.style.display = 'none';
      const img = p.querySelector('img');
      if (img) img.src = '';
    });

    document.querySelectorAll('#daily-form .photo-upload').forEach(u => {
      u.classList.remove('has-image');
      const span = u.querySelector('span');
      if (span) span.textContent = 'Tap untuk upload foto';
    });
    
    // Kembalikan ke step 1
    if (typeof updateStepIndicator === 'function') {
      document.getElementById('step-1').style.display = 'block';
      document.getElementById('step-2').style.display = 'none';
      document.getElementById('step-3').style.display = 'none';
      updateStepIndicator(1);
    }

    document.getElementById('km_awal_val').value = '';
    document.getElementById('km_akhir_val').value = '';
    document.getElementById('ocr-summary').style.display = 'none';

    if (typeof onVehicleChange === 'function') onVehicleChange();

    formDataPayload = {};
  }

  function prefillFormFromLast(userInfo) {
    if (!userInfo || !userInfo.username) return;
    var tglInput = document.getElementById('tanggal');
    if (tglInput) {
      var today = new Date();
      tglInput.value = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    }
    google.script.run
      .withFailureHandler(function () {})
      .withSuccessHandler(function (res) {

  function getBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) { resolve(null); return; }
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  async function processDailyReport() {
    let odoAwal = document.getElementById('foto_odo_awal').files[0];
    let odoAkhir = document.getElementById('foto_odo_akhir').files[0];
    let strukBBM = document.getElementById('foto_struk_bbm').files[0];
    let strukToll = document.getElementById('foto_struk_toll') ? document.getElementById('foto_struk_toll').files[0] : null;
    let fotoIndikator = document.getElementById('foto_indikator') ? document.getElementById('foto_indikator').files[0] : null;

    if (!document.getElementById('daily-form').checkValidity()) {
      document.getElementById('daily-form').reportValidity();
      return;
    }
    
    let metode_pembayaran = document.getElementById('metode_pembayaran') ? document.getElementById('metode_pembayaran').value : 'TUNAI';
    let flazz_card_id = document.getElementById('flazz_card_id') ? document.getElementById('flazz_card_id').value : '';
    
    if (document.getElementById('isi_bensin').value === 'Ya' && metode_pembayaran === 'FLAZZ' && !flazz_card_id) {
       showToast('Harap pilih Kartu Flazz jika metode pembayaran menggunakan Flazz.', 'error');
       return;
    }

    let btn = document.getElementById('btn-process');
    let originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = "<span class='spinner-border spinner-border-sm'></span> Sedang Upload & Proses OCR...";

    try {
      if (!isSupirNameValid()) { showToast('Nama supir tidak valid, pilih dari daftar', 'error'); return; }
      let bbmSelect = document.getElementById('jenis_bbm');
      let bbmNama = '';
      if(bbmSelect && bbmSelect.selectedIndex > 0) {
        bbmNama = bbmSelect.options[bbmSelect.selectedIndex].dataset.jenis;
      }

      formDataPayload = {
        vehicle_id: document.getElementById('vehicle').value,
        nama_supir: document.getElementById('nama_supir').value,
        tanggal: document.getElementById('tanggal').value,
        bar_awal: document.getElementById('bar_awal').value,
        bar_akhir: document.getElementById('bar_akhir').value,
        liter_bbm: document.getElementById('liter_bbm') ? document.getElementById('liter_bbm').value || 0 : 0,
        biaya_bbm: document.getElementById('biaya_bbm') ? document.getElementById('biaya_bbm').value || 0 : 0,
        biaya_toll: document.getElementById('biaya_toll') ? document.getElementById('biaya_toll').value || 0 : 0,
        jenis_bbm_nama: bbmNama,
        metode_pembayaran: metode_pembayaran,
        flazz_card_id: flazz_card_id,
        foto_odo_awal: await getBase64(odoAwal),
        foto_odo_awal_name: odoAwal.name,
        foto_odo_akhir: await getBase64(odoAkhir),
        foto_odo_akhir_name: odoAkhir.name,
        foto_struk_bbm: strukBBM ? await getBase64(strukBBM) : null,
        foto_struk_bbm_name: strukBBM ? strukBBM.name : null,
        foto_struk_toll: strukToll ? await getBase64(strukToll) : null,
        foto_struk_toll_name: strukToll ? strukToll.name : null,
        foto_indikator: fotoIndikator ? await getBase64(fotoIndikator) : null,
        foto_indikator_name: fotoIndikator ? fotoIndikator.name : null,
        level_bbm: document.getElementById('level_bbm') ? document.getElementById('level_bbm').value : '',
        confidence_bbm: document.getElementById('confidence_bbm') ? document.getElementById('confidence_bbm').value : '',
        keterangan: document.getElementById('keterangan') ? document.getElementById('keterangan').value : ''
      };

      google.script.run
        .withSuccessHandler(function(res) {
           btn.disabled = false;
           btn.innerHTML = originalText;
           if(res.success) {
             document.getElementById('km_awal_val').value = res.km_awal || '';
              document.getElementById('km_akhir_val').value = res.km_akhir || '';
               formDataPayload.serverData = res;
               delete formDataPayload.foto_odo_awal;
               delete formDataPayload.foto_odo_akhir;
               delete formDataPayload.foto_struk_bbm;
               delete formDataPayload.foto_struk_toll;
               delete formDataPayload.foto_struk_toll_name;
               delete formDataPayload.foto_indikator;
               delete formDataPayload.foto_indikator_name;

               if (res.level_bbm !== undefined && res.level_bbm !== null && res.level_bbm !== '') {
                 var lvlEl = document.getElementById('level_bbm');
                 var confEl = document.getElementById('confidence_bbm');
                 if (lvlEl) lvlEl.value = res.level_bbm;
                 if (confEl && res.confidence_bbm !== undefined && res.confidence_bbm !== null && res.confidence_bbm !== '') {
                   confEl.value = res.confidence_bbm;
                 }
                 var st = res.level_status || 'NOT_DETECTED';
                 if (st === 'SUCCESS' || st === 'LOW_CONFIDENCE') {
                   showToast(st === 'SUCCESS' ? ('Level BBM terdeteksi: ' + res.level_bbm + '%') : ('Level BBM terdeteksi (confidence rendah): ' + res.level_bbm + '%'), 'success');

                 }
               }

               updateOCRSummary();
               ocrModal.show();

           }
        })
        .withFailureHandler(function(err){

           btn.innerHTML = originalText;
        })
        .processDailyImages(formDataPayload);

    } catch (e) {
      showToast('Error membaca file: ' + e.toString(), 'error');
      btn.disabled = false;
      btn.innerHTML = originalText;

  function updateOCRSummary() {
    var kmAwal = parseFloat(document.getElementById('km_awal_val').value) || 0;
    var kmAkhir = parseFloat(document.getElementById('km_akhir_val').value) || 0;
    var kmTempuh = kmAkhir - kmAwal;
    
    if (kmTempuh > 0) {
      document.getElementById('summary-km').textContent = kmTempuh + ' KM';
      document.getElementById('ocr-summary').style.display = 'block';
      
      var literBBM = parseFloat(document.getElementById('liter_bbm') ? document.getElementById('liter_bbm').value : 0) || 0;
      var biayaBBM = parseFloat(document.getElementById('biaya_bbm') ? document.getElementById('biaya_bbm').value : 0) || 0;
      var biayaToll = parseFloat(document.getElementById('biaya_toll') ? document.getElementById('biaya_toll').value : 0) || 0;

      var totalBiaya = biayaBBM + biayaToll;
      
      document.getElementById('summary-bbm').textContent = literBBM ? literBBM + ' L' : '-';
      document.getElementById('summary-bbm-cost').textContent = biayaBBM ? formatCurrency(biayaBBM) : '-';
      document.getElementById('summary-total').textContent = formatCurrency(totalBiaya);
    } else {
      document.getElementById('ocr-summary').style.display = 'none';
    }
  }

  function renderDashPagination(totalPages) {
    let nav = document.getElementById('dash-pagination-nav');
    let ul = document.getElementById('dash-pagination');
    if(!nav || !ul) return;
    if(totalPages <= 1){ nav.classList.add('d-none'); ul.innerHTML = ''; return; }
    nav.classList.remove('d-none');
    let cur = window.__dashPage;
    let html = '';
    html += "<li class='page-item" + (cur===1?" disabled":"") + "'><a class='page-link' href='#' onclick='dashGotoPage(" + (cur-1) + "); return false;'>&laquo;</a></li>";
    for (let p = 1; p <= totalPages; p++) {
      html += "<li class='page-item" + (p===cur?" active":"") + "'><a class='page-link' href='#' onclick='dashGotoPage(" + p + "); return false;'>" + p + "</a></li>";
    }
    html += "<li class='page-item" + (cur===totalPages?" disabled":"") + "'><a class='page-link' href='#' onclick='dashGotoPage(" + (cur+1) + "); return false;'>&raquo;</a></li>";
    ul.innerHTML = html;
  }

  function dashGotoPage(n){
    let total = Math.ceil((window.__dashData || []).length / DASH_PER);
    if(n < 1) n = 1;
    if(n > total) n = total;
    window.__dashPage = n;
    renderDashboardData();
  }

  function editDaily(id) {
    let row = (window.__recent || []).find(r => String(r.transaction_id) === String(id));
    if(!row) return showToast('Data tidak ditemukan', 'error');
    document.getElementById('ed_trx').value = row.transaction_id;
    document.getElementById('ed_nama_supir').value = row.supir || '';
    document.getElementById('ed_km_awal').value = row.km_awal || '';
    document.getElementById('ed_km_akhir').value = row.km_akhir || '';
    document.getElementById('ed_biaya').value = row.biaya_bbm || '';
    document.getElementById('ed_liter').value = row.isi_bbm || '';
    let edToll = document.getElementById('ed_biaya_toll');
    if (edToll) edToll.value = (row.toll !== undefined && row.toll !== null) ? row.toll : '';

    let jenisSel = document.getElementById('ed_jenis_bbm');
    if(jenisSel){
      let bbms = (window.masterData && window.masterData.bbm) ? window.masterData.bbm : [];
      jenisSel.innerHTML = '<option value="">-- Pilih BBM --</option>' + bbms.map(b => '<option value="' + b.harga + '">' + b.jenis + ' (Rp ' + b.harga + '/L)</option>').join('');
      // Default pilih BBM pertama agar liter terisi otomatis dari harga
      if (bbms.length && row.biaya_bbm) jenisSel.value = String(bbms[0].harga);
      calcEditLiter();
    }

    let metode = document.getElementById('ed_metode');
    if(metode){
      metode.value = row.metode_pembayaran || 'TUNAI';
      toggleEditFlazz();
    }
    let flazz = document.getElementById('ed_flazz_card_id');
    if(flazz){
      let cards = (window.masterData && window.masterData.flazzCards) ? window.masterData.flazzCards : [];
      flazz.innerHTML = '<option value="">-- Pilih Kartu --</option>' + cards.map(c=>'<option value="'+c.id+'">'+c.card_number + (c.driver_id ? ' [' + c.driver_id + ']' : '') + '</option>').join('');
      flazz.value = row.flazz_card_id || '';
      // Autofill kartu dari supir bila transaksi ini ber-Flazz dan kartu belum terpilih
      if (metode && metode.value === 'FLAZZ' && !flazz.value) {
        autofillEditFlazzByDriver();
      }
    }
    var pA = document.getElementById('ed_preview_odo_awal');
    if (pA) {
      if (row.foto_odo_awal) { pA.src = row.foto_odo_awal_thumb || row.foto_odo_awal; pA.style.display = 'block'; }
      else { pA.src = ''; pA.style.display = 'none'; }
      var fA = document.getElementById('ed_foto_odo_awal');
      if (fA) fA.value = '';
    }
    var pK = document.getElementById('ed_preview_odo_akhir');
    if (pK) {
      if (row.foto_odo_akhir) { pK.src = row.foto_odo_akhir_thumb || row.foto_odo_akhir; pK.style.display = 'block'; }
      else { pK.src = ''; pK.style.display = 'none'; }
      var fK = document.getElementById('ed_foto_odo_akhir');
      if (fK) fK.value = '';
    }
    new bootstrap.Modal(document.getElementById('modal-edit-daily')).show();
  }
  // Autofill kartu Flazz berdasarkan nama supir (kartu terikat pada supir / driver_id)
  function autofillEditFlazzByDriver() {
    let supir = document.getElementById('ed_nama_supir').value;
    let flazz = document.getElementById('ed_flazz_card_id');
    let metode = document.getElementById('ed_metode');
    if (!flazz || !supir) return;
    if (metode && metode.value !== 'FLAZZ') return;
    let cards = (window.masterData && window.masterData.flazzCards) ? window.masterData.flazzCards : [];
    let match = cards.find(c => String(c.driver_id) === String(supir) && String(c.status) !== 'NONAKTIF');
    if (match && !flazz.value) {
      flazz.value = match.id;
    }
  }
  function toggleEditFlazz(){
    let m = document.getElementById('ed_metode').value;
    let f = document.getElementById('ed_flazz_row');
    if(f) f.style.display = (m === 'FLAZZ') ? 'block' : 'none';
    let tr = document.getElementById('ed_toll_row');
    if(tr) tr.style.display = (m === 'FLAZZ') ? 'block' : 'none';
    if (m === 'FLAZZ') autofillEditFlazzByDriver();
  }
  async function saveEditDaily(e){
    e.preventDefault();
    let payload = {
      transaction_id: document.getElementById('ed_trx').value,
      nama_supir: document.getElementById('ed_nama_supir').value,
      km_awal: document.getElementById('ed_km_awal').value,
      km_akhir: document.getElementById('ed_km_akhir').value,
      biaya_bbm: document.getElementById('ed_biaya').value,
      biaya_toll: document.getElementById('ed_biaya_toll') ? document.getElementById('ed_biaya_toll').value : 0,
      liter_bbm: document.getElementById('ed_liter').value,
      metode_pembayaran: document.getElementById('ed_metode').value,
      flazz_card_id: document.getElementById('ed_metode').value === 'FLAZZ' ? document.getElementById('ed_flazz_card_id').value : ''
    };
    let fAwal = document.getElementById('ed_foto_odo_awal');
    if (fAwal && fAwal.files && fAwal.files[0]) {
      payload.foto_odo_awal = await getBase64(fAwal.files[0]);
      payload.foto_odo_awal_name = fAwal.files[0].name;
    }
    let fAkhir = document.getElementById('ed_foto_odo_akhir');
    if (fAkhir && fAkhir.files && fAkhir.files[0]) {
      payload.foto_odo_akhir = await getBase64(fAkhir.files[0]);
      payload.foto_odo_akhir_name = fAkhir.files[0].name;
    }
    google.script.run.withSuccessHandler(res => {
      if(res.success){ 
         showToast(res.msg, 'success'); 
         bootstrap.Modal.getInstance(document.getElementById('modal-edit-daily')).hide(); 
         if (typeof flazzDataCache !== 'undefined') flazzDataCache = null; // Flush cache
         loadDashboard();
         if (typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper(true);
      }
      else showToast(res.msg, 'error');
    }).apiEditDailyTransaction(payload);
  }
  function deleteDaily(id){
    if(!confirm('Yakin menghapus transaksi BBM ini? Jika ber-Flazz, saldo kartu akan dikembalikan.')) return;
    google.script.run.withSuccessHandler(res => {
      if(res.success){ 
         showToast(res.msg, 'success'); 
         if (typeof flazzDataCache !== 'undefined') flazzDataCache = null; // Flush cache
         loadDashboard();
         if (typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper(true);
      }
      else showToast(res.msg, 'error');
    }).apiDeleteDailyTransaction(id);
  }

  function formatCurrency(value) {
    if (!value || value === '0') return 'Rp 0';
    return 'Rp ' + parseInt(value).toLocaleString('id-ID');
  }

  function efisiensiBadge(status) {
    if (!status) return '';
    let warna = 'success';
    if (status === 'Di bawah standar') warna = 'danger';
    else if (status === 'Di atas standar') warna = 'info';
    else if (status === 'Data Belum Cukup') warna = 'secondary';
    return " <span class='badge bg-" + warna + "'>" + status + "</span>";
  }

  function escapeAttr(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/'/g, '&#39;')
      .replace(/"/g, '&quot;');
  }

  function odoWarningBadgeHtml(warning) {
    if (!warning) return '';
    return " <span class='badge bg-warning text-dark ms-1' style='cursor:help;' title='" + escapeAttr(warning) + "'><i class='bi bi-exclamation-triangle me-1'></i>Ada selisih KM</span>";
  }

  function odoWarningStripHtml(warning) {
    if (!warning) return '';
    return "<div class='text-warning small mb-2' style='cursor:help;' title='" + escapeAttr(warning) + "'><i class='bi bi-exclamation-triangle me-1'></i>Ada selisih KM awal & KM akhir sebelumnya</div>";
  }

  function fotoThumbHtml(url, thumb, label) {
    if (!url) return "<span class='text-muted small'>-</span>";
    const inner = thumb
      ? "<img src='" + thumb + "' alt='" + label + "' loading='lazy' width='64' height='48' class='rounded border' style='object-fit:cover'>"
      : "<span class='badge bg-secondary'>" + label + "</span>";
    return "<a href='" + url + "' target='_blank' title='Lihat " + label + "'>" + inner + "</a>";
  }

  function resetFilters() {
    if(document.getElementById('filter-cabang')) document.getElementById('filter-cabang').value = '';
    if(document.getElementById('filter-supir')) document.getElementById('filter-supir').value = '';
    if(document.getElementById('filter-date-start')) document.getElementById('filter-date-start').value = '';

  function populateSupirDatalist() {
    var dl = document.getElementById('supir-datalist');
    if (!dl) return;
    var src = (typeof allDrivers !== 'undefined' && allDrivers.length) ? allDrivers : ((window.masterData && window.masterData.supir) || []);
    var cabang = document.getElementById('input-cabang') ? document.getElementById('input-cabang').value : '';
    dl.innerHTML = '';
    src.forEach(function (d) {
      if (cabang && d.cabang !== cabang) return;
      var o = document.createElement('option');
      o.value = d.nama;
      dl.appendChild(o);
    });
  }

  function getSupirSelectedName() {
    return document.getElementById('nama_supir') ? document.getElementById('nama_supir').value : '';
  }

  function getSupirFromName(name) {
    var src = (typeof allDrivers !== 'undefined' && allDrivers.length) ? allDrivers : ((window.masterData && window.masterData.supir) || []);
    var cabang = document.getElementById('input-cabang') ? document.getElementById('input-cabang').value : '';
    return src.find(function (d) { 
      if (cabang && d.cabang !== cabang) return false;
      return d.nama === name; 
    });
  }

  function applySupirAutofill() {
    var name = getSupirSelectedName().trim();
    var vehSel = document.getElementById('vehicle');
    var d = getSupirFromName(name);
    if (vehSel) vehSel.value = (d && d.default_vehicle_id) ? d.default_vehicle_id : '';
    onVehicleChange();
  }

  function onSupirChange() {
    applySupirAutofill();
  }

  // Sembunyikan field Bar Bensin Awal/Akhir untuk kendaraan berindikator bukan
  // Digital Bar (mis. jarum/analog, tanpa indikator, digital angka). Bar hanya
  // relevan untuk indikator Digital Bar yang bisa dihitung per segmen.
  function onVehicleChange() {
    var vehSel = document.getElementById('vehicle');
    var indikator = 'DIGITAL_BAR';
    if (vehSel && vehSel.selectedOptions && vehSel.selectedOptions[0]) {
      indikator = vehSel.selectedOptions[0].getAttribute('data-indikator') || indikator;
    }
    if (vehSel && vehSel.value && indikator === 'DIGITAL_BAR') {
      var found = (allVehicles || []).find(function (v) { return v.vehicle_id === vehSel.value; });
      if (found && found.jenis_indikator) indikator = found.jenis_indikator;
    }
    var hide = indikator !== 'DIGITAL_BAR';

    var gAwal = document.getElementById('bar-awal-group');
    var gAkhir = document.getElementById('bar-akhir-group');
    if (gAwal) gAwal.style.display = hide ? 'none' : '';
    if (gAkhir) gAkhir.style.display = hide ? 'none' : '';

    var bAwal = document.getElementById('bar_awal');
    var bAkhir = document.getElementById('bar_akhir');
    if (bAwal) bAwal.required = !hide;
    if (bAkhir) bAkhir.required = !hide;
    if (hide) {
      if (bAwal) bAwal.value = '';
      if (bAkhir) bAkhir.value = '';
    }
  }

  function isSupirNameValid() {
    var name = getSupirSelectedName().trim();
    if (!name) return false;
    return !!getSupirFromName(name);
  }

  function filterFormByCabang() {
    var cabang = document.getElementById('input-cabang').value;
    var selectVeh = document.getElementById('vehicle');
    selectVeh.innerHTML = '';
    var defaultOpt = document.createElement('option');
    defaultOpt.value = '';
    defaultOpt.text = 'Pilih Kendaraan...';
    selectVeh.appendChild(defaultOpt);
    var filteredV = cabang ? allVehicles.filter(function (v) { return v.cabang === cabang; }) : (allVehicles || []);
    filteredV.forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v.vehicle_id;
      opt.setAttribute('data-indikator', (v.jenis_indikator || 'DIGITAL_BAR'));
      opt.text = v.plat_nomor + ' - ' + v.nama;
      selectVeh.appendChild(opt);
    });
    populateSupirDatalist();
    applySupirAutofill();
    onVehicleChange();
  }

  function calcLiter() {
    let sel = document.getElementById('jenis_bbm');
    let hrg = parseFloat(sel.value) || 0;
    let biaya = parseFloat(document.getElementById('biaya_bbm').value) || 0;
    let liter = (hrg > 0 && biaya > 0) ? (biaya / hrg) : 0;
    document.getElementById('liter_bbm').value = liter ? liter.toFixed(2) : '';
  }

  // Autofill liter BBM dari biaya pada modal edit transaksi.
  // Harga per liter diambil dari dropdown jenis BBM (jika tersedia),
  // fallback ke harga BBM aktif pertama (bbmList).
  function calcEditLiter() {
    const biaya = parseFloat(document.getElementById('ed_biaya').value) || 0;
    const litEl = document.getElementById('ed_liter');
    const jenisSel = document.getElementById('ed_jenis_bbm');
    let harga = 0;
    if (jenisSel && jenisSel.value) {
      harga = parseFloat(jenisSel.value) || 0;
    } else {
      let bbm = (window.masterData && window.masterData.bbm) || [];
      harga = (bbm.length && parseFloat(bbm[0].harga)) || 0;
    }
    if (harga > 0 && biaya > 0) {
      litEl.value = (biaya / harga).toFixed(2);
    } else if (biaya === 0) {
      litEl.value = '';
    }
  }

  function switchMasterTab(tab) {
    document.querySelectorAll('.master-tab-content').forEach(el => {

    });
    document.getElementById('master-' + tab).style.display = 'block';
    document.querySelectorAll('#master-tabs .nav-link').forEach(btn => {
      btn.classList.remove('active');
    });
    document.querySelector('#master-tabs [data-tab="' + tab + '"]').classList.add('active');
    loadMasterData(tab);
  }

  function loadMasterData(tab) {
    tab = tab || 'kendaraan';
    
    if (tab === 'flazz') {
       if (typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper();
       return;
    }
    
    google.script.run
      .withSuccessHandler(function(data) {
        if (!data || typeof data !== 'object') {
           console.error('getMasterData returned invalid data:', data);
           showToast('Gagal memuat data master: respons server tidak valid', 'error');
           return;
        }
        if (tab === 'kendaraan') {
          renderKendaraanList(data.vehicles || []);
        } else if (tab === 'cabang') {
          renderCabangList(data.cabangList || []);
        } else if (tab === 'supir') {
          renderSupirList(data.drivers || []);
        } else if (tab === 'bbm') {
          renderBBMList(data.bbmList || []);
        }
      })
      .withFailureHandler(function(err) {
        showToast('Gagal memuat data: ' + err.message, 'error');
      })
      .getMasterData(userInfo);
  }

  function renderKendaraanList(vehicles) {
    window.masterData.kendaraan = vehicles;
    let container = document.getElementById('list-kendaraan');
    if (vehicles.length === 0) {
      container.innerHTML = '<div class="list-group-item text-center text-muted py-4">Belum ada data kendaraan</div>';
      return;
    }
    container.innerHTML = vehicles.map(v => {
      let ind = v.jenis_indikator || 'DIGITAL_BAR';
      let indLabel = ind === 'ANALOG_JARUM' ? 'Analog/Jarum' : ind === 'DIGITAL_ANGKA' ? 'Digital Angka' : ind === 'TIDAK_ADA' ? 'Tidak Ada' : ind === 'LAINNYA' ? 'Lainnya' : 'Digital Bar';
      let estimasi = 0;
      let k = parseFloat(v.kapasitas_tangki) || 0;
      let s = parseFloat(v.standar_km_l) || 0;
      if (k > 0 && s > 0) estimasi = Math.round(k * s);
      let info = v.jenis + ' - ' + v.cabang;
      if (estimasi > 0) info += ' · Est. jarak satu tangki: ±' + estimasi + ' KM';
      return '<div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">' +
        '<div class="d-flex align-items-center">' +
          '<div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px;">' +
            '<i class="bi ' + (v.jenis === 'Motor' ? 'bi-bicycle' : 'bi-car-front-fill') + ' fs-5"></i>' +
          '</div>' +
          '<div>' +
            '<div class="fw-bold mb-1 fs-6">' + v.plat_nomor + '</div>' +
            '<div class="d-flex align-items-center small text-muted flex-wrap">' +
              '<span class="badge bg-secondary me-2">' + v.nama + '</span>' +
              '<span class="me-2">' + info + '</span>' +
              '<span class="badge bg-info text-dark">' + indLabel + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<button class="btn btn-sm btn-outline-primary me-2" aria-label="Edit kendaraan ' + v.plat_nomor + '" onclick="editKendaraan(\'' + v.vehicle_id + '\')"><i class="bi bi-pencil"></i></button>' +

        '</div>' +
      '</div>';
    }).join('');
  }

  function showToast(message, type) {
    var container = document.getElementById('toast-container');
    if (!container) return;
    if (container.children.length >= 5) container.removeChild(container.firstChild);
    var toast = document.createElement('div');
    type = type || 'success';
    toast.className = 'app-toast ' + type;
    toast.setAttribute('role', 'status');
    var iconMap = { success: 'bi-check-circle text-success', error: 'bi-exclamation-circle text-danger', warning: 'bi-exclamation-triangle text-warning' };
    var icon = iconMap[type] || iconMap.success;
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'btn-close btn-close-sm ms-auto';
    closeBtn.setAttribute('aria-label', 'Tutup notifikasi');
    closeBtn.onclick = function() { removeToast(toast); };
    toast.innerHTML = '<i class="bi ' + icon + ' me-2"></i><span>' + escapeAttr(message) + '</span>';
    toast.appendChild(closeBtn);
    container.appendChild(toast);
    var delay = type === 'error' ? 6000 : 3500;
    setTimeout(function() { if (toast.parentNode) removeToast(toast); }, delay);
  }

  function removeToast(toast) {
    if (!toast || !toast.parentNode) return;
    toast.style.animation = 'slideOut 0.3s ease forwards';
    setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
  }
