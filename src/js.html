<script>
  let formDataPayload = {};
  let userRole = '';
  let userInfo = null;
  window.masterData = { kendaraan: [], cabang: [], supir: [], bbm: [], pengguna: [] };
  let allVehicles = [];
  let allDrivers = [];

  var SESSION_MAX_AGE_MS = 12 * 60 * 60 * 1000;
  var __dashCache = null;
  var __perfCache = null;
  function bbmToken() {
    return localStorage.getItem('bbm_token') || '';
  }
  function loadSessionUser() {
    try {
      var raw = localStorage.getItem('bbm_user');
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object') return null;
      if (!bbmToken()) { localStorage.removeItem('bbm_user'); return null; }
      if (obj.__ts && (Date.now() - obj.__ts > SESSION_MAX_AGE_MS)) {
        localStorage.removeItem('bbm_user');
        localStorage.removeItem('bbm_token');
        return null;
      }
      return obj;
    } catch (e) {
      localStorage.removeItem('bbm_user');
      localStorage.removeItem('bbm_token');
      return null;
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('tanggal').valueAsDate = new Date();
    
    loadAppSettings();
    
    let storedUser = loadSessionUser();
    if (storedUser) {
       userInfo = storedUser;
       loadInitialData(userInfo);
    } else {
document.getElementById('page-login').style.display = 'flex';
       var loginUserInput = document.getElementById('login_username');
       if (loginUserInput) loginUserInput.focus();
    }
  });

  document.addEventListener('DOMContentLoaded', function() {
    var cardTolSelect = document.getElementById('flazz_card_id_toll');
    if (cardTolSelect) {
      cardTolSelect.addEventListener('change', onTolCardSelect);
    }
  });

  var btnTogglePw = document.getElementById('btn-toggle-pw');
  var pwInput = document.getElementById('login_password');
  if (btnTogglePw && pwInput) {
    btnTogglePw.addEventListener('click', function() {
      var isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      btnTogglePw.querySelector('i').className = isPw ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  }

  function handleLogin() {
    let un = document.getElementById('login_username').value;
    let pw = document.getElementById('login_password').value;
    var errBox = document.getElementById('login-error');
    function showLoginError(msg) {
      if (errBox) { errBox.textContent = msg; errBox.classList.remove('d-none'); }
      else showToast(msg, 'error');
    }
    if (!un || !pw) { showLoginError('Username dan password wajib diisi.'); return; }
    if (errBox) errBox.classList.add('d-none');

    let btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.innerText = 'Mengecek...';

    google.script.run.withSuccessHandler(function(res) {
       if (res.success) {
         var u = res.user || {};
         u.__ts = Date.now();
         userInfo = u;
         localStorage.setItem('bbm_token', res.token);
         localStorage.setItem('bbm_user', JSON.stringify(u));
         showToast(res.user && res.user.must_change ? 'Login berhasil! Segera ganti password Anda.' : 'Login berhasil!', 'success');
         loadInitialData(userInfo);
       } else {
          showLoginError(res.msg);
          btn.disabled = false;
          btn.innerText = 'Masuk';
       }
    }).withFailureHandler(function(err) {
       btn.disabled = false;
       btn.innerText = 'Masuk';
       showLoginError('Gagal menghubungi server: ' + (err && err.message ? err.message : 'terjadi kesalahan'));
    }).doLogin(un, pw);
  }

  function logout() {
    var t = bbmToken();
    localStorage.removeItem('bbm_token');
    localStorage.removeItem('bbm_user');
    if (t) {
      try { google.script.run.doLogout(t); } catch (e) { /* abaikan */ }
    }
    document.getElementById('user-info').innerHTML = '';
    var sidebarUserInfo = document.getElementById('sidebar-user-info');
    if (sidebarUserInfo) sidebarUserInfo.innerHTML = '';
    var btnLogoutMobile = document.getElementById('btn-logout-mobile');
    if (btnLogoutMobile) btnLogoutMobile.style.display = 'none';
    document.getElementById('main-app').style.display = 'none';
    var bottomNav = document.getElementById('bottom-nav');
    if (bottomNav) bottomNav.style.display = 'none';
    document.getElementById('page-login').style.display = 'flex';
    document.getElementById('page-form').style.display = 'none';
    document.getElementById('page-dashboard').style.display = 'none';
    document.getElementById('page-dashboard-history').style.display = 'none';
    document.getElementById('page-master').style.display = 'none';
    document.getElementById('page-settings').style.display = 'none';
    document.getElementById('login_username').value = '';
    document.getElementById('login_password').value = '';
    var btn = document.getElementById('btn-login');
    btn.disabled = false;
    btn.innerText = 'Masuk';
  }

  function loadInitialData(uInfo) {
    document.getElementById('page-login').style.display = 'none';
    
    let btn = document.getElementById('btn-login');
    if(btn) btn.innerText = 'Memuat Data...';

    google.script.run
      .withFailureHandler(function(err) {
         console.error('SERVER FAILURE:', err && err.stack || err);
         var msg = err && err.message ? err.message : (err ? String(err) : 'unknown');
         showToast('Terjadi kesalahan server: ' + msg, 'error');
         logout();
      })
      .withSuccessHandler(function(data) {
        var isInvalidData = !data || typeof data !== 'object' || (Array.isArray && Array.isArray(data));
        if (data && data.error) {
           console.error('processInitialData error payload:', data);
           showToast('Error server: ' + data.error, 'error');
           logout();
           return;
        }
        if (isInvalidData) {
           console.error('processInitialData returned invalid data:', data);
           showToast('Data server tidak valid (respons null). Coba muat ulang atau hubungi admin.', 'error');
           logout();
           return;
        }

        document.getElementById('main-app').style.display = 'block';
        var bottomNav = document.getElementById('bottom-nav');
        if (bottomNav) bottomNav.style.display = 'flex';
        var btnLogoutMobile = document.getElementById('btn-logout-mobile');
        if (btnLogoutMobile) btnLogoutMobile.style.display = 'flex';

        userRole = data.role;
        let displayRole = userRole === 'PIC CABANG' ? 'Admin' : userRole;
        var userSummary = esc(data.user) + ' (' + displayRole + ' - ' + esc(data.cabang) + ')';
        document.getElementById('user-info').innerHTML = userSummary;
        var sidebarUserInfo = document.getElementById('sidebar-user-info');
        if (sidebarUserInfo) sidebarUserInfo.innerHTML = '<strong>' + esc(data.user) + '</strong><br><span class="text-muted" style="font-size: 0.85rem;">' + esc(displayRole) + ' &middot; ' + esc(data.cabang) + '</span>';

        if (userRole === 'SUPERADMIN' || userRole === 'PIC CABANG') {
          document.getElementById('nav-master').classList.remove('d-none');
          document.getElementById('btn-nav-master').style.display = 'flex';
          
          if (userRole !== 'SUPERADMIN') {
             // Sembunyikan tab cabang dan BBM dari DOM dengan CSS inject atau hide element
             let masterTabs = document.getElementById('master-tabs');
             if (masterTabs) {
                let btnCabang = masterTabs.querySelector('button[data-tab="cabang"]');
                if (btnCabang) btnCabang.parentElement.style.display = 'none';
                let btnBBM = masterTabs.querySelector('button[data-tab="bbm"]');
                if (btnBBM) btnBBM.parentElement.style.display = 'none';
let btnPengguna = masterTabs.querySelector('button[data-tab="pengguna"]');
              if (btnPengguna) btnPengguna.parentElement.style.display = 'none';
           }
         }
        }

        if (userRole === 'SUPERADMIN') {
          document.getElementById('nav-master').classList.remove('d-none');
          var settingsLink = document.querySelector('#nav-master a#tab-settings');
          if (settingsLink) settingsLink.classList.remove('d-none');
          document.getElementById('btn-nav-settings').style.display = 'flex';
          var inputCabangFilter = document.getElementById('input-cabang-filter');
          if (inputCabangFilter) inputCabangFilter.style.display = 'block';
          var wrapperFilterCabang = document.getElementById('wrapper-filter-cabang');
          if (wrapperFilterCabang) wrapperFilterCabang.style.display = 'block';
        }

        
        let roleAlert = document.getElementById('role-alert');
        if (userRole === 'SUPERADMIN') {
          if(roleAlert) {
             roleAlert.className = 'alert alert-warning text-center';
             roleAlert.innerHTML = '<small><i class="bi bi-shield-check me-1"></i> Anda login sebagai SUPERADMIN. Akses penuh ke seluruh warehouse.</small>';
          }
        } else {
          if(roleAlert) {
             let displayRole = userRole === 'PIC CABANG' ? 'Admin' : userRole;
             roleAlert.className = 'alert alert-info text-center';
             roleAlert.innerHTML = '<small><i class="bi bi-info-circle me-1"></i> Anda login sebagai ' + esc(displayRole) + '. Warehouse: ' + esc(data.cabang) + '</small>';
          }
        }

        let selectVeh = document.getElementById('vehicle');
        selectVeh.innerHTML = ''; 
        let defaultOptVeh = document.createElement('option');
        defaultOptVeh.value = '';
        defaultOptVeh.text = 'Pilih Kendaraan...';
        selectVeh.appendChild(defaultOptVeh);
        data.vehicles.forEach(v => {
          let opt = document.createElement('option');
          opt.value = v.vehicle_id;
          opt.setAttribute('data-indikator', (v.jenis_indikator || 'DIGITAL_BAR'));
          opt.text = v.plat_nomor + ' - ' + v.nama;
          selectVeh.appendChild(opt);
        });
        
        let selectSupir = document.getElementById('nama_supir');
        selectSupir.innerHTML = '';
        if (data.drivers) {
          data.drivers.forEach(d => {
            let opt = document.createElement('option');
            opt.value = d.nama;
            opt.text = d.nama; // Sembunyikan ID agar lebih rapi
            selectSupir.appendChild(opt);
          });
        }

        let selectCabang = document.getElementById('m_cabang');
        let selectCabangSupir = document.getElementById('m_cabang_supir');
        if (selectCabang) {
           selectCabang.innerHTML = '';
           if(selectCabangSupir) selectCabangSupir.innerHTML = '';
           
           var cabangFormOpts = cabangOptionsForRole(data.cabangList, data.cabang);
           cabangFormOpts.forEach(c => {
             let opt = document.createElement('option');
             opt.value = c.kode;
             opt.text = c.nama;
             selectCabang.appendChild(opt);
             
             if(selectCabangSupir) {
               let opt2 = document.createElement('option');
               opt2.value = c.kode;
               opt2.text = c.nama;
               selectCabangSupir.appendChild(opt2);
             }
           });
        }

        let selectBBM = document.getElementById('jenis_bbm');
        if (selectBBM) {
          function renderBBMOptions(list) {
            selectBBM.innerHTML = '<option value="">-- Pilih BBM --</option>';
            (list || []).forEach(function(b) {
               var opt = document.createElement('option');
               opt.value = b.harga_per_liter;
               opt.text = esc(b.jenis_bbm) + ' \u2014 Rp ' + Number(b.harga_per_liter).toLocaleString('id-ID') + '/L';
               opt.dataset.jenis = b.jenis_bbm;
               selectBBM.appendChild(opt);
            });
          }
          if (window.__bbmForCabang) {
            renderBBMOptions(window.__bbmForCabang);
          } else {
            selectBBM.innerHTML = '<option value="">-- Pilih BBM --</option>';
            google.script.run.withSuccessHandler(function(list) {
              window.__bbmForCabang = list || [];
              renderBBMOptions(window.__bbmForCabang);
            }).apiGetBBMForCabang(bbmToken());
          }
        }

        let selectFlazz = document.getElementById('flazz_card_id');
        if (selectFlazz && data.flazzCards) {
          selectFlazz.innerHTML = '<option value="">Pilih Kartu...</option>';
          data.flazzCards.forEach(f => {
             // Hanya kartu yang status SEDANG_DIGUNAKAN (Atau biarkan admin pilih yang mana saja tapi disarankan SEDANG_DIGUNAKAN, 
             // Untuk mempermudah, kita filter status SEDANG_DIGUNAKAN atau biarkan semua muncul jika role admin. Kita tampilkan semua aktif saja)
             if(f.status !== 'NONAKTIF') {
                let opt = document.createElement('option');
                opt.value = f.id;
                let driverName = f.driver_id ? ` [${f.driver_id}]` : '';
                opt.text = f.card_number + ' - ' + f.card_type + driverName;
                selectFlazz.appendChild(opt);
             }
          });
        }

        let selectFlazzTol = document.getElementById('flazz_card_id_toll');
        if (selectFlazzTol && data.flazzCards) {
          selectFlazzTol.innerHTML = '<option value="">Pilih Kartu...</option>';
          data.flazzCards.forEach(f => {
             if(f.status !== 'NONAKTIF') {
                let opt = document.createElement('option');
                opt.value = f.id;
                let driverName = f.driver_id ? ` [${f.driver_id}]` : '';
                opt.text = f.card_number + ' - ' + f.card_type + driverName;
                selectFlazzTol.appendChild(opt);
             }
          });
        }

        let filterCabang = document.getElementById('filter-cabang');
        if (filterCabang && data.cabangList) {
          filterCabang.innerHTML = '<option value="">Semua Warehouse</option>';
          data.cabangList.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c.nama;
            opt.text = c.nama;
            filterCabang.appendChild(opt);
          });
        }

        let inputCabang = document.getElementById('input-cabang');
        if (inputCabang && data.cabangList) {
          inputCabang.innerHTML = '<option value="">Semua Warehouse</option>';
          data.cabangList.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c.kode;
            opt.text = c.nama;
            inputCabang.appendChild(opt);
          });
        }

        allVehicles = data.vehicles || [];
        allDrivers = data.drivers || [];
        if (data.cabangList) window.masterData.cabang = data.cabangList;
        if (data.bbmList) window.masterData.bbm = data.bbmList;
        if (data.flazzCards) window.masterData.flazzCards = data.flazzCards;
populateSupirDatalist();
        refreshSupirFilter();

        loadAppSettings();
        switchTab('dashboard');
        prefillFormFromLast(uInfo);
      })
      .processInitialData(bbmToken());
  }

  function loadAppSettings() {
    google.script.run
      .withSuccessHandler(function(settings) {
        if (settings.logo_url) {
          var logoHtml = '<img src="' + escUrl(settings.logo_url) + '" alt="Logo" style="max-height: 100px; max-width: 200px;">';
          var loginLogo = document.getElementById('login-logo');
          if (loginLogo) loginLogo.innerHTML = logoHtml;
        }
        if (settings.app_name) {
          document.getElementById('login-app-name').innerText = settings.app_name;
          var brand = document.querySelector('.navbar-brand');
          if (brand) brand.innerText = settings.app_name;
        }
        if (settings.company_name) {
          document.getElementById('login-company-name').innerText = settings.company_name;
        }
        if (settings.footer_text !== undefined && settings.footer_text !== null) {
          var footer = document.getElementById('app-footer');
          var footerText = document.getElementById('app-footer-text');
          if (footer && footerText) {
            if (settings.footer_text !== '') {
              footerText.innerText = settings.footer_text;
              footer.style.display = 'block';
            }
          }
          var loginFooter = document.getElementById('login-footer');
          if (loginFooter) {
            if (settings.footer_text !== '') {
              loginFooter.innerText = settings.footer_text;
            } else {
              var companyText = settings.company_name
                ? '© ' + new Date().getFullYear() + ' ' + settings.company_name
                : '';
              if (companyText) loginFooter.innerText = companyText;
            }
          }
        }
      })
      .withFailureHandler(function(err) {
        showToast('Gagal memuat pengaturan aplikasi: ' + (err && err.message ? err.message : 'terjadi kesalahan'), 'error');
      })
      .getAppSettings(bbmToken());
  }

  // Accordion navigasi sidebar & bottom-nav: tutup semua grup lain lalu toggle grup yang diklik (auto-hide).
  function toggleNavMenu(groupId) {
    var target = document.getElementById(groupId);
    if (!target) return;
    var wasOpen = target.classList.contains('open');
    document.querySelectorAll('.menu-group.open').forEach(function(g) { g.classList.remove('open'); });
    if (!wasOpen) target.classList.add('open');
  }

  // Sub-menu mobile (drawer di atas bottom-nav). Memakai data-tab yang sama dengan switchTab.
  var BOTTOM_NAV_DRAWERS = {
    jalur: [
      { tab: 'jalur-buat', label: 'Buat Jalur', icon: 'bi-calendar-plus' },
      { tab: 'jalur-listing', label: 'Daftar Jalur', icon: 'bi-list-ul' },
      { tab: 'jalur-summary', label: 'Summary Pengiriman', icon: 'bi-clipboard-data' }
    ],
    operasional: [
      { tab: 'form', label: 'Input Laporan', icon: 'bi-pencil-square' },
      { tab: 'performa', label: 'Performa Kendaraan', icon: 'bi-speedometer2' }
    ],
    history: [
      { tab: 'history', label: 'History Laporan', icon: 'bi-clock-history' },
      { tab: 'gallery', label: 'Galeri Foto', icon: 'bi-images' }
    ],
    flazz: [
      { tab: 'flazz-topup', label: 'Top Up Flazz', icon: 'bi-wallet2' },
      { tab: 'flazz-recon', label: 'Rekonsiliasi Flazz', icon: 'bi-check2-all' },
      { tab: 'flazz-listing', label: 'List Flazz & Saldo', icon: 'bi-credit-card' },
      { tab: 'flazz-history', label: 'Riwayat Transaksi', icon: 'bi-journal-text' }
    ]
  };

  function drawBottomNav(key) {
    var drawer = document.getElementById('bottom-nav-drawer');
    if (!drawer) return;
    var items = BOTTOM_NAV_DRAWERS[key] || [];
    drawer.innerHTML = items.map(function(it) {
      return "<button class='btn-nav bnd-item' data-tab='" + it.tab + "' onclick='switchTab(\"" + it.tab + "\")'>" +
        "<i class='bi " + it.icon + "'></i><span>" + it.label + '</span></button>';
    }).join('');
  }

  function toggleBottomDrawer(key) {
    var wrap = document.getElementById('bottom-nav-drawer-wrap');
    if (!wrap) return;
    var isOpen = wrap.style.display === 'block' && (wrap.dataset.key || '') === key;
    closeBottomDrawer();
    if (isOpen) return;
    drawBottomNav(key);
    wrap.style.display = 'block';
    wrap.dataset.key = key;
  }

  function closeBottomDrawer() {
    var wrap = document.getElementById('bottom-nav-drawer-wrap');
    if (!wrap) return;
    wrap.style.display = 'none';
    wrap.dataset.key = '';
  }

  // ===== Infrastruktur filter SUPERADMIN =====
  // Token request-id per area agar respons lama tidak menimpa yang baru (race-condition).
  var __flazzRequestId = 0;
  var __jalurRequestId = 0;
  var __masterRequestId = 0;

  // Opsi cabang untuk form tambah/edit master (kendaraan/supir).
  // SUPERADMIN melihat semua cabang; non-superadmin hanya cabang miliknya.
  // Fallback: jika kode cabang user tidak ada di daftar, tetap tampilkan satu opsi
  // agar form tetap bisa dipakai meski data cabang belum konsisten.
  function cabangOptionsForRole(list, userCabang) {
    if (userRole === 'SUPERADMIN') return list || [];
    var mine = String(userCabang || '');
    var mineOpts = (list || []).filter(function(c) { return String(c.kode) === mine; });
    if (mineOpts.length) return mineOpts;
    return [{ kode: mine, nama: mine }];
  }

  // Isi <select> warehouse dari masterData.cabang (getCabangList), tanpa hardcode.
  function fillCabangSelect(sel) {
    if (!sel) return;
    var cur = sel.value;
    sel.innerHTML = '<option value="">Semua Warehouse</option>';
    ((window.masterData && window.masterData.cabang) || []).forEach(function(c) {
      var o = document.createElement('option');
      o.value = c.kode;
      o.text = c.nama;
      sel.appendChild(o);
    });
    if (cur) sel.value = cur;
  }

  function populateMasterFilter() {
    var wrap = document.getElementById('master-filter-cabang-wrap');
    if (!wrap) return;
    if (userRole === 'SUPERADMIN') {
      wrap.style.display = '';
      fillCabangSelect(document.getElementById('master-filter-cabang'));
    } else {
      wrap.style.display = 'none';
    }
  }

  function onMasterFilterChange() {
    var tab = __activeMasterTab || 'kendaraan';
    if (tab === 'flazz') {
      var sel = document.getElementById('master-filter-cabang');
      __flazzFilterCabang = sel ? sel.value : '';
      if (typeof flazzDataCache !== 'undefined') flazzDataCache = null;
      if (typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper(true);
      return;
    }
    loadMasterData(tab);
  }

  var __activeMasterTab = 'kendaraan';

  function switchTab(tab) {
    closeBottomDrawer();
    document.getElementById('page-form').style.display = 'none';
    document.getElementById('page-dashboard').style.display = 'none';
    document.getElementById('page-dashboard-history').style.display = 'none';
    document.getElementById('page-performa').style.display = 'none';
    document.getElementById('page-gallery').style.display = 'none';
    document.getElementById('page-master').style.display = 'none';
    document.getElementById('page-settings').style.display = 'none';
    
    let flazzPages = ['dashboard', 'master', 'usage', 'topup', 'tol', 'recon', 'history', 'listing'];
    flazzPages.forEach(p => {
       let el = document.getElementById('page-flazz-' + p);
       if(el) el.style.display = 'none';
    });

    let jalurPages = ['buat', 'listing', 'summary'];
    jalurPages.forEach(p => {
       let el = document.getElementById('page-jalur-' + p);
       if(el) el.style.display = 'none';
    });
    
    let sharedFilter = document.getElementById('shared-filter-card');
    if(sharedFilter) sharedFilter.style.display = (tab === 'history' || tab === 'gallery') ? 'block' : 'none';
    
    if (tab === 'form') {
      document.getElementById('page-form').style.display = 'block';
    } else if (tab === 'dashboard') {
      document.getElementById('page-dashboard').style.display = 'block';
      renderDashboard();
    } else if (tab === 'history') {
      document.getElementById('page-dashboard-history').style.display = 'block';
      loadDashboard();
    } else if (tab === 'performa') {
      document.getElementById('page-performa').style.display = 'block';
      loadPerforma();
    } else if (tab === 'gallery') {
      document.getElementById('page-gallery').style.display = 'block';
      loadDashboard(); // Gunakan data yang sama
    } else if (tab === 'master') {
      document.getElementById('page-master').style.display = 'block';
      loadMasterData();
    } else if (tab === 'settings') {
      document.getElementById('page-settings').style.display = 'block';
      if (typeof loadSettings === 'function') loadSettings();
    } else if (tab === 'flazz-listing') {
      document.getElementById('page-flazz-listing').style.display = 'block';
      if (typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper();
      if (typeof renderFlazzListing === 'function') renderFlazzListing();
    } else if (tab.startsWith('flazz-')) {
      let flazzTab = tab.substring(6);
      let pageEl = document.getElementById('page-flazz-' + flazzTab);
      if(pageEl) pageEl.style.display = 'block';
      if(typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper();
    } else if (tab === 'jalur-buat') {
      document.getElementById('page-jalur-buat').style.display = 'block';
      if (typeof jalurInitForm === 'function') jalurInitForm();
    } else if (tab === 'jalur-listing') {
      document.getElementById('page-jalur-listing').style.display = 'block';
      let t = document.getElementById('jalur-listing-filter-tanggal');
      if (t && !t.value) t.value = new Date().toISOString().slice(0, 10);
      if (typeof jalurShowListing === 'function') jalurShowListing();
    } else if (tab === 'jalur-summary') {
      document.getElementById('page-jalur-summary').style.display = 'block';
      let t = document.getElementById('jalur-filter-tanggal');
      if (t && !t.value) t.value = new Date().toISOString().slice(0, 10);
      if (typeof jalurShowSummary === 'function') jalurShowSummary();
    }
    
    document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.btn-nav').forEach(el => el.classList.remove('active'));

  function getBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) { resolve(null); return; }
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  function compressImageFile(file, maxDim, quality, cb) {
    if (!file || !/^image\/(jpeg|png|webp)$/i.test(file.type)) { cb(file ? file : null); return; }
    var reader = new FileReader();
    reader.onload = function(ev) {
      var img = new Image();
      img.onload = function() {
        var scale = 1;
        if (img.width > maxDim || img.height > maxDim) {
          scale = Math.min(maxDim / img.width, maxDim / img.height);
        }
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        try {
          var type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          var dataUrl = canvas.toDataURL(type, quality);
          cb({ dataUrl: dataUrl, name: file.name, size: dataUrl.length });
        } catch (err) {
          cb(null);
        }
      };
      img.onerror = function() { cb(null); };
      img.src = ev.target.result;
    };
    reader.onerror = function() { cb(null); };
    reader.readAsDataURL(file);
  }

  function compressPhoto(file) {
    return new Promise(function(resolve) {
      if (!file) { resolve(null); return; }
      compressImageFile(file, 1280, 0.7, function(c) {
        if (c && c.dataUrl) { resolve(c); return; }
        if (c) {
          getBase64(c).then(function(dataUrl) {
            resolve({ dataUrl: dataUrl, name: c.name });
          }).catch(function() { resolve(null); });
          return;
        }
        resolve(null);
      });
    });
  }

    let flazz_card_id_toll = document.getElementById('flazz_card_id_toll') ? document.getElementById('flazz_card_id_toll').value : '';
    let biaya_tollSubmit = document.getElementById('biaya_toll') ? (parseFloat(document.getElementById('biaya_toll').value) || 0) : 0;

       showToast('Harap pilih Kartu Flazz jika metode pembayaran menggunakan Flazz.', 'error');

       return;

      btn.innerHTML = originalText;
      window.__bbmSubmitting = false;
      showToast('Proses melebihi 2 menit. Muat ulang halaman atau cek spreadsheet agar data tidak ganda.', 'error');
    }, 120000);
    function finalizeSaving() {
      saveTokens.done = true;
      window.__bbmSubmitting = false;
      clearTimeout(wdTimer1);
      clearTimeout(wdTimer2);
    }

    try {
      let bbmSelect = document.getElementById('jenis_bbm');
      let bbmNama = '';
      if(bbmSelect && bbmSelect.selectedIndex > 0) {
        bbmNama = bbmSelect.options[bbmSelect.selectedIndex].dataset.jenis;

      if (vehSelSubmit && vehSelSubmit.selectedOptions && vehSelSubmit.selectedOptions[0]) {
        indikatorSubmit = vehSelSubmit.selectedOptions[0].getAttribute('data-indikator') || indikatorSubmit;

        if (foundVeh && foundVeh.jenis_indikator) indikatorSubmit = foundVeh.jenis_indikator;
      }
      var isJarumSubmit = indikatorSubmit === 'ANALOG_JARUM';
      var kmTanpaEstimasi = false;
      var chkAwalBroken = document.getElementById('chk_km_awal') ? document.getElementById('chk_km_awal').checked : false;
      var chkAkhirBroken = document.getElementById('chk_km_akhir') ? document.getElementById('chk_km_akhir').checked : false;

        // Skala level: jarum = persen (0-100), digital = jumlah_bar
        var skalaLevelSubmit = isJarumSubmit ? 100 : jbSubmit;
        var litPerBarSubmit = (kapSubmit > 0 && skalaLevelSubmit > 0) ? (kapSubmit / skalaLevelSubmit) : 0;
        var bAwalSubmit = parseFloat(document.getElementById('bar_awal').value) || 0;
        var bAkhirSubmit = parseFloat(document.getElementById('bar_akhir').value) || 0;

        km_tanpa_estimasi: kmTanpaEstimasi

      google.script.run
        .withSuccessHandler(function(res) {
           if(res.success) {
               formDataPayload.serverData = res;

    var res = __warnCache || { pajakKIR: [], saldo: [] };

  function warnPajakItems(pajak) {
    if (!pajak.length) return '<div class="text-muted small py-2">Semua aman - tidak ada kendaraan yang pajak/KIR-nya kritis.</div>';
    var html = '';
    pajak.forEach(function(r) {
      var cab = userRole === 'SUPERADMIN' ? ' <span class="badge text-bg-light border">' + esc(r.cabang) + '</span>' : '';
      var alerts = r.alerts.map(function(a) {
        var label = a.tipe === 'PAJAK' ? 'Pajak' : (a.tipe === 'PAJAK5' ? 'Pajak 5th' : 'KIR');
        var sisa = (a.sisa_hari != null && a.sisa_hari !== Infinity) ? (' | sisa ' + a.sisa_hari + ' hari') : '';
        var tgl = a.tanggal ? (' | ' + esc(a.tanggal)) : '';
        return '<div>' + warnBadge(a.status) + ' ' + label + sisa + tgl + '</div>';
      }).join('');
      html += '<a href="#" onclick="switchTab(\'jalur-listing\'); return false;" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">' +
        '<div><div class="fw-bold">' + esc(r.plat_nomor) + ' - ' + esc(r.nama_kendaraan) + cab + '</div>' +
        '<div class="small text-muted">' + alerts + '</div></div>' +
        '<i class="bi bi-chevron-right text-muted"></i></a>';
    });
    return html;
  }

  function loadDashboard() {
    let tbody = document.getElementById('dashboard-tbody');
    let cardsContainer = document.getElementById('dashboard-cards');
    let emptyState = document.getElementById('dashboard-empty');
    let loadingState = document.getElementById('dashboard-loading');
    
    let galleryContent = document.getElementById('gallery-content');
    let galleryEmpty = document.getElementById('gallery-empty');
    let galleryLoading = document.getElementById('gallery-loading');
    
    let filterCabang = document.getElementById('filter-cabang') ? document.getElementById('filter-cabang').value : '';
    let filterSupir = document.getElementById('filter-supir') ? document.getElementById('filter-supir').value : '';
    let filterDateStart = document.getElementById('filter-date-start') ? document.getElementById('filter-date-start').value : '';
    let filterDateEnd = document.getElementById('filter-date-end') ? document.getElementById('filter-date-end').value : '';
    
    let startTimestamp = filterDateStart ? new Date(filterDateStart + 'T00:00:00').getTime() : null;
    let endTimestamp = filterDateEnd ? new Date(filterDateEnd + 'T23:59:59').getTime() : null;

    tbody.innerHTML = '';
    cardsContainer.innerHTML = '';
    emptyState.style.display = 'none';
    loadingState.style.display = 'block';
    
    if(galleryContent) galleryContent.innerHTML = '';
    if(galleryEmpty) galleryEmpty.style.display = 'none';
    if(galleryLoading) galleryLoading.style.display = 'block';

    function applyDash(allData, res) {
      loadingState.style.display = 'none';
      if(galleryLoading) galleryLoading.style.display = 'none';
      let data = allData.filter(function(row) {
        if (filterCabang && row.cabang !== filterCabang) return false;
        if (filterSupir && row.supir !== filterSupir) return false;
        if (startTimestamp && row.timestamp < startTimestamp) return false;
        if (endTimestamp && row.timestamp > endTimestamp) return false;
        return true;
      });
      window.__recent = data;
      window.__dashData = data;
      window.__dashPage = 1;
      renderMonthlySummary((res && res.monthly) || []);
      renderDashboardData();
    }

    if (__dashCache && !window.__dashForce) {
      applyDash((__dashCache && __dashCache.transactions) || [], __dashCache);
      window.__dashForce = false;
      return;
    }

    google.script.run
      .withSuccessHandler(function(res) {
        __dashCache = res;
        window.__dashForce = false;
        applyDash((res && res.transactions) ? res.transactions : [], res);
      })
      .withFailureHandler(function(err) {
        loadingState.style.display = 'none';
        showToast('Gagal memuat dashboard: ' + err.message, 'error');
      })
      .getDashboardData(bbmToken());
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escUrl(v) {
    var s = esc(v);
    if (/^(https:\/\/drive\.google\.com|https:\/\/lh3\.googleusercontent\.com|data:image\/)/.test(s)) return s;
    if (/^https:\/\//.test(s)) return s;
    return '';
  }

  function editDaily(id) {
    if (userRole !== 'SUPERADMIN') { showToast('Akses ditolak: hanya SUPERADMIN.', 'error'); return; }
    let row = (window.__recent || []).find(r => String(r.transaction_id) === String(id));
    if(!row) return showToast('Data tidak ditemukan', 'error');
    document.getElementById('ed_trx').value = row.transaction_id;
    let edTgl = document.getElementById('ed_tanggal');
    if (edTgl) {
      let d = row.timestamp ? new Date(row.timestamp) : null;
      if (d && !isNaN(d.getTime())) {
        edTgl.value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      } else {
        edTgl.value = '';
      }
    }
    document.getElementById('ed_nama_supir').value = row.supir || '';
    document.getElementById('ed_km_awal').value = row.km_awal || '';
    document.getElementById('ed_km_akhir').value = row.km_akhir || '';
    document.getElementById('ed_biaya').value = row.biaya_bbm || '';
    document.getElementById('ed_liter').value = row.isi_bbm || '';
    let edToll = document.getElementById('ed_biaya_toll');
    if (edToll) edToll.value = (row.toll !== undefined && row.toll !== null) ? row.toll : '';

    let jenisSel = document.getElementById('ed_jenis_bbm');
    if(jenisSel){
      let bbms = (window.__bbmForCabang || (window.masterData && window.masterData.bbm) || []);
      jenisSel.innerHTML = '<option value="">-- Pilih BBM --</option>' + bbms.map(function(b) {
        var harga = b.harga_per_liter !== undefined ? b.harga_per_liter : b.harga;
        var jenis = b.jenis_bbm || b.jenis || '';
        return '<option value="' + harga + '">' + esc(jenis) + ' \u2014 Rp ' + Number(harga).toLocaleString('id-ID') + '/L</option>';
      }).join('');
      if (bbms.length && row.biaya_bbm) jenisSel.value = String(bbms[0].harga_per_liter !== undefined ? bbms[0].harga_per_liter : bbms[0].harga);
      calcEditLiter();
    }

    let metode = document.getElementById('ed_metode');
    if(metode){
      metode.value = row.metode_pembayaran || 'TUNAI';
      toggleEditFlazz();
    }
    let flazz = document.getElementById('ed_flazz_card_id');
    if(flazz){
      let cards = (window.masterData && window.masterData.flazzCards) ? window.masterData.flazzCards : [];
      flazz.innerHTML = '<option value="">-- Pilih Kartu --</option>' + cards.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.card_number) + (c.driver_id ? ' [' + esc(c.driver_id) + ']' : '') + '</option>').join('');
      flazz.value = row.flazz_card_id || '';
      // Autofill kartu dari supir bila transaksi ini ber-Flazz dan kartu belum terpilih
      if (metode && metode.value === 'FLAZZ' && !flazz.value) {
        autofillEditFlazzByDriver();
      }
    }
    let flazzTol = document.getElementById('ed_flazz_card_id_toll');
    if(flazzTol){
      let cardsTol = (window.masterData && window.masterData.flazzCards) ? window.masterData.flazzCards : [];
      flazzTol.innerHTML = '<option value="">-- Pilih Kartu --</option>' + cardsTol.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.card_number) + (c.driver_id ? ' [' + esc(c.driver_id) + ']' : '') + '</option>').join('');
      flazzTol.value = row.flazz_card_id_toll || '';
      if (metode && metode.value === 'FLAZZ' && !flazzTol.value) {
        flazzTol.value = flazz ? flazz.value : '';
      }
    }
    let metodeTol = document.getElementById('ed_metode_toll');
    if(metodeTol){
      metodeTol.value = row.metode_toll || 'TUNAI';
      toggleEditTolFlazzCard();
    }
    var pA = document.getElementById('ed_preview_odo_awal');
    if (pA) {
      if (row.foto_odo_awal) { pA.src = row.foto_odo_awal_thumb || row.foto_odo_awal; pA.style.display = 'block'; }
      else { pA.src = ''; pA.style.display = 'none'; }
      var fA = document.getElementById('ed_foto_odo_awal');
      if (fA) fA.value = '';
    }
    var pK = document.getElementById('ed_preview_odo_akhir');
    if (pK) {
      if (row.foto_odo_akhir) { pK.src = row.foto_odo_akhir_thumb || row.foto_odo_akhir; pK.style.display = 'block'; }
      else { pK.src = ''; pK.style.display = 'none'; }
      var fK = document.getElementById('ed_foto_odo_akhir');
      if (fK) fK.value = '';
    }
    new bootstrap.Modal(document.getElementById('modal-edit-daily')).show();
  }
  // Autofill kartu Flazz berdasarkan nama supir (kartu terikat pada supir / driver_id)
  function autofillEditFlazzByDriver() {
    let supir = document.getElementById('ed_nama_supir').value;
    let flazz = document.getElementById('ed_flazz_card_id');
    let metode = document.getElementById('ed_metode');
    if (!flazz || !supir) return;
    if (metode && metode.value !== 'FLAZZ') return;
    let cards = (window.masterData && window.masterData.flazzCards) ? window.masterData.flazzCards : [];
    let match = cards.find(c => String(c.driver_id) === String(supir) && String(c.status) !== 'NONAKTIF');
    if (match && !flazz.value) {
      flazz.value = match.id;
    }
  }
  function toggleEditFlazz(){
    let m = document.getElementById('ed_metode').value;
    let f = document.getElementById('ed_flazz_row');
    if(f) f.style.display = (m === 'FLAZZ') ? 'block' : 'none';
    if (m === 'FLAZZ') autofillEditFlazzByDriver();
  }
  function toggleEditTolFlazzCard(){
    let mt = document.getElementById('ed_metode_toll');
    let tr = document.getElementById('ed_tol_flazz_row');
    if (!mt || !tr) return;
    tr.style.display = (mt.value === 'FLAZZ') ? 'block' : 'none';
  }
  async function saveEditDaily(e){
    e.preventDefault();
    let payload = {
      transaction_id: document.getElementById('ed_trx').value,
      tanggal: document.getElementById('ed_tanggal') ? document.getElementById('ed_tanggal').value : '',
      nama_supir: document.getElementById('ed_nama_supir').value,
      km_awal: document.getElementById('ed_km_awal').value,
      km_akhir: document.getElementById('ed_km_akhir').value,
      biaya_bbm: document.getElementById('ed_biaya').value,
      biaya_toll: document.getElementById('ed_biaya_toll') ? document.getElementById('ed_biaya_toll').value : 0,
      liter_bbm: document.getElementById('ed_liter').value,
      metode_pembayaran: ((parseFloat(document.getElementById('ed_biaya').value) || 0) > 0 || document.getElementById('ed_metode').value === 'FLAZZ') ? document.getElementById('ed_metode').value : '',
      flazz_card_id: document.getElementById('ed_metode').value === 'FLAZZ' ? document.getElementById('ed_flazz_card_id').value : '',
      metode_toll: document.getElementById('ed_metode_toll') ? document.getElementById('ed_metode_toll').value : 'TUNAI',
      flazz_card_id_toll: (document.getElementById('ed_metode_toll') && document.getElementById('ed_metode_toll').value === 'FLAZZ') ? (document.getElementById('ed_flazz_card_id_toll') ? document.getElementById('ed_flazz_card_id_toll').value : '') : ''
    };
    let fAwal = document.getElementById('ed_foto_odo_awal');
    if (fAwal && fAwal.files && fAwal.files[0]) {
      let fAwalC = await compressPhoto(fAwal.files[0]);
      if (!fAwalC) { showToast('Gagal mengompresi foto KM awal, coba foto lain.', 'error'); return; }
      payload.foto_odo_awal = fAwalC.dataUrl;
      payload.foto_odo_awal_name = fAwalC.name;
    }
    let fAkhir = document.getElementById('ed_foto_odo_akhir');
    if (fAkhir && fAkhir.files && fAkhir.files[0]) {
      let fAkhirC = await compressPhoto(fAkhir.files[0]);
      if (!fAkhirC) { showToast('Gagal mengompresi foto KM akhir, coba foto lain.', 'error'); return; }
      payload.foto_odo_akhir = fAkhirC.dataUrl;
      payload.foto_odo_akhir_name = fAkhirC.name;
    }
    let btnEdit = document.getElementById('btn-save-edit');
    let editOrig = btnEdit.innerHTML;
    btnEdit.dataset.origHtml = editOrig;
    btnEdit.disabled = true;
    btnEdit.innerHTML = "<span class='spinner-border spinner-border-sm'></span> Memproses...";
    google.script.run.withSuccessHandler(res => {
      if(res.success){ 
         showToast(res.msg, 'success'); 
         bootstrap.Modal.getInstance(document.getElementById('modal-edit-daily')).hide(); 
         if (typeof flazzDataCache !== 'undefined') flazzDataCache = null; // Flush cache
         window.__dashForce = true;
         window.__perfForce = true;
         loadDashboard();
         if (typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper(true);
      }
      else {
        btnEdit.disabled = false;
        btnEdit.innerHTML = (btnEdit.dataset && btnEdit.dataset.origHtml) || editOrig;
        showToast(res.msg, 'error');
      }
    }).withFailureHandler(err => {
      btnEdit.disabled = false;
      btnEdit.innerHTML = (btnEdit.dataset && btnEdit.dataset.origHtml) || editOrig;
      showToast('Gagal: ' + err.message, 'error');
    }).apiEditDailyTransaction(payload, bbmToken());
  }
  function deleteDaily(id){
    if (userRole !== 'SUPERADMIN') { showToast('Akses ditolak: hanya SUPERADMIN.', 'error'); return; }
    showConfirmModal({ message: 'Yakin menghapus transaksi BBM ini? Jika ber-Flazz, saldo kartu akan dikembalikan.' }, function() {
    google.script.run.withSuccessHandler(res => {
      if(res.success){ 
         showToast(res.msg, 'success'); 
         if (typeof flazzDataCache !== 'undefined') flazzDataCache = null; // Flush cache
         window.__dashForce = true;
         window.__perfForce = true;
         loadDashboard();
         if (typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper(true);
      }
      else showToast(res.msg, 'error');
    }).apiDeleteDailyTransaction(id, bbmToken());
    });
  }

  function formatCurrency(value) {
    if (!value || value === '0') return 'Rp 0';
    return 'Rp ' + parseInt(value).toLocaleString('id-ID');
  }

  function efisiensiBadge(status) {
    if (!status) return '';
    let warna = 'success';
    if (status === 'Di bawah standar') warna = 'danger';
    else if (status === 'Di atas standar') warna = 'info';
    else if (status === 'Data Belum Cukup') warna = 'secondary';
    return " <span class='badge bg-" + warna + "'>" + esc(status) + "</span>";
  }

  function escapeAttr(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/'/g, '&#39;')
      .replace(/"/g, '&quot;');
  }

  function odoWarningBadgeHtml(warning) {
    if (!warning) return '';
    return " <span class='badge bg-warning text-dark ms-1' style='cursor:help;' title='" + escapeAttr(warning) + "'><i class='bi bi-exclamation-triangle me-1'></i>Ada selisih KM</span>";
  }

  function odoWarningStripHtml(warning) {
    if (!warning) return '';
    return "<div class='text-warning small mb-2' style='cursor:help;' title='" + escapeAttr(warning) + "'><i class='bi bi-exclamation-triangle me-1'></i>Ada selisih KM awal & KM akhir sebelumnya</div>";
  }

  function fotoThumbHtml(url, thumb, label) {
    if (!url) return "<span class='text-muted small'>-</span>";
    const inner = thumb
      ? "<img src='" + escUrl(thumb) + "' alt='" + esc(label) + "' loading='lazy' width='64' height='48' class='rounded border' style='object-fit:cover'>"
      : "<span class='badge bg-secondary'>" + esc(label) + "</span>";
    return "<a href='" + escUrl(url) + "' target='_blank' title='Lihat " + esc(label) + "'>" + inner + "</a>";
  }

    if(document.getElementById('filter-cabang')) document.getElementById('filter-cabang').value = '';
    if(document.getElementById('filter-supir')) document.getElementById('filter-supir').value = '';
    if(document.getElementById('filter-date-start')) document.getElementById('filter-date-start').value = '';

    refreshSupirFilter();

  // Filter supir di history/gallery mengikuti cabang yang dipilih (nama -> kode).
  function refreshSupirFilter() {
    var fSel = document.getElementById('filter-supir');
    if (!fSel) return;
    var prev = fSel.value;
    var cabNama = document.getElementById('filter-cabang') ? document.getElementById('filter-cabang').value : '';
    var cabKode = '';
    if (cabNama && window.masterData && window.masterData.cabang) {
      var hit = window.masterData.cabang.find(function(c) { return String(c.nama) === String(cabNama); });
      if (hit) cabKode = String(hit.kode);
    }
    fSel.innerHTML = '<option value="">Semua Supir</option>';
    (allDrivers || []).forEach(function(d) {
      if (cabKode && String(d.cabang) !== cabKode) return;
      var o = document.createElement('option');
      o.value = d.nama;
      o.text = d.nama;
      fSel.appendChild(o);
    });
    if (prev && Array.prototype.some.call(fSel.options, function(o) { return String(o.value) === String(prev); })) {
      fSel.value = prev;
    }
  }

  function onCabangFilterChange() {
    refreshSupirFilter();
    loadDashboard();
  }


  function populateSupirDatalist() {
    var dl = document.getElementById('supir-datalist');
    if (!dl) return;
    var src = (typeof allDrivers !== 'undefined' && allDrivers.length) ? allDrivers : ((window.masterData && window.masterData.supir) || []);
    var cabang = document.getElementById('input-cabang') ? document.getElementById('input-cabang').value : '';
    dl.innerHTML = '';
    src.forEach(function (d) {
      if (cabang && d.cabang !== cabang) return;
      var o = document.createElement('option');
      o.value = d.nama;
      dl.appendChild(o);
    });
  }

  function getSupirSelectedName() {
    return document.getElementById('nama_supir') ? document.getElementById('nama_supir').value : '';
  }

  function getSupirFromName(name) {
    var src = (typeof allDrivers !== 'undefined' && allDrivers.length) ? allDrivers : ((window.masterData && window.masterData.supir) || []);
    var cabang = document.getElementById('input-cabang') ? document.getElementById('input-cabang').value : '';
    return src.find(function (d) { 
      if (cabang && d.cabang !== cabang) return false;
      return d.nama === name; 
    });
  }

  function applySupirAutofill() {
    var name = getSupirSelectedName().trim();
    var vehSel = document.getElementById('vehicle');
    var d = getSupirFromName(name);
    if (vehSel) vehSel.value = (d && d.default_vehicle_id) ? d.default_vehicle_id : '';
    onVehicleChange();

  // Sembunyikan field Bar Bensin Awal/Akhir untuk kendaraan berindikator bukan
  // Digital Bar (mis. jarum/analog, tanpa indikator, digital angka). Bar hanya
  // relevan untuk indikator Digital Bar yang bisa dihitung per segmen.
  function toggleOdoBroken(side) {
    var chk = document.getElementById('chk_km_' + side);
    var inp = document.getElementById('km_' + side + '_val');
    var group = document.getElementById('odometer-rusak-' + side);
    if (!chk || !inp) return;
    inp.required = !chk.checked;
    if (group) group.classList.toggle('border-warning', chk.checked);
  }

  function onVehicleChange() {
    var vehSel = document.getElementById('vehicle');
    var indikator = 'DIGITAL_BAR';
    var found = null;
    if (vehSel && vehSel.selectedOptions && vehSel.selectedOptions[0]) {
      indikator = vehSel.selectedOptions[0].getAttribute('data-indikator') || indikator;
    }
    if (vehSel && vehSel.value && indikator === 'DIGITAL_BAR') {
      found = (allVehicles || []).find(function (v) { return v.vehicle_id === vehSel.value; }) || null;
      if (found && found.jenis_indikator) indikator = found.jenis_indikator;
    }
    var hide = indikator !== 'DIGITAL_BAR' && indikator !== 'ANALOG_JARUM';
    var isJarum = indikator === 'ANALOG_JARUM';
    ['odometer-rusak-awal', 'odometer-rusak-akhir'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.style.display = isJarum ? '' : 'none';
    });
    if (!isJarum) {
      ['chk_km_awal', 'chk_km_akhir'].forEach(function (id) {
        var c = document.getElementById(id);
        if (c) c.checked = false;
      });
      toggleOdoBroken('awal');
      toggleOdoBroken('akhir');
    }

    var bAwal = document.getElementById('bar_awal');
    var bAkhir = document.getElementById('bar_akhir');
    var jumlahBar = (found && found.jumlah_bar) ? parseInt(found.jumlah_bar, 10) : 0;
    if (bAwal) bAwal.max = jumlahBar > 0 ? jumlahBar : '';
    if (bAkhir) bAkhir.max = jumlahBar > 0 ? jumlahBar : '';

    var gAwal = document.getElementById('bar-awal-group');
    var gAkhir = document.getElementById('bar-akhir-group');
    if (gAwal) gAwal.style.display = hide ? 'none' : '';
    if (gAkhir) gAkhir.style.display = hide ? 'none' : '';

    if (bAwal) bAwal.required = !hide;
    if (bAkhir) bAkhir.required = !hide;
    var kmA = document.getElementById('km_awal_val');
    var kmK = document.getElementById('km_akhir_val');
    if (kmA) kmA.required = !hide;
    if (kmK) kmK.required = !hide;
    if (hide) {
      if (bAwal) bAwal.value = '';
      if (bAkhir) bAkhir.value = '';
      if (kmA) kmA.value = '';
      if (kmK) kmK.value = '';
    }

    // Untuk indikator jarum: field angka disembunyikan, diganti slider level 0-100%.
    ['awal', 'akhir'].forEach(function (side) {
      var barField = document.getElementById('bar_' + side);
      var sliderWrap = document.getElementById('level-slider-jarum-' + side);
      var slider = document.getElementById('bar_' + side + '_slider');
      var lab = document.getElementById('label-bar-' + side);
      var hint = document.getElementById('hint-bar-' + side);
      if (!isJarum) {
        if (sliderWrap) sliderWrap.style.display = 'none';
        if (slider) slider.value = '0';
        var valElSide = document.getElementById('bar_' + side + '_slider_val');
        if (valElSide) valElSide.textContent = '0%';
        if (barField) {
          barField.style.display = '';
          if (barField && barField.parentNode) barField.parentNode.style.display = '';
        }
        if (lab) lab.textContent = side === 'awal' ? 'Bar Bensin Awal' : 'Bar Bensin Akhir';
        if (hint) hint.textContent = '*Hitung bar/jarak indikator bahan bakar digital. Tidak berlaku untuk indikator jarum.';
        return;
      }
      // isJarum
      if (sliderWrap) sliderWrap.style.display = '';
      if (barField && barField.parentNode) barField.parentNode.style.display = 'none';
      if (barField) {
        var cur = parseFloat(barField.value);
        if (!isNaN(cur) && slider && slider.value === '0') {
          slider.value = cur > 100 ? 100 : cur;
        }
        levelSlider(side, slider ? slider.value : '0');
      } else if (slider) {
        levelSlider(side, slider.value);
      }
      if (lab) lab.textContent = side === 'awal' ? 'Level Bensin (Berangkat)' : 'Level Bensin (Pulang)';
      if (hint) hint.textContent = '*Geser sesuai posisi jarum: 0 = E/kosong, 100 = F/penuh (berlaku utk indikator jarum).';
    });
  }

  // Sinkronisasi slider level BBM jarum ke field bar_* (0-100) & tampilan persen.
  function levelSlider(side, val) {
    var v = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
    var slider = document.getElementById('bar_' + side + '_slider');
    var valEl = document.getElementById('bar_' + side + '_slider_val');
    var barField = document.getElementById('bar_' + side);
    if (slider) slider.value = v;
    if (valEl) valEl.textContent = v + '%';
    if (barField) barField.value = v;
  }

  function calcLiter() {
    let sel = document.getElementById('jenis_bbm');
    let hrg = parseFloat(sel.value) || 0;
    let biaya = parseFloat(document.getElementById('biaya_bbm').value) || 0;
    let liter = (hrg > 0 && biaya > 0) ? (biaya / hrg) : 0;
    document.getElementById('liter_bbm').value = liter ? liter.toFixed(2) : '';
  }

  // Autofill liter BBM dari biaya pada modal edit transaksi.
  // Harga per liter diambil dari dropdown jenis BBM (jika tersedia),
  // fallback ke harga BBM aktif pertama (bbmList).
  function calcEditLiter() {
    const biaya = parseFloat(document.getElementById('ed_biaya').value) || 0;
    const litEl = document.getElementById('ed_liter');
    const jenisSel = document.getElementById('ed_jenis_bbm');
    let harga = 0;
    if (jenisSel && jenisSel.value) {
      harga = parseFloat(jenisSel.value) || 0;
    } else {
      let bbm = (window.masterData && window.masterData.bbm) || [];
      harga = (bbm.length && parseFloat(bbm[0].harga)) || 0;
    }
    if (harga > 0 && biaya > 0) {
      litEl.value = (biaya / harga).toFixed(2);
    } else if (biaya === 0) {
      litEl.value = '';
    }
  }

  function switchMasterTab(tab) {
    __activeMasterTab = tab;
    document.querySelectorAll('.master-tab-content').forEach(el => {
      el.style.display = 'none';
    });
    document.getElementById('master-' + tab).style.display = 'block';
    document.querySelectorAll('#master-tabs .nav-link').forEach(btn => {
      btn.classList.remove('active');
    });
    document.querySelector('#master-tabs [data-tab="' + tab + '"]').classList.add('active');
    loadMasterData(tab);
  }

  function loadMasterData(tab) {
    tab = tab || __activeMasterTab || 'kendaraan';
    __activeMasterTab = tab;
    populateMasterFilter();

    if (tab === 'flazz') {
       if (typeof loadFlazzDataWrapper === 'function') loadFlazzDataWrapper();
       return;
    }

    var rid = ++__masterRequestId;
    var masterCabang = document.getElementById('master-filter-cabang') ? document.getElementById('master-filter-cabang').value : '';

    google.script.run
      .withSuccessHandler(function(data) {
        if (rid !== __masterRequestId) return;
        if (!data || typeof data !== 'object') {
           console.error('getMasterData returned invalid data:', data);
           showToast('Gagal memuat data master: respons server tidak valid', 'error');
           return;
        }
        if (Array.isArray(data.cabangList)) window.masterData.cabang = data.cabangList;
        if (tab === 'kendaraan') {
          var veh = data.vehicles || [];
          if (masterCabang) veh = veh.filter(function(v) { return String(v.cabang) === String(masterCabang); });
          renderKendaraanList(veh);
        } else if (tab === 'cabang') {
          renderCabangList(data.cabangList || []);
        } else if (tab === 'supir') {
          var drv = data.drivers || [];
          if (masterCabang) drv = drv.filter(function(d) { return String(d.cabang) === String(masterCabang); });
          renderSupirList(drv);
        } else if (tab === 'bbm') {
          renderBBMList(data.bbmList || []);
        } else if (tab === 'pengguna') {
          var usr = data.penggunaList || [];
          if (masterCabang) usr = usr.filter(function(u) { return String(u.cabang) === String(masterCabang); });
          renderPenggunaList(usr);
        }
      })
      .withFailureHandler(function(err) {
        if (rid !== __masterRequestId) return;
        showToast('Gagal memuat data: ' + err.message, 'error');
      })
      .getMasterData(bbmToken());
  }

  function showToast(message, type) {
    var container = document.getElementById('toast-container');
    if (!container) return;
    if (container.children.length >= 5) container.removeChild(container.firstChild);
    var toast = document.createElement('div');
    type = type || 'success';
    toast.className = 'app-toast ' + type;
    toast.setAttribute('role', 'status');
    var iconMap = { success: 'bi-check-circle text-success', error: 'bi-exclamation-circle text-danger', warning: 'bi-exclamation-triangle text-warning' };
    var icon = iconMap[type] || iconMap.success;
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'btn-close btn-close-sm ms-auto';
    closeBtn.setAttribute('aria-label', 'Tutup notifikasi');
    closeBtn.onclick = function() { removeToast(toast); };
    toast.innerHTML = '<i class="bi ' + icon + ' me-2"></i><span>' + escapeAttr(message) + '</span>';
    toast.appendChild(closeBtn);
    container.appendChild(toast);
    var delay = type === 'error' ? 6000 : 3500;
    setTimeout(function() { if (toast.parentNode) removeToast(toast); }, delay);
  }

  function removeToast(toast) {
    if (!toast || !toast.parentNode) return;
    toast.style.animation = 'slideOut 0.3s ease forwards';
    setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
  }

  // Modal konfirmasi custom (pengganti dialog konfirmasi native browser). Callback dipanggil saat tombol OK.
  var __confirmCallback = null;
  var __confirmResolve = null;
  var __confirmModal = null;

  function showConfirmModal(opts, onConfirm) {
    opts = opts || {};
    __confirmCallback = (typeof onConfirm === 'function') ? onConfirm : null;
    var modalEl = document.getElementById('modal-confirm');
    if (!modalEl) { showToast('Modal konfirmasi tidak ditemukan.', 'error'); return; }
    modalEl.__confirmResult = 'pending';
    var t = document.getElementById('modal-confirm-title');
    var m = document.getElementById('modal-confirm-message');
    var ok = document.getElementById('modal-confirm-ok');
    var cancel = document.getElementById('modal-confirm-cancel');
    if (t) t.textContent = opts.title || 'Konfirmasi';
    if (m) m.textContent = opts.message || 'Lanjutkan?';
    if (ok) {
      ok.textContent = opts.confirmLabel || 'Ya, Lanjutkan';
      ok.className = 'btn flex-fill ' + (opts.confirmClass || 'btn-danger');
      ok.onclick = function() { modalEl.__confirmResult = 'ok'; __confirmModal.hide(); };
    }
    if (cancel) cancel.onclick = function() { modalEl.__confirmResult = 'cancel'; __confirmModal.hide(); };
    if (!modalEl.dataset.hiddenHandler) {
      modalEl.addEventListener('hidden.bs.modal', function() {
        var confirmed = modalEl.__confirmResult === 'ok';
        modalEl.__confirmResult = 'pending';
        var cb = __confirmCallback;
        var rs = __confirmResolve;
        __confirmCallback = null;
        __confirmResolve = null;
        if (typeof rs === 'function') rs(confirmed);
        else if (confirmed && typeof cb === 'function') cb();
      });
      modalEl.dataset.hiddenHandler = '1';
    }
    if (!__confirmModal) __confirmModal = new bootstrap.Modal(modalEl);
    __confirmModal.show();
  }

  function confirmModalAsync(opts) {
    return new Promise(function(resolve) {
      __confirmResolve = resolve;
      showConfirmModal(opts);
    });
  }

    btn.dataset.origHtml = btnOrig;
    btn.disabled = true;

  function updateLiveSummary() {
    var txtTgl = document.getElementById('tanggal') ? document.getElementById('tanggal').value : '';
    document.getElementById('sum_tanggal').innerText = txtTgl || '-';
    
    var supir = document.getElementById('nama_supir') ? document.getElementById('nama_supir').value : '';
    document.getElementById('sum_supir').innerText = supir ? supir : '-';
    
    var vehObj = document.getElementById('vehicle');
    document.getElementById('sum_kendaraan').innerText = vehObj && vehObj.selectedIndex > 0 ? vehObj.options[vehObj.selectedIndex].text : '-';

    var kmAwal = parseFloat(document.getElementById('km_awal_val').value) || 0;
    var kmAkhir = parseFloat(document.getElementById('km_akhir_val').value) || 0;
    document.getElementById('sum_km_awal').innerText = kmAwal ? kmAwal : '-';
    document.getElementById('sum_km_akhir').innerText = kmAkhir ? kmAkhir : '-';
    
    if (kmAkhir > 0 && kmAkhir >= kmAwal) {
      document.getElementById('sum_jarak').innerText = (kmAkhir - kmAwal) + ' km';
    } else {
      document.getElementById('sum_jarak').innerText = '-';
    }

    var bAwal = document.getElementById('bar_awal').value;
    var bAkhir = document.getElementById('bar_akhir').value;
    document.getElementById('sum_bar_awal').innerText = bAwal ? bAwal + ' bar' : '-';
    document.getElementById('sum_bar_akhir').innerText = bAkhir ? bAkhir + ' bar' : '-';

    var biayaBbm = parseFloat(document.getElementById('biaya_bbm').value) || 0;
    var literBbm = parseFloat(document.getElementById('liter_bbm').value) || 0;
    document.getElementById('sum_bbm').innerText = 'Rp ' + biayaBbm.toLocaleString('id-ID');
    document.getElementById('sum_liter').innerText = literBbm > 0 ? literBbm.toFixed(2) + ' L' : '0 L';
    
    if (biayaBbm > 0) {
      var __mbR = document.getElementsByName('metode_pembayaran');
      var metodeBbm = 'TUNAI';
      for (var r of __mbR) { if (r.checked) { metodeBbm = r.value; break; } }
      if (metodeBbm === 'FLAZZ') {
        var fCard = document.getElementById('flazz_card_id');
        document.getElementById('sum_bayar_bbm').innerText = fCard && fCard.selectedIndex > 0 ? fCard.options[fCard.selectedIndex].text : 'Kartu Flazz';
      } else {
        document.getElementById('sum_bayar_bbm').innerText = 'Tunai';
      }
    } else {
      document.getElementById('sum_bayar_bbm').innerText = '-';
    }

    var biayaTol = parseFloat(document.getElementById('biaya_toll').value) || 0;
    document.getElementById('sum_tol').innerText = 'Rp ' + biayaTol.toLocaleString('id-ID');
    
    if (biayaTol > 0) {
      var __mtR = document.getElementsByName('metode_toll');
      var metodeTol = 'TUNAI';
      for (var r of __mtR) { if (r.checked) { metodeTol = r.value; break; } }
      if (metodeTol === 'FLAZZ') {
        var fTolCard = document.getElementById('flazz_card_id_toll');
        document.getElementById('sum_bayar_tol').innerText = fTolCard && fTolCard.selectedIndex > 0 ? fTolCard.options[fTolCard.selectedIndex].text : 'Kartu Flazz';
      } else {
        document.getElementById('sum_bayar_tol').innerText = 'Tunai';
      }
    } else {
      document.getElementById('sum_bayar_tol').innerText = '-';
    }

    var total = biayaBbm + biayaTol;
    document.getElementById('sum_total').innerText = 'Rp ' + total.toLocaleString('id-ID');
  }
