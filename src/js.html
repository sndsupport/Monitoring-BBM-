<script>
  let formDataPayload = {};
  let userRole = '';
  let ocrModal;
  let userInfo = null;
  window.masterData = { kendaraan: [], cabang: [], supir: [], bbm: [] };
  let allVehicles = [];
  let allDrivers = [];

  document.addEventListener('DOMContentLoaded', function() {
    ocrModal = new bootstrap.Modal(document.getElementById('ocrModal'));
    document.getElementById('tanggal').valueAsDate = new Date();
    
    loadAppSettings();
    
    var kmAwalInput = document.getElementById('km_awal_val');
    var kmAkhirInput = document.getElementById('km_akhir_val');
    if (kmAwalInput) kmAwalInput.addEventListener('input', updateOCRSummary);
    if (kmAkhirInput) kmAkhirInput.addEventListener('input', updateOCRSummary);
    
    let storedUser = localStorage.getItem('bbm_user');
    if (storedUser) {
       userInfo = JSON.parse(storedUser);
       loadInitialData(userInfo);
    } else {
       document.getElementById('page-login').style.display = 'block';
    }
  });

  function handleLogin() {
    let un = document.getElementById('login_username').value;
    let pw = document.getElementById('login_password').value;
    if(!un || !pw) return;

    let btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.innerText = 'Mengecek...';

    google.script.run.withSuccessHandler(function(res) {
       if (res.success) {
         userInfo = res;
         localStorage.setItem('bbm_user', JSON.stringify(res));
         showToast('Login berhasil!', 'success');
         loadInitialData(userInfo);
       } else {
          showToast(res.msg, 'error');
          btn.disabled = false;
          btn.innerText = 'Masuk';
       }
    }).doLogin(un, pw);
  }

  function logout() {
    localStorage.removeItem('bbm_user');
    document.getElementById('main-app').style.display = 'none';
    var bottomNav = document.getElementById('bottom-nav');
    if (bottomNav) bottomNav.style.display = 'none';
    document.getElementById('page-login').style.display = 'block';
    document.getElementById('page-form').style.display = 'none';
    document.getElementById('page-dashboard').style.display = 'none';
    document.getElementById('page-master').style.display = 'none';
    document.getElementById('page-settings').style.display = 'none';
    document.getElementById('login_username').value = '';
    document.getElementById('login_password').value = '';
    var btn = document.getElementById('btn-login');
    btn.disabled = false;
    btn.innerText = 'Masuk';
  }

  function loadInitialData(uInfo) {
    document.getElementById('page-login').style.display = 'none';
    
    let btn = document.getElementById('btn-login');
    if(btn) btn.innerText = 'Memuat Data...';

    google.script.run
      .withFailureHandler(function(err) {
         showToast('Terjadi kesalahan server: ' + err.message, 'error');
         logout();
      })
      .withSuccessHandler(function(data) {
        if (data.error) {
           logout();
           return;
        }

        document.getElementById('main-app').style.display = 'block';
        var bottomNav = document.getElementById('bottom-nav');
        if (bottomNav) bottomNav.style.display = 'flex';
        
        userRole = data.role;
        document.getElementById('user-info').innerHTML = data.user + ' (' + userRole + ' - ' + data.cabang + ') <a href="#" onclick="logout()" class="text-warning ms-2">Logout</a>';
        
        if (userRole === 'SUPERADMIN') {
          document.getElementById('nav-master').classList.remove('d-none');
          document.getElementById('nav-settings').classList.remove('d-none');
          document.getElementById('btn-nav-master').style.display = 'flex';
          document.getElementById('btn-nav-settings').style.display = 'flex';
          var inputCabangFilter = document.getElementById('input-cabang-filter');
          if (inputCabangFilter) inputCabangFilter.style.display = 'block';
        }
        
        let roleAlert = document.getElementById('role-alert');
        if (userRole === 'SUPERADMIN') {
          if(roleAlert) {
             roleAlert.className = 'alert alert-warning text-center';
             roleAlert.innerHTML = '<small><i class="bi bi-shield-check me-1"></i> Anda login sebagai SUPERADMIN. Akses penuh ke seluruh cabang.</small>';
          }
        } else {
          if(roleAlert) {
             roleAlert.className = 'alert alert-info text-center';
             roleAlert.innerHTML = '<small><i class="bi bi-info-circle me-1"></i> Anda login sebagai ' + userRole + '. Cabang: ' + data.cabang + '</small>';
          }
        }

        let selectVeh = document.getElementById('vehicle');
        selectVeh.innerHTML = ''; 
        data.vehicles.forEach(v => {
          let opt = document.createElement('option');
          opt.value = v.vehicle_id;
          opt.text = v.plat_nomor + ' - ' + v.nama;
          selectVeh.appendChild(opt);
        });
        
        let selectSupir = document.getElementById('nama_supir');
        selectSupir.innerHTML = '';
        if (data.drivers) {
          data.drivers.forEach(d => {
            let opt = document.createElement('option');
            opt.value = d.nama;
            opt.text = d.nama + ' (' + d.id + ')';
            selectSupir.appendChild(opt);
          });
        }

        let selectCabang = document.getElementById('m_cabang');
        let selectCabangSupir = document.getElementById('m_cabang_supir');
        if (selectCabang) {
           selectCabang.innerHTML = '';
           if(selectCabangSupir) selectCabangSupir.innerHTML = '';
           
           data.cabangList.forEach(c => {
             let opt = document.createElement('option');
             opt.value = c.kode;
             opt.text = c.nama;
             selectCabang.appendChild(opt);
             
             if(selectCabangSupir) {
               let opt2 = document.createElement('option');
               opt2.value = c.kode;
               opt2.text = c.nama;
               selectCabangSupir.appendChild(opt2);
             }
           });
        }

        let selectBBM = document.getElementById('jenis_bbm');
        if (selectBBM && data.bbmList) {
          selectBBM.innerHTML = '<option value="">-- Pilih BBM --</option>';
          data.bbmList.forEach(b => {
             let opt = document.createElement('option');
             opt.value = b.harga;
             opt.text = b.jenis + ' (Rp ' + b.harga + '/L)';
             opt.dataset.jenis = b.jenis;
             selectBBM.appendChild(opt);
          });
        }

        let filterCabang = document.getElementById('filter-cabang');
        if (filterCabang && data.cabangList) {
          filterCabang.innerHTML = '<option value="">Semua Cabang</option>';
          data.cabangList.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c.kode;
            opt.text = c.nama;
            filterCabang.appendChild(opt);
          });
        }

        let inputCabang = document.getElementById('input-cabang');
        if (inputCabang && data.cabangList) {
          inputCabang.innerHTML = '<option value="">Semua Cabang</option>';
          data.cabangList.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c.kode;
            opt.text = c.nama;
            inputCabang.appendChild(opt);
          });
        }

        allVehicles = data.vehicles || [];
        allDrivers = data.drivers || [];

        loadAppSettings();
        switchTab('form');
      })
      .processInitialData(uInfo);
  }

  function loadAppSettings() {
    google.script.run
      .withSuccessHandler(function(settings) {
        if (settings.logo_url) {
          var logoHtml = '<img src="' + settings.logo_url + '" alt="Logo" style="max-height: 100px; max-width: 200px;">';
          var loginLogo = document.getElementById('login-logo');
          if (loginLogo) loginLogo.innerHTML = logoHtml;
          var mainLogo = document.getElementById('main-logo');
          if (mainLogo) { mainLogo.innerHTML = logoHtml; mainLogo.style.display = 'block'; }
        }
        if (settings.app_name) {
          document.getElementById('login-app-name').innerText = settings.app_name;
          var brand = document.querySelector('.navbar-brand');
          if (brand) brand.innerText = settings.app_name;
        }
        if (settings.company_name) {
          document.getElementById('login-company-name').innerText = settings.company_name;
        }
      })
      .getAppSettings();
  }

  function switchTab(tab) {
    document.getElementById('page-form').style.display = 'none';
    document.getElementById('page-dashboard').style.display = 'none';
    document.getElementById('page-master').style.display = 'none';
    document.getElementById('page-settings').style.display = 'none';
    
    if (tab === 'form') {
      document.getElementById('page-form').style.display = 'block';
    } else if (tab === 'dashboard') {
      document.getElementById('page-dashboard').style.display = 'block';
    } else if (tab === 'master') {
      document.getElementById('page-master').style.display = 'block';
    } else if (tab === 'settings') {
      document.getElementById('page-settings').style.display = 'block';
      if (typeof loadSettings === 'function') loadSettings();
    }
    
    document.querySelectorAll('.top-tabs .nav-link').forEach(link => {
      link.classList.remove('active');
    });
    if (document.getElementById('tab-' + tab)) {
      document.getElementById('tab-' + tab).classList.add('active');
    }
    
    document.querySelectorAll('.btn-nav').forEach(btn => {
      btn.classList.remove('active');
    });
    let activeBtn = document.querySelector('.btn-nav[data-tab="' + tab + '"]');
    if (activeBtn) activeBtn.classList.add('active');
    
    if (tab === 'dashboard') loadDashboard();
  }

  function previewPhoto(input, previewId) {
    if (input.files && input.files[0]) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var previewDiv = document.getElementById(previewId);
        previewDiv.style.display = 'block';
        previewDiv.querySelector('img').src = e.target.result;
        input.closest('.photo-upload').classList.add('has-image');
        input.closest('.photo-upload').querySelector('span').textContent = 'Foto sudah dipilih';
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function toggleBBM(value, btn) {
    document.getElementById('isi_bensin').value = value;
    document.getElementById('bbm-section').style.display = (value === 'Ya') ? 'block' : 'none';
    btn.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function toggleToll(value, btn) {
    document.getElementById('isi_toll').value = value;
    document.getElementById('toll-section').style.display = (value === 'Ya') ? 'block' : 'none';
    btn.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function toggleSection(id, val) {
    document.getElementById(id).style.display = (val === 'Ya') ? 'block' : 'none';
  }

  function getBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) { resolve(null); return; }
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  async function processDailyReport() {
    let odoAwal = document.getElementById('foto_odo_awal').files[0];
    let odoAkhir = document.getElementById('foto_odo_akhir').files[0];
    let strukBBM = document.getElementById('foto_struk_bbm').files[0];
    let strukToll = document.getElementById('foto_struk_toll').files[0];

    if (!document.getElementById('daily-form').checkValidity()) {
      document.getElementById('daily-form').reportValidity();
      return;
    }

    let btn = document.getElementById('btn-process');
    let originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = "<span class='spinner-border spinner-border-sm'></span> Sedang Upload & Proses OCR...";

    try {
      let bbmSelect = document.getElementById('jenis_bbm');
      let bbmNama = '';
      if(bbmSelect.selectedIndex > 0) {
        bbmNama = bbmSelect.options[bbmSelect.selectedIndex].dataset.jenis;
      }

      formDataPayload = {
        vehicle_id: document.getElementById('vehicle').value,
        nama_supir: document.getElementById('nama_supir').value,
        tanggal: document.getElementById('tanggal').value,
        bar_awal: document.getElementById('bar_awal').value,
        bar_akhir: document.getElementById('bar_akhir').value,
        liter_bbm: document.getElementById('liter_bbm').value || 0,
        biaya_bbm: document.getElementById('biaya_bbm').value || 0,
        jenis_bbm_nama: bbmNama,
        biaya_toll: document.getElementById('biaya_toll').value || 0,
        foto_odo_awal: await getBase64(odoAwal),
        foto_odo_awal_name: odoAwal.name,
        foto_odo_akhir: await getBase64(odoAkhir),
        foto_odo_akhir_name: odoAkhir.name,
        foto_struk_bbm: strukBBM ? await getBase64(strukBBM) : null,
        foto_struk_bbm_name: strukBBM ? strukBBM.name : null,
        foto_struk_toll: strukToll ? await getBase64(strukToll) : null,
        foto_struk_toll_name: strukToll ? strukToll.name : null
      };

      google.script.run
        .withSuccessHandler(function(res) {
           btn.disabled = false;
           btn.innerHTML = originalText;
           if(res.success) {
             document.getElementById('km_awal_val').value = res.km_awal || '';
             document.getElementById('km_akhir_val').value = res.km_akhir || '';
              formDataPayload.serverData = res;
              updateOCRSummary();
              ocrModal.show();
           } else {
              showToast('Terjadi kesalahan memproses foto: ' + res.error, 'error');
           }
        })
        .withFailureHandler(function(err){
           showToast('Gagal menghubungi server: ' + err.message, 'error');
           btn.disabled = false;
           btn.innerHTML = originalText;
        })
        .processDailyImages(formDataPayload);

    } catch (e) {
      showToast('Error membaca file: ' + e.toString(), 'error');
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  }
  
  function updateOCRSummary() {
    var kmAwal = parseFloat(document.getElementById('km_awal_val').value) || 0;
    var kmAkhir = parseFloat(document.getElementById('km_akhir_val').value) || 0;
    var kmTempuh = kmAkhir - kmAwal;
    
    if (kmTempuh > 0) {
      document.getElementById('summary-km').textContent = kmTempuh + ' KM';
      document.getElementById('ocr-summary').style.display = 'block';
      
      var literBBM = parseFloat(document.getElementById('liter_bbm').value) || 0;
      var biayaBBM = parseFloat(document.getElementById('biaya_bbm').value) || 0;
      var biayaToll = parseFloat(document.getElementById('biaya_toll').value) || 0;
      
      var totalBiaya = biayaBBM + biayaToll;
      
      document.getElementById('summary-bbm').textContent = literBBM ? literBBM + ' L' : '-';
      document.getElementById('summary-bbm-cost').textContent = biayaBBM ? formatCurrency(biayaBBM) : '-';
      document.getElementById('summary-toll').textContent = biayaToll ? formatCurrency(biayaToll) : '-';
      document.getElementById('summary-total').textContent = formatCurrency(totalBiaya);
    } else {
      document.getElementById('ocr-summary').style.display = 'none';
    }
  }

  function confirmAndSave() {
     let btn = document.getElementById('btn-save');
     btn.disabled = true;
     btn.innerHTML = "<span class='spinner-border spinner-border-sm'></span> Menyimpan...";

     formDataPayload.km_awal_confirmed = document.getElementById('km_awal_val').value;
     formDataPayload.km_akhir_confirmed = document.getElementById('km_akhir_val').value;

      google.script.run
         .withSuccessHandler(function(res) {
            if (res.success) {
              showToast('Laporan Harian Berhasil Disimpan!', 'success');
              document.getElementById('daily-form').reset();
              document.getElementById('page-form').style.display = 'block';
              document.getElementById('page-dashboard').style.display = 'none';
            } else {
              showToast('Gagal menyimpan: ' + res.error, 'error');
             btn.disabled = false;
             btn.innerText = 'Simpan Data Permanen';
           }
        })
        .withFailureHandler(function(err) {
           showToast('Gagal menyimpan: ' + err.message, 'error');
           btn.disabled = false;
           btn.innerText = 'Simpan Data Permanen';
        })
        .saveDailyTransaction(formDataPayload);
  }

  function loadDashboard() {
    let tbody = document.getElementById('dashboard-tbody');
    let cardsContainer = document.getElementById('dashboard-cards');
    let emptyState = document.getElementById('dashboard-empty');
    let loadingState = document.getElementById('dashboard-loading');
    
    tbody.innerHTML = '';
    cardsContainer.innerHTML = '';
    emptyState.style.display = 'none';
    loadingState.style.display = 'block';
    
    google.script.run
      .withSuccessHandler(function(data) {
        loadingState.style.display = 'none';
        
        if (data.length === 0) {
          emptyState.style.display = 'block';
          return;
        }
        
        data.forEach(row => {
          let tr = document.createElement('tr');
          let links = "<a href='" + row.foto_odo_awal + "' target='_blank' class='btn btn-sm btn-outline-primary'><i class='bi bi-image'></i></a> ";
          links += "<a href='" + row.foto_odo_akhir + "' target='_blank' class='btn btn-sm btn-outline-primary'><i class='bi bi-image'></i></a>";
          
          tr.innerHTML = 
            "<td>" + row.tanggal + "</td>" +
            "<td>" + row.cabang + "</td>" +
            "<td>" + row.supir + "</td>" +
            "<td>" + row.vehicle + "</td>" +
            "<td class='text-center'>" + row.km_tempuh + " KM</td>" +
            "<td class='text-center'>" + row.liter + " L</td>" +
            "<td class='text-center'>" + (row.efisiensi ? row.efisiensi + " KM/L" : "-") + "</td>" +
            "<td class='text-center'>" + formatCurrency(row.toll) + "</td>" +
            "<td class='text-center'>" + links + "</td>";
          tbody.appendChild(tr);
        });
        
        data.forEach(row => {
          let card = document.createElement('div');
          card.className = 'card mb-3';
          card.innerHTML = 
            "<div class='card-header bg-light'>" +
              "<div class='d-flex justify-content-between align-items-center'>" +
                "<div><i class='bi bi-calendar me-1'></i> " + row.tanggal + "</div>" +
                "<small class='text-muted'>" + row.cabang + "</small>" +
              "</div>" +
            "</div>" +
            "<div class='card-body'>" +
              "<div class='mb-2'><strong>" + row.vehicle + "</strong></div>" +
              "<div class='mb-2 text-muted'><i class='bi bi-person me-1'></i> " + row.supir + "</div>" +
              "<div class='row g-2 mb-2'>" +
                "<div class='col-6'>" +
                  "<div class='stats-box'>" +
                    "<div class='stats-label'>KM Tempuh</div>" +
                    "<div class='stats-value'>" + row.km_tempuh + " KM</div>" +
                  "</div>" +
                "</div>" +
                "<div class='col-6'>" +
                  "<div class='stats-box'>" +
                    "<div class='stats-label'>BBM</div>" +
                    "<div class='stats-value'>" + row.liter + " L</div>" +
                  "</div>" +
                "</div>" +
              "</div>" +
              "<div class='d-flex justify-content-between align-items-center'>" +
                "<small><i class='bi bi-fuel-pump me-1'></i> " + (row.efisiensi ? row.efisiensi + " KM/L" : "-") + "</small>" +
                "<small><i class='bi bi-signpost-2 me-1'></i> " + formatCurrency(row.toll) + "</small>" +
              "</div>" +
              "<div class='mt-2 pt-2 border-top'>" +
                "<a href='" + row.foto_odo_awal + "' target='_blank' class='btn btn-sm btn-outline-primary me-1'>" +
                  "<i class='bi bi-camera me-1'></i> Awal" +
                "</a>" +
                "<a href='" + row.foto_odo_akhir + "' target='_blank' class='btn btn-sm btn-outline-primary'>" +
                  "<i class='bi bi-camera me-1'></i> Akhir" +
                "</a>" +
              "</div>" +
            "</div>";
          cardsContainer.appendChild(card);
        });
      })
      .withFailureHandler(function(err) {
        loadingState.style.display = 'none';
        showToast('Gagal memuat dashboard: ' + err.message, 'error');
      })
      .getDashboardData(userInfo);
  }

  function formatCurrency(value) {
    if (!value || value === '0') return 'Rp 0';
    return 'Rp ' + parseInt(value).toLocaleString('id-ID');
  }

  function resetFilters() {
    document.getElementById('filter-cabang').value = '';
    document.getElementById('filter-bulan').value = '';
    loadDashboard();
  }


  function onSupirChange() {
    let supirName = document.getElementById('nama_supir').value;
    if (!supirName) return;
    let d = allDrivers.find(x => x.nama === supirName);
    if (d && d.default_vehicle_id) {
      let vSel = document.getElementById('vehicle');
      if (vSel) vSel.value = d.default_vehicle_id;
    }
  }

  function filterFormByCabang() {
    let cabang = document.getElementById('input-cabang').value;
    let selectVeh = document.getElementById('vehicle');
    let selectSupir = document.getElementById('nama_supir');
    selectVeh.innerHTML = '';
    selectSupir.innerHTML = '';
    let filteredV = cabang ? allVehicles.filter(v => v.cabang === cabang) : allVehicles;
    let filteredD = cabang ? allDrivers.filter(d => d.cabang === cabang) : allDrivers;
    filteredV.forEach(v => {
      let opt = document.createElement('option');
      opt.value = v.vehicle_id;
      opt.text = v.plat_nomor + ' - ' + v.nama;
      selectVeh.appendChild(opt);
    });
    filteredD.forEach(d => {
      let opt = document.createElement('option');
      opt.value = d.nama;
      opt.text = d.nama + ' (' + d.id + ')';
      selectSupir.appendChild(opt);
    });
  }


  function closeBootstrapModal(modalId) {
    var modalEl = document.getElementById(modalId);
    if (modalEl) {
      var modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();
    }
  }

  function editKendaraan(id) {
    let v = window.masterData.kendaraan.find(x => x.vehicle_id === id);
    if(v) {
      document.getElementById('m_edit_id_kendaraan').value = v.vehicle_id;
      document.getElementById('m_plat').value = v.plat_nomor;
      document.getElementById('m_nama_kendaraan').value = v.nama;
      document.getElementById('m_jenis_kendaraan').value = v.jenis;
      document.getElementById('m_merk').value = v.merk || '';
      document.getElementById('m_model').value = v.model || '';
      document.getElementById('m_kapasitas').value = v.kapasitas_tangki || '';
      document.getElementById('m_bar').value = v.jumlah_bar || '';
      document.getElementById('m_standar').value = v.standar_km_l || '';
      document.getElementById('m_cabang').value = v.cabang;
      var modal = new bootstrap.Modal(document.getElementById('modal-kendaraan'));
      modal.show();
    }
  }
  function editCabang(kode) {
    let c = window.masterData.cabang.find(x => x.kode === kode);
    if(c) {
      document.getElementById('m_edit_old_kode_cabang').value = c.kode;
      document.getElementById('m_kode_cabang').value = c.kode;
      document.getElementById('m_nama_cabang').value = c.nama;
      document.getElementById('m_lokasi_cabang').value = c.lokasi || '';
      var modal = new bootstrap.Modal(document.getElementById('modal-cabang'));
      modal.show();
    }
  }
  function filterKendaraanSupir() {
    let cabang = document.getElementById('m_cabang_supir').value;
    let sel = document.getElementById('m_default_vehicle');
    if(!sel) return;
    sel.innerHTML = '<option value="">-- Tidak ada --</option>';
    let filteredV = cabang ? window.masterData.kendaraan.filter(v => v.cabang === cabang) : window.masterData.kendaraan;
    filteredV.forEach(v => {
      let opt = document.createElement('option');
      opt.value = v.vehicle_id;
      opt.text = v.plat_nomor + ' - ' + v.nama;
      sel.appendChild(opt);
    });
  }

  function prepareAddSupir() {
    document.getElementById('form-supir').reset();
    document.getElementById('m_edit_id_supir').value = '';
    filterKendaraanSupir();
  }

  function editSupir(id) {
    let d = window.masterData.supir.find(x => x.id === id);
    if(d) {
      document.getElementById('m_edit_id_supir').value = d.id;
      document.getElementById('m_nama_supir').value = d.nama;
      document.getElementById('m_cabang_supir').value = d.cabang;
      
      filterKendaraanSupir();
      let defaultSel = document.getElementById('m_default_vehicle');
      if (defaultSel && d.default_vehicle_id) {
        defaultSel.value = d.default_vehicle_id;
      }

      var modal = new bootstrap.Modal(document.getElementById('modal-supir'));
      modal.show();
    }
  }

  function calcLiter() {
    let sel = document.getElementById('jenis_bbm');
    let hrg = parseFloat(sel.value) || 0;
    let biaya = parseFloat(document.getElementById('biaya_bbm').value) || 0;
    let liter = (hrg > 0 && biaya > 0) ? (biaya / hrg) : 0;
    document.getElementById('liter_bbm').value = liter ? liter.toFixed(2) : '';
  }

  function switchMasterTab(tab) {
    document.querySelectorAll('.master-tab-content').forEach(el => {
      el.style.display = 'none';
    });
    document.getElementById('master-' + tab).style.display = 'block';
    document.querySelectorAll('#master-tabs .nav-link').forEach(btn => {
      btn.classList.remove('active');
    });
    document.querySelector('#master-tabs [data-tab="' + tab + '"]').classList.add('active');
    loadMasterData(tab);
  }

  function loadMasterData(tab) {
    google.script.run
      .withSuccessHandler(function(data) {
        if (tab === 'kendaraan') {
          renderKendaraanList(data.vehicles || []);
        } else if (tab === 'cabang') {
          renderCabangList(data.cabangList || []);
        } else if (tab === 'supir') {
          renderSupirList(data.drivers || []);
        } else if (tab === 'bbm') {
          renderBBMList(data.bbmList || []);
        }
      })
      .withFailureHandler(function(err) {
        showToast('Gagal memuat data: ' + err.message, 'error');
      })
      .getMasterData(userInfo);
  }

  function renderKendaraanList(vehicles) {
    window.masterData.kendaraan = vehicles;
    let container = document.getElementById('list-kendaraan');
    if (vehicles.length === 0) {
      container.innerHTML = '<div class="list-group-item text-center text-muted py-4">Belum ada data kendaraan</div>';
      return;
    }
    container.innerHTML = vehicles.map(v => 
      '<div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">' +
        '<div class="d-flex align-items-center">' +
          '<div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px;">' +
            '<i class="bi ' + (v.jenis === 'Motor' ? 'bi-bicycle' : 'bi-car-front-fill') + ' fs-5"></i>' +
          '</div>' +
          '<div>' +
            '<div class="fw-bold mb-1 fs-6">' + v.plat_nomor + '</div>' +
            '<div class="d-flex align-items-center small text-muted">' +
              '<span class="badge bg-secondary me-2">' + v.nama + '</span>' +
              '<span>' + v.jenis + ' - ' + v.cabang + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<button class="btn btn-sm btn-outline-primary me-2" onclick="editKendaraan(\'' + v.vehicle_id + '\')"><i class="bi bi-pencil"></i></button>' +
          '<button class="btn btn-sm btn-outline-danger" onclick="deleteKendaraan(\'' + v.vehicle_id + '\')"><i class="bi bi-trash"></i></button>' +
        '</div>' +
      '</div>'
    ).join('');
  }

  function showToast(message, type) {
    var container = document.getElementById('toast-container');
    if (!container) return;
    var toast = document.createElement('div');
    toast.className = 'app-toast ' + (type || 'success');
    var icon = type === 'error' ? 'bi-exclamation-circle text-danger' : 'bi-check-circle text-success';
    toast.innerHTML = '<i class="bi ' + icon + ' me-2"></i><span>' + message + '</span>';
    container.appendChild(toast);
    setTimeout(function() {
      toast.style.animation = 'slideOut 0.3s ease forwards';
      setTimeout(function() { toast.remove(); }, 300);
    }, 3000);
  }
